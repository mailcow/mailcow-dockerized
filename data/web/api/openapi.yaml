security:
  - ApiKeyAuth: []

paths:
  /api/v1/add/alias:
    post:
      tags:
        - Aliases
      summary: Create aliases
      operationId: addAlias
      description: >-
        Creates an alias for every address in `address`, all with the same
        destinations. Administrators and API keys may use every domain, domain
        administrators their own domains.


        Every address is checked on its own and gets its own message:
        `alias_added` (address, new ID) on success, else `is_alias_or_mailbox`,
        `domain_not_found`, `is_spam_alias`, `alias_invalid` or
        `access_denied`. An address that is also one of the destinations is
        skipped without message. `max_alias_exceeded` (the domain has no
        aliases left) stops the call at that address. Nothing is created with
        `comment_too_long`, `alias_empty`, `goto_empty` or when no destination
        is valid (`goto_invalid`: no e-mail address or a resource;
        `external_goto_denied`: not a mailcow domain while external
        destinations are disabled by `ALIAS_DISABLE_EXTERNAL_DOMAINS` or by the
        ACL of the domain administrator).


        Flags that are left out are 0: send `active`, `sogo_visible` and
        `sender_allowed` as 1 to get an alias like the UI creates it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: >-
                    Alias address, `@example.org` for a catch-all of the
                    domain. Several addresses can be separated by spaces,
                    commas, semicolons or line breaks. The domain must be a
                    mailcow domain or alias domain (IDN domains are stored in
                    punycode).
                goto:
                  type: string
                  description: >-
                    Destination addresses, separated by spaces, commas,
                    semicolons or line breaks. Required unless `goto_null`,
                    `goto_spam` or `goto_ham` is 1; ignored then.
                goto_null:
                  type: [boolean, integer, string]
                  description: >-
                    1 = discard the mail silently (destination
                    `null@localhost`). Wins over `goto_spam` and `goto_ham`.
                  default: 0
                goto_spam:
                  type: [boolean, integer, string]
                  description: >-
                    1 = learn the mail as spam (destination `spam@localhost`).
                    Wins over `goto_ham`.
                  default: 0
                goto_ham:
                  type: [boolean, integer, string]
                  description: 1 = learn the mail as ham (destination `ham@localhost`)
                  default: 0
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
                sogo_visible:
                  type: [boolean, integer, string]
                  description: >-
                    1 = the alias is a selectable sender in SOGo (aliases that
                    point to at least one local mailbox)
                  default: 0
                internal:
                  type: [boolean, integer, string]
                  description: >-
                    1 = internal alias: only reachable from its own domain and
                    the alias domains of it
                  default: 0
                sender_allowed:
                  type: [boolean, integer, string]
                  description: 1 = the destination mailboxes may send as this alias
                  default: 0
                public_comment:
                  type: string
                  description: Comment shown to the users, at most 160 characters
                  maxLength: 160
                private_comment:
                  type: string
                  description: Comment for administrators, at most 160 characters
                  maxLength: 160
              required:
                - address
            example:
              address: sales@example.org
              goto: anna@example.org,ben@example.org
              active: "1"
              sogo_visible: "1"
              sender_allowed: "1"
              internal: "0"
              public_comment: Sales team
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Create a time-limited alias
      operationId: addTimeLimitedAlias
      description: >-
        Creates a random alias (e.g. `kahd.osuwe@example.org`) that delivers to
        the mailbox until it expires. Needs the user ACL `spam_alias`. API keys
        must send `username` (without it the session user "API" is used and
        the call fails with `domain_invalid`); a mailbox user may leave it out
        (own mailbox) and gets `access_denied` for other mailboxes. `domain`
        must be the domain of the mailbox or one of its alias domains
        (`domain_invalid`). Errors: `validity_missing` (validity out of range).
        Success: `mailbox_modified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                username:
                  type: string
                  description: Mailbox the alias delivers to (required for API keys)
                domain:
                  type: string
                  description: Domain of the alias
                description:
                  type: string
                  default: ""
                  description: Note for the alias
                validity:
                  type: [integer, string]
                  minimum: 1
                  maximum: 87600
                  default: 8760
                  description: Hours until the alias expires
                permanent:
                  type: [boolean, integer, string]
                  default: false
                  description: true keeps the alias after it expired
            example:
              username: john.doe@example.org
              domain: example.org
              description: Online shop registration
              validity: 720
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/api-key:
    post:
      summary: Create API key
      description: >-
        Creates an API key with a random value. The answer does not contain the
        value: read it with `get/api-key/all`. Without `skip_ip_check` the key
        needs at least one IP address or network in `allow_from`.


        Success: `api_key_added` (with the description, else the ID). Errors:
        `api_key_access_invalid`, `api_key_description_invalid`,
        `api_key_network_invalid`, `ip_list_empty`.
      operationId: addApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiKeyAttributes"
                - required:
                    - access
            example:
              description: provisioning
              access: rw
              allow_from: "192.0.2.10, 2001:db8::/64"
              skip_ip_check: 0
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/app-passwd:
    post:
      tags:
        - App Passwords
      summary: Create an app password
      operationId: addAppPassword
      description: >-
        Adds an app password to a mailbox: a separate password for a client,
        valid only for the protocols listed. Needs the user ACL `app_passwds`.
        API keys must send `username` (without it the session user "API" is
        used and the call fails with `access_denied`); a mailbox user may leave
        it out (own mailbox). Errors: `access_denied`, `password_complexity`,
        `password_mismatch`, `app_name_empty`. Success: `app_passwd_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_name
                - app_passwd
                - app_passwd2
              properties:
                username:
                  type: string
                  description: Mailbox the app password belongs to (required for API keys)
                app_name:
                  type: string
                  description: Name of the app password
                app_passwd:
                  type: string
                  format: password
                  description: The password, checked against the password policy
                app_passwd2:
                  type: string
                  format: password
                  description: The password again
                protocols:
                  description: Protocols the password is valid for; not listed = not allowed
                  type: array
                  items:
                    type: string
                    enum:
                      - imap_access
                      - smtp_access
                      - pop3_access
                      - sieve_access
                      - dav_access
                      - eas_access
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: 1 active, 0 inactive
            example:
              username: john.doe@example.org
              app_name: Thunderbird
              app_passwd: eiQu4ahz8iePh
              app_passwd2: eiQu4ahz8iePh
              protocols:
                - imap_access
                - smtp_access
                - sieve_access
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/bcc:
    post:
      tags:
        - Address Rewriting
      summary: Create a BCC map
      operationId: addBccMap
      description: >-
        Sends a hidden copy of the mail of a domain or address to `bcc_dest`.
        Administrators, API keys and domain administrators with the BCC maps
        ACL may call it (domain administrators for their domains). The local
        destination is not informed when the copy cannot be delivered.


        Messages: `bcc_saved`; `invalid_bcc_map_type`, `bcc_empty`,
        `bcc_must_be_email`, `bcc_exists` (same `local_dest` and `type`),
        `access_denied` (no ACL, a domain or address the caller does not
        manage, or an address that is no mailbox or alias). A `local_dest` that
        is neither a domain nor an e-mail address answers `Cannot add item`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                local_dest:
                  type: string
                  description: >-
                    A mailcow domain (stored as `@example.org`, IDN in
                    punycode) or the address of a mailbox or alias
                bcc_dest:
                  type: string
                  description: >-
                    One e-mail address that gets the copies (use an alias for
                    several)
                type:
                  type: string
                  enum:
                    - sender
                    - rcpt
                  description: >-
                    `sender`: copy the mail sent by `local_dest`; `rcpt`: copy
                    the mail sent to it
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - local_dest
                - bcc_dest
                - type
            example:
              local_dest: example.org
              bcc_dest: archive@example.com
              type: rcpt
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/dkim:
    post:
      summary: Generate DKIM keys
      description: >-
        Generates an RSA DKIM key for each domain. Every domain must be a
        domain or alias domain the caller has access to and must not have a
        key yet. Success `dkim_added`, errors `dkim_domain_or_sel_invalid`
        (invalid domain or selector, key exists, key generation failed),
        `access_denied`.
      operationId: addDkimKey
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
                - key_size
              properties:
                domains:
                  type: string
                  description: >-
                    Domain names, separated by spaces, commas, semicolons or
                    line breaks
                dkim_selector:
                  type: string
                  default: dkim
                  description: Selector (letters, digits, `-`, `_`, `.`)
                key_size:
                  type: [integer, string]
                  description: RSA key size in bits (the UI offers 1024, 2048, 3072, 4096)
            example:
              domains: example.org, example.net
              dkim_selector: dkim
              key_size: 2048
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/dkim_duplicate:
    post:
      summary: Copy a DKIM key to other domains
      description: >-
        Copies the DKIM key and selector of `from_domain` to the domains in
        `to_domain`, replacing their keys. Admins only. The target names are
        not checked. Success `dkim_duplicated` per target, errors
        `access_denied`, `dkim_domain_or_sel_invalid` (`from_domain` has no
        key).
      operationId: duplicateDkimKey
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_domain
                - to_domain
              properties:
                from_domain:
                  type: string
                  description: Domain whose key is copied
                to_domain:
                  description: Domain name or list of domain names that get the key
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            example:
              from_domain: example.org
              to_domain:
                - example.net
                - example.com
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain:
    post:
      summary: Add a domain
      description: >-
        Adds a domain. Admins only (API keys are admins). Quotas are in MiB.
        Values that are not sent come from the domain template given in
        `template`, else from the first domain template (`Default`).
        `relay_all_recipients` = 1 sets `backupmx`, `relay_unknown_only` = 1
        sets both. Besides the domain this sets the rate limit (`rl_value`,
        `rl_frame`) and creates a DKIM key (`key_size`, `dkim_selector`; the
        Default template creates a 2048 bit key with selector `dkim`), so the
        answer can hold `rl_saved` and `dkim_added` (or
        `domain_add_dkim_available` when a key exists already) before
        `domain_added`. Errors: `access_denied`,
        `mailbox_defquota_exceeds_mailbox_maxquota`,
        `mailbox_quota_exceeds_domain_quota`, `defquota_empty`,
        `maxquota_empty`, `domain_invalid`, `object_is_not_numeric`,
        `domain_exists` (also for an alias domain of that name),
        `domain_cannot_match_hostname`. SOGo knows the domain only after a
        restart (`restart_sogo`); a failed restart answers
        `domain_added_sogo_failed` (warning) although the domain was added.
      operationId: addDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                  description: Domain name (stored lowercase, IDN as punycode)
                description:
                  type: string
                  description: Description, default the domain name
                template:
                  type: [integer, string]
                  description: >-
                    ID of the domain template that gives the values not sent
                    (see get/domain/template/all); default the first template
                aliases:
                  type: [integer, string]
                  description: Max. number of aliases
                mailboxes:
                  type: [integer, string]
                  description: Max. number of mailboxes
                defquota:
                  type: [integer, string]
                  description: Default quota of new mailboxes in MiB, must not be 0
                maxquota:
                  type: [integer, string]
                  description: Max. quota per mailbox in MiB, must not be 0
                quota:
                  type: [integer, string]
                  description: Quota of the whole domain in MiB
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: Domain active
                gal:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: >-
                    Global address list in SOGo (all objects of the domain)
                backupmx:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: Relay this domain (backup MX)
                relay_all_recipients:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: >-
                    Relay all recipients; else a mailbox is needed for every
                    recipient to relay. 1 sets `backupmx`.
                relay_unknown_only:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: >-
                    Relay non-existing mailboxes only, existing mailboxes are
                    delivered locally. 1 sets `backupmx` and
                    `relay_all_recipients`.
                tags:
                  type: array
                  items:
                    type: string
                  description: >-
                    Tags of the domain; tags beyond the tagging limit
                    (`TAGGING_LIMIT`, 25) are dropped with the warning
                    `tag_limit_exceeded`
                rl_value:
                  type: [integer, string]
                  description: Rate limit, messages per `rl_frame`; empty or 0 = none
                rl_frame:
                  type: string
                  enum: [s, m, h, d]
                  description: Rate limit time frame
                dkim_selector:
                  type: string
                  description: Selector of the DKIM key that is created
                key_size:
                  type: [integer, string]
                  description: >-
                    RSA key size in bits of the DKIM key that is created (the
                    UI offers 1024, 2048, 3072, 4096); empty or 0 = no key
                restart_sogo:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Restart SOGo afterwards
            example:
              domain: example.org
              description: Example Org
              aliases: 400
              mailboxes: 10
              defquota: 3072
              maxquota: 10240
              quota: 10240
              active: 1
              gal: 1
              backupmx: 0
              relay_all_recipients: 0
              relay_unknown_only: 0
              tags:
                - customer
              rl_value: 100
              rl_frame: h
              dkim_selector: dkim
              key_size: 2048
              restart_sogo: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain-admin:
    post:
      summary: Create domain administrator
      description: >-
        Creates a domain administrator, who manages mailboxes, aliases and
        the other objects of the given domains. The username is converted to
        lowercase; it may only contain letters, digits, `_`, `.` and `-` and
        must not be used by a mailbox, an administrator or a domain
        administrator. The new account gets the default ACLs (see
        `edit/da-acl`).


        Success: `domain_admin_added`. Errors: `domain_invalid` (no domain or an
        unknown domain), `username_invalid`, `object_exists`,
        `password_complexity`, `password_mismatch`. Unknown domains are skipped
        with `domain_invalid`; if none of the domains exists, the account is not
        created although `domain_admin_added` is reported too.
      operationId: addDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username (letters, digits, `_`, `.`, `-`; stored in lowercase)
                password:
                  type: string
                  description: Password, must match the password policy
                password2:
                  type: string
                  description: The password again
                domains:
                  description: Domain or list of domains the account administers
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                active:
                  type: [integer, string, boolean]
                  description: >-
                    1 = the account can log in, 0 = disabled. Missing counts as
                    0: send `1` for a usable account.
                  default: 0
              required:
                - username
                - password
                - password2
                - domains
            example:
              username: domainadmin1
              password: "Rand0m-Passw0rd!"
              password2: "Rand0m-Passw0rd!"
              domains:
                - example.org
                - example.com
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/sso/domain-admin:
    post:
      summary: Issue domain administrator login token
      description: >-
        Issues a one-time login token for a domain administrator. Opening
        `https://<mailcow host>/domainadmin/mailbox?sso_token=<token>` in a
        browser logs in as this domain administrator without password or
        two-factor authentication. The token is valid for 30 seconds, can be
        used once and only works for an active domain administrator.


        Errors: `access_denied`, `object_doesnt_exist` (no domain
        administrator of this name).
      operationId: issueDomainAdminSsoToken
      tags:
        - Single Sign-On
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username of the domain administrator
              required:
                - username
            example:
              username: domainadmin1
      responses:
        "200":
          description: The token, or the error messages
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Login token (five groups of six hex digits)
                    required:
                      - token
                  - $ref: "#/components/schemas/Messages"
              example:
                token: 591F6D-5C3DD2-7455CD-DAF1C1-AA4FCC
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/da-acl:
    post:
      summary: Edit domain administrator ACLs
      description: >-
        Sets the ACLs (permissions) of domain administrators: the ACLs in
        `da_acl` are granted, all others are revoked. An empty or missing
        `da_acl` revokes every ACL.


        One message per account. Success: `acl_saved`. Error: `Cannot
        determine current ACL` (no domain administrator of this name).
      operationId: editDomainAdminAcl
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Username of the domain administrator, or a list of usernames
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    da_acl:
                      description: The ACLs to grant (a single name or a list)
                      oneOf:
                        - $ref: "#/components/schemas/DomainAdminAcl"
                        - type: array
                          items:
                            $ref: "#/components/schemas/DomainAdminAcl"
              required:
                - items
                - attr
            example:
              items:
                - domainadmin1
              attr:
                da_acl:
                  - syncjobs
                  - quarantine
                  - login_as
                  - sogo_access
                  - app_passwds
                  - bcc_maps
                  - filters
                  - ratelimit
                  - spam_policy
                  - protocol_access
                  - smtp_ip_access
                  - mailbox_relayhost
                  - domain_relayhost
                  - alias_external_goto
                  - mailbox_groups
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain-admin:
    post:
      summary: Edit domain administrators
      description: >-
        Changes domain administrators. Attributes that are not sent keep their
        value, except `force_tfa` and `force_pw_update`, which are set to 0 when
        they are missing. `domains` replaces the list of domains; an empty or
        missing list keeps it. The password is only changed when `password` is
        not empty. Renaming an account moves its ACLs, two-factor
        authentication and the sync job sources it created to the new name
        (FIDO2 keys stay with the old name).


        One message per account. Success: `domain_admin_modified`. Errors:
        `access_denied` (no domain administrator of this name),
        `domain_invalid`, `username_invalid` (invalid `username_new` or the
        name of another domain administrator). A password that does not match
        `password2` or the policy (`password_mismatch`, `password_complexity`)
        stops the call, after the domains were already saved.
      operationId: editDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Username of the domain administrator, or a list of usernames
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    active:
                      type: [integer, string, boolean]
                      description: 1 = active, 0 = disabled
                    username_new:
                      type: string
                      description: New username (letters, digits, `_`, `.`, `-`)
                    domains:
                      description: The domains the account administers from now on
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                    password:
                      type: string
                      description: New password; empty or missing keeps the password
                    password2:
                      type: string
                      description: The new password again
                    force_tfa:
                      type: [integer, string, boolean]
                      description: 1 = two-factor authentication must be set up at the next login
                      default: 0
                    force_pw_update:
                      type: [integer, string, boolean]
                      description: 1 = the password must be changed at the next login
                      default: 0
                    disable_tfa:
                      type: [integer, string, boolean]
                      description: >-
                        Present (with any value) = deactivate the two-factor
                        authentication of the account
              required:
                - items
                - attr
            example:
              items:
                - domainadmin1
              attr:
                active: 1
                domains:
                  - example.org
                password: "N3w-Passw0rd!"
                password2: "N3w-Passw0rd!"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain-policy:
    post:
      summary: Add a sender to a domain allow or deny list
      description: >-
        Adds an entry to the allow list (`wl`) or deny list (`bl`) of a domain.
        Needs the ACL `spam_policy` (API keys have it). Success
        `domain_modified`, errors `access_denied` (also for an invalid domain or
        list), `policy_list_from_invalid`, `policy_list_from_exists` (the sender
        is on one of the lists already).
      operationId: addDomainPolicy
      tags:
        - Domain antispam policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - object_list
                - object_from
              properties:
                domain:
                  type: string
                  description: Domain the entry belongs to
                object_list:
                  type: string
                  enum: [wl, bl]
                  description: "`wl` allow list (whitelist), `bl` deny list (blacklist)"
                object_from:
                  type: string
                  description: >-
                    Sender address or pattern, `*` as wildcard (e.g.
                    `*@example.com`); letters, digits and `@ _ . - *`
            example:
              domain: example.org
              object_list: wl
              object_from: "*@partner.example.com"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Add forwarding hosts
      operationId: addForwardingHost
      description: >-
        Adds hosts whose incoming mail is accepted unconditionally: no DNSBL
        checks, no greylisting, spam is never rejected. A host or domain name
        is resolved to the addresses of its SPF record, else its MX hosts, else
        its A/AAAA records; every address becomes an entry with the name as
        `source`. Administrators and API keys only.


        Messages: `forwarding_host_added` (the addresses), `invalid_host`
        (nothing resolved), `access_denied`, `redis_error`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: >-
                    IPv4 or IPv6 address, network in CIDR notation, host name
                    or domain name
                filter_spam:
                  type: [boolean, integer, string]
                  description: >-
                    1 = scan the mail of the hosts for spam (it can be filed
                    into the junk folder, never rejected); anything else = do
                    not scan it
                  default: 0
              required:
                - hostname
            example:
              hostname: relay.example.com
              filter_spam: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Update forwarding hosts
      operationId: editForwardingHost
      description: >-
        Turns the spam filter of forwarding hosts on or off. Administrators and
        API keys only. Per host: `object_modified`, `access_denied` (unknown
        host), `redis_error`. Without `keep_spam` the spam filter is turned on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: >-
                    Hosts as get/fwdhost lists them (`host`), a single value or
                    a list
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    keep_spam:
                      type: [boolean, integer, string]
                      description: >-
                        1 = do not scan the mail of the host for spam; anything
                        else = scan it
              required:
                - items
                - attr
            example:
              items:
                - 192.0.2.25
                - "2001:db8::25"
              attr:
                keep_spam: "0"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Create a mailbox
      operationId: addMailbox
      description: >-
        Creates the mailbox `local_part@domain` with its alias entry, quota
        record and user ACL. Fields that are not sent take the values of the
        mailbox template given in `template` (by default the first template,
        "Default").


        Admins and domain admins (for their domains) may call it, mailbox users
        get `access_denied`. Checks: valid address (`mailbox_invalid`), domain
        exists (`domain_not_found`), address not in use by a mailbox, alias or
        time-limited alias (`object_exists`, `is_alias`, `is_spam_alias`),
        password policy (`password_complexity`, `password_mismatch`), mailbox
        count and quota limits of the domain (`max_mailbox_exceeded`,
        `mailbox_quota_exceeded`, `mailbox_quota_left_exceeded`), quota 0
        (unlimited) needs the `unlimited_quota` ACL (`unlimited_quota_acl`).
        Success: `mailbox_added`. Tags after the 26th are dropped with the
        warning `tag_limit_exceeded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxAdd"
            example:
              local_part: john.doe
              domain: example.org
              name: John Doe
              password: Moo2Shoh5aiXu
              password2: Moo2Shoh5aiXu
              quota: 3072
              active: 1
              force_pw_update: 1
              tags:
                - sales
              acl:
                - spam_alias
                - spam_score
                - delimiter_action
                - app_passwds
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/mailbox-group:
    post:
      summary: Create mailbox group
      description: >-
        Creates a mailbox group in a domain. With an address the group is a
        distribution list: mail to the address goes to all members (the group
        keeps an alias row for it that the alias API shows read-only, and it
        counts against the alias limit of the domain; it is inactive while the
        group is inactive or has no members). A group can also let
        its members send as other addresses (`send_as`, `sender_allowed`), open
        other mailboxes (`imap_grants`), see shared SOGo folders (`sogo_grants`)
        and get a mailbox template (`template_id`).


        Admins (every read/write API key) may create groups in every domain and
        set `template_id`, `priority` and `idp_ref`; domain admins need the
        `mailbox_groups` ACL and may only use their domains and mailboxes.
        Members must be regular mailboxes (no resources).


        Answers `group_added` plus warnings of the follow-up work
        (`group_too_many_members` when a group with an address has more than
        1000 members, `group_template_failed`, `group_imap_grant_failed`,
        `group_subscription_failed`, `group_sogo_init_failed`; failed steps
        are retried by a cron). Errors (nothing is written): `domain_not_found`,
        `access_denied`, `group_name_invalid`, `group_description_invalid`,
        `object_exists` (name exists in the domain), `group_address_invalid`,
        `is_alias_or_mailbox`, `max_alias_exceeded`, `group_member_invalid`,
        `group_member_idp`, `group_send_as_invalid`, `group_grant_invalid`,
        `template_id_invalid`, `group_priority_invalid`.
      operationId: addMailboxGroup
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - domain
                    - name
                  properties:
                    domain:
                      type: string
                      description: Domain of the group (no alias domain), case-insensitive
                - $ref: "#/components/schemas/MailboxGroupAttributes"
            example:
              domain: example.org
              name: Sales
              description: Sales team
              local_part: sales
              members:
                - alice@example.org
                - bob@example.org
              send_as:
                - orders@example.org
              sender_allowed: 1
              imap_grants:
                - owner: shared@example.org
                  rights: write
                  subscribe: 1
              template_id: 3
              priority: 10
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/oauth2-client:
    post:
      summary: Create OAuth2 client
      description: >-
        Creates an OAuth2 client with a random client ID and secret and the
        scope `profile`. The answer does not contain them: read them with
        `get/oauth2-client/all`. The redirect URI is not validated.


        Success: `Added client access`.
      operationId: addOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: Redirect (callback) URL of the client application
              required:
                - redirect_uri
            example:
              redirect_uri: https://app.example.org/oauth/callback
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/recipient_map:
    post:
      tags:
        - Address Rewriting
      summary: Create a recipient map
      operationId: addRecipientMap
      description: >-
        Replaces the recipient address of mail before delivery: mail to
        `recipient_map_old` goes to `recipient_map_new`. Administrators and API
        keys only (other callers get `Cannot add item`).


        Messages: `recipient_map_entry_saved`; `invalid_recipient_map_old`,
        `invalid_recipient_map_new`, `recipient_map_entry_exists`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_map_old:
                  type: string
                  description: >-
                    Original recipient: an e-mail address or a domain (stored
                    as `@example.org`, IDN in punycode; a leading `@` is
                    optional)
                recipient_map_new:
                  type: string
                  description: New recipient, an e-mail address or a domain
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - recipient_map_old
                - recipient_map_new
            example:
              recipient_map_old: jane.doe@example.org
              recipient_map_new: jane.smith@example.org
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/relayhost:
    post:
      tags:
        - Routing
      summary: Create a sender-dependent transport
      operationId: addRelayhost
      description: >-
        Adds a relay host for outgoing mail. Domains and mailboxes use it when
        their `relayhost` attribute is set to its ID (edit/domain,
        edit/mailbox). The service is always `smtp:` (TLS when offered, no
        SMTPS). The new entry is always active. Colons in `username` and
        `password` are stored as `\:` (in the password as `\\:`); edit/relayhost
        stores both unchanged. Administrators and API keys only.


        Messages: `relayhost_added` (without the host name),
        `invalid_host` (empty `hostname`), `access_denied`, `mysql_error`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: >-
                    Next hop: `host`, `host:25`, `[host]:587`, `[192.0.2.1]`
                    or `[192.0.2.1]:25`
                username:
                  type: string
                  description: SMTP user name, empty for no authentication
                  default: ""
                password:
                  type: string
                  description: SMTP password
                  default: ""
              required:
                - hostname
            example:
              hostname: "[smtp.example.com]:587"
              username: relay-user@example.com
              password: Secret-Passphrase-42
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/resource:
    post:
      tags:
        - Resources
      summary: Create a resource
      operationId: addResource
      description: >-
        Creates a bookable resource (room, equipment, group) for SOGo. Its
        address is made of the letters and digits of the description and the
        domain (description "Meeting Room 1" → `MeetingRoom1@example.org`).
        Admins and domain admins (for their domains). Errors:
        `resource_invalid` (address or kind invalid), `description_invalid`,
        `domain_invalid`, `access_denied`, `object_exists`, `is_alias`,
        `is_spam_alias`, `domain_not_found`. Success: `resource_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - description
                - kind
              properties:
                domain:
                  type: string
                  description: Domain of the resource
                description:
                  type: string
                  description: Name of the resource, also the source of its address
                kind:
                  type: string
                  enum:
                    - location
                    - group
                    - thing
                  description: Type of resource
                multiple_bookings:
                  type: [integer, string]
                  default: 0
                  description: >-
                    Booking rule: 0 always free (bookings are not limited and
                    do not block), -1 unlimited but shown as busy when booked,
                    n ≥ 1 at most n overlapping bookings; values below -1 mean -1
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: 1 active, 0 inactive
            example:
              domain: example.org
              description: Meeting Room 1
              kind: location
              multiple_bookings: 0
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/syncjob:
    post:
      summary: Create sync job
      description: >-
        Creates a sync job that copies the remote account `user1` of a sync
        source into a local mailbox. Host, port, encryption and authentication
        come from the source (`source_id`); the job only carries the remote
        login. Needs the `syncjobs` ACL (admins and API keys have it); the
        caller must have access to the local mailbox. An API key must name the
        mailbox in `username` (`no_user_defined` otherwise), mailbox users
        always create jobs for their own mailbox.


        Answers `mailbox_modified` with the local mailbox. Errors:
        `access_denied` (no access to the mailbox, `mins_interval` missing or
        not 1-43800, `exclude` no valid regular expression), `no_user_defined`,
        `imapsync_user1_invalid`, `imapsync_source_unavailable` (source unknown,
        invisible to the caller or inactive), `password_empty`,
        `imapsync_source_oauth_connect_required` (XOAUTH2 authorization_code
        source without a sign-in of the mailbox for `user1`), `object_exists`
        (the mailbox already syncs `user1` from this source),
        `imapsync_custom_params_format`, `imapsync_custom_param_invalid`,
        `imapsync_custom_param_value`. Passwords are logged as `*`.
      operationId: addSyncJob
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - username
                    - source_id
                    - user1
                    - mins_interval
                  properties:
                    username:
                      type: string
                      description: >-
                        Local mailbox the job syncs into (`user2`); cannot be
                        changed later. Optional for mailbox users (own mailbox).
                - $ref: "#/components/schemas/SyncJobAttributes"
            example:
              username: alice@example.org
              source_id: 3
              user1: alice@old-provider.example.com
              password1: remote-password
              mins_interval: 20
              subfolder2: Imported
              exclude: "(?i)spam|(?i)junk"
              custom_params:
                - o: folder
                  v: INBOX
              delete2duplicates: 1
              automap: 1
              subscribeall: 1
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/syncjob_source:
    post:
      summary: Create sync source
      description: >-
        Creates a reusable IMAP sync source: server, encryption and
        authentication of a remote system that sync jobs use by `source_id`.
        Password sources (PLAIN, LOGIN, CRAM-MD5) take the password from each
        job, XOAUTH2 sources carry an OAuth2 client (client_credentials: one
        token of the source for every mailbox of the tenant; authorization_code:
        every mailbox owner signs in once in the mailcow UI). The creator is
        stored in `created_by` (`API` for API keys); names are unique per
        creator. Needs the `syncjobs` ACL. Only admins create `all` sources;
        XOAUTH2 sources are created by admins and domain admins only. OAuth2
        endpoints must be https:// URLs with a valid host name; for sources
        not created by a superadmin or an API key every resolved address must
        also be public.


        A client_credentials source fetches its token while it is saved: the
        source is saved even when that fails, the answer then also has
        `imapsync_source_token_refresh_failed`. Answers
        `imapsync_source_added`. Errors (nothing is written):
        `imapsync_source_name_invalid`, `imapsync_source_description_invalid`,
        `imapsync_source_host_invalid`, `imapsync_source_port_invalid`,
        `imapsync_source_enc_invalid`, `imapsync_source_auth_invalid`,
        `imapsync_source_oauth_required`, `imapsync_source_oauth_invalid`,
        `imapsync_source_oauth_endpoint_invalid`,
        `imapsync_source_oauth_extra_invalid`, `imapsync_source_scope_empty`,
        `access_denied` (scope or targets not allowed), `object_exists`.
        Secrets are logged as `*`.
      operationId: addSyncJobSource
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - name
                    - host
                    - port
                - $ref: "#/components/schemas/SyncJobSourceAttributes"
            examples:
              password:
                summary: Password source for a domain
                value:
                  name: Old provider
                  description: Migration from the old provider
                  host: imap.example.com
                  port: 993
                  enc: SSL
                  auth_type: PLAIN
                  scope: domain
                  domains:
                    - example.org
                  active: 1
              client_credentials:
                summary: XOAUTH2 source with an app token (Microsoft 365)
                value:
                  name: M365 tenant
                  host: outlook.office365.com
                  port: 993
                  enc: SSL
                  auth_type: XOAUTH2
                  oauth_flow: client_credentials
                  oauth_token_endpoint: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token
                  oauth_client_id: 11111111-2222-3333-4444-555555555555
                  oauth_client_secret: client-secret-value
                  oauth_scope: https://outlook.office365.com/.default
                  active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/tls-policy-map:
    post:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Create a TLS policy map
      operationId: addTlsPolicyMap
      description: >-
        Sets the TLS policy Postfix uses for outgoing connections to a
        destination (`smtp_tls_policy_maps`). Administrators and API keys only
        (other callers get `Cannot add item`).


        Messages: `tls_policy_map_entry_saved`; `tls_policy_map_dest_invalid`
        (empty, `.`, `*` or `@`), `tls_policy_map_parameter_invalid`,
        `tls_policy_map_entry_exists`. The backend does not check `policy`; the
        database only takes the listed values.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dest:
                  type: string
                  description: >-
                    Destination, e.g. `example.org`, `.example.org` (its
                    subdomains) or `[mail.example.org]:25`; IDN in punycode
                policy:
                  type: string
                  description: >-
                    Postfix TLS security level (see
                    [smtp_tls_policy_maps](https://www.postfix.org/TLS_README.html#client_tls_policy))
                  enum:
                    - none
                    - may
                    - encrypt
                    - dane
                    - dane-only
                    - fingerprint
                    - verify
                    - secure
                parameters:
                  type: string
                  description: >-
                    Empty or space-separated `name=value` attributes, e.g.
                    `protocols=!SSLv2 ciphers=medium exclude=3DES`
                  default: ""
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - dest
                - policy
            example:
              dest: example.com
              policy: encrypt
              parameters: protocols=>=TLSv1.2
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/transport:
    post:
      tags:
        - Routing
      summary: Create transport maps
      operationId: addTransport
      description: >-
        Routes mail for the destinations over a next hop. A transport map
        entry overrules a sender-dependent transport. The service is always
        `smtp:` (TLS when offered, no SMTPS); addresses matching `/localhost$/`
        are always delivered locally. Administrators and API keys only.


        One entry is created per destination. All entries with the same next
        hop share one set of credentials: `username` and `password` are
        written to every existing entry of `nexthop`.


        Messages: `relayhost_added` (without names); `invalid_nexthop`
        (empty), `invalid_nexthop_authenticated` (the next hop exists with
        another user name), `next_hop_interferes`, `next_hop_interferes_any`
        (`host` and `[host]:port` cannot be used side by side) stop the call;
        `transport_dest_exists` and `invalid_destination` drop the
        destination. The destinations are only checked when other transport
        maps exist. Without any valid destination the answer is the messages
        or `Cannot add item`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                  description: >-
                    Destinations, separated by spaces, commas, semicolons or
                    line breaks: `example.org`, `.example.org` (its
                    subdomains), `*` or `box@example.org`. With `is_mx_based`
                    a regular expression matched against the MX name of the
                    recipient domain, e.g. `.*\.google\.com`.
                nexthop:
                  type: string
                  description: >-
                    `host`, `host:25`, `[host]:25` or an IP address (put in
                    brackets automatically)
                username:
                  type: string
                  description: SMTP user name, empty for no authentication
                  default: ""
                password:
                  type: string
                  description: SMTP password
                  default: ""
                is_mx_based:
                  type: [boolean, integer, string]
                  description: 1 = `destination` is a regular expression for MX names
                  default: 0
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - destination
                - nexthop
            example:
              destination: example.com, .example.com
              nexthop: "[mx.example.com]:25"
              username: ""
              password: ""
              is_mx_based: "0"
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/alias:
    post:
      tags:
        - Aliases
      summary: Delete aliases
      operationId: deleteAlias
      description: >-
        Deletes the aliases and the send-as rights granted for their addresses
        (`alias_removed` per alias). Unknown aliases and aliases of domains the
        caller does not manage answer `access_denied`; distribution addresses
        of mailbox groups `alias_group_managed`.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs or addresses of the aliases (a single value works too)
              items:
                type: [integer, string]
            example:
              - 12
              - info@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/api-key:
    post:
      summary: Delete API keys
      description: >-
        Deletes API keys. Service keys from mailcow.conf cannot be deleted here.


        One message per key. Success: `api_key_deleted`. Errors:
        `access_denied` (no key with this ID), `api_key_service_locked`.
      operationId: deleteApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: IDs of the API keys
              items:
                type: [integer, string]
            example:
              - 3
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/app-passwd:
    post:
      tags:
        - App Passwords
      summary: Delete app passwords
      operationId: deleteAppPassword
      description: >-
        Deletes app passwords by ID. Needs the user ACL `app_passwds` and
        access to the owning mailbox (API keys: any). Messages:
        `app_passwd_removed` per ID; the first unknown ID
        (`app_passwd_id_invalid`) or foreign ID (`access_denied`) stops the
        call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: App password IDs
              items:
                type: integer
            example:
              - 23
              - 24
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/bcc:
    post:
      tags:
        - Address Rewriting
      summary: Delete BCC maps
      operationId: deleteBccMap
      description: >-
        Deletes BCC maps by ID (`bcc_deleted` per map, `access_denied` for a
        map of a domain the caller does not manage). A non-numeric ID stops the
        call. Same callers as add/bcc.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the BCC maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 3
              - 4
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/dkim:
    post:
      summary: Delete DKIM keys
      description: >-
        Deletes the DKIM keys of domains. Admins only. Success `dkim_removed`
        per domain (also when it had no key), errors `access_denied`,
        `dkim_domain_or_sel_invalid`.
      operationId: deleteDkimKeys
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Domain names
              items:
                type: string
            example:
              - example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain:
    post:
      summary: Delete domains
      description: >-
        Deletes domains. Admins only. A domain that still has mailboxes or
        resources is kept (`domain_not_empty`). With the domain go its aliases,
        alias domains, domain admin assignments, BCC maps, MTA-STS policy, spam
        policies, mailbox group data and rate limit; domain admins left without
        any domain are deleted. Its mail storage is moved to the garbage
        collector of Dovecot (a failure is a warning). The DKIM key is kept. Success `domain_removed`, errors `access_denied`,
        `domain_invalid`.
      operationId: deleteDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Domain names
              items:
                type: string
            example:
              - example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain-admin:
    post:
      summary: Delete domain administrators
      description: >-
        Deletes domain administrators with their ACLs, two-factor
        authentication and FIDO2 keys; sync job sources they created are
        released. The domains and their mailboxes stay.


        One message per account. Success: `domain_admin_removed`. Error:
        `username_invalid` (no domain administrator of this name).
      operationId: deleteDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Usernames of the domain administrators
              items:
                type: string
            example:
              - domainadmin1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain-policy:
    post:
      summary: Delete entries of domain allow and deny lists
      description: >-
        Deletes allow or deny list entries of domains by their `prefid` (see
        get/policy_wl_domain and get/policy_bl_domain). Needs the ACL
        `spam_policy`. Success `item_deleted` per entry, error `access_denied`
        (non-numeric ID, entry of a mailbox or unknown entry).
      operationId: deleteDomainPolicy
      tags:
        - Domain antispam policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Entry IDs (`prefid`)
              items:
                type: [integer, string]
            example:
              - 12
              - 13
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Delete forwarding hosts
      operationId: deleteForwardingHost
      description: >-
        Removes forwarding hosts (`forwarding_host_removed` per host, also for
        hosts that do not exist). Administrators and API keys only.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Hosts as get/fwdhost lists them (`host`; a single value works too)
              items:
                type: string
            example:
              - 192.0.2.25
              - "2001:db8::25"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/fwdhost/{host}:
    get:
      tags:
        - Forwarding Hosts
      summary: Get forwarding hosts
      operationId: getForwardingHosts
      description: >-
        `all` lists the forwarding hosts (administrators and API keys), a host
        address returns that entry (every logged-in role). `{}` if there is
        none. Networks (`198.51.100.0/24`) cannot be read one by one: the path
        ends at the slash.
      parameters:
        - name: host
          in: path
          required: true
          description: "`all` or the address of a forwarding host"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of forwarding hosts (`all`) or one host
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ForwardingHost"
                  - $ref: "#/components/schemas/ForwardingHost"
              examples:
                all:
                  summary: get/fwdhost/all
                  value:
                    - host: 192.0.2.25
                      source: relay.example.com
                      keep_spam: "no"
                    - host: "2001:db8::25"
                      source: relay.example.com
                      keep_spam: "no"
                    - host: 198.51.100.0/24
                      source: 198.51.100.0/24
                      keep_spam: "yes"
                one:
                  summary: get/fwdhost/192.0.2.25
                  value:
                    host: 192.0.2.25
                    source: relay.example.com
                    keep_spam: "no"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/delete/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Delete mailboxes
      operationId: deleteMailbox
      description: >-
        Deletes mailboxes with everything that belongs to them: maildir (moved
        to the garbage collector), aliases pointing only to them, ACLs,
        quarantine, filters, policies, time-limited aliases, sync jobs, SOGo
        data, BCC maps, OAuth tokens, 2FA keys, rate limit; the address is
        removed from the targets of other aliases. Admins and domain admins
        (for their domains); a mailbox user session passes the check for its
        own mailbox and can delete it. Messages per mailbox: `mailbox_removed`
        or `access_denied`; a warning if the maildir could not be moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxItems"
            example:
              - john.doe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailbox-group:
    post:
      summary: Delete mailbox groups
      description: >-
        Deletes groups. The group alias, the send-as rights and the grants of
        the group are removed; members keep their mailbox settings (another
        group's template may become effective). Same permissions as edit.
        Answers one message per id: `group_removed` or `access_denied` (unknown
        id, id that is no number, no permission).
      operationId: deleteMailboxGroups
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Group ids
              items:
                type:
                  - integer
                  - string
            example:
              - 7
              - 8
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/identity-link:
    post:
      summary: Remove identity links
      description: >-
        Admins only (every read/write API key). Removes the links of mailboxes
        to their Identity Provider users; the next sync run or login links them
        again by email. Use it to resolve conflicts, e.g. when an address was
        given to another user of the provider. Answers `iam_link_removed` per
        mailbox (also for mailboxes without a link), or `access_denied`.
      operationId: deleteIdentityLinks
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Mailboxes
              items:
                type: string
            example:
              - alice@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailq:
    post:
      summary: Delete queued messages
      description: >-
        Deletes messages from the Postfix queue (`postsuper -d <qid>`; admins
        only, an API key may). To empty the whole queue use `super_delete` of
        `POST /api/v1/edit/mailq`. Queue IDs that are not hexadecimal are
        skipped.


        Messages: `queue_command_success`; `Error: command failed: ...`
        (danger); `unknown` (danger) when the command gave no answer;
        `access_denied` for non-admins.
      operationId: deleteQueuedMessages
      tags:
        - Queue Manager
      requestBody:
        content:
          application/json:
            schema:
              description: Queue IDs (a single ID works too)
              oneOf:
                - type: array
                  items:
                    type: string
                - type: string
            example:
              - B98C6260CA1
              - 4C1E8260D02
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/oauth2-client:
    post:
      summary: Delete OAuth2 clients
      description: >-
        Deletes OAuth2 clients. Tokens issued to them are not deleted (use
        `revoke_tokens` of `edit/oauth2-client` first).


        Success: one `items_deleted` message for the whole call. Error:
        `access_denied` for an ID that is no number.
      operationId: deleteOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: IDs of the clients
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/qitem:
    post:
      summary: Delete quarantined messages
      description: >-
        Deletes quarantine items without releasing or learning them. An API
        key (admin) may delete every item, others only items of their
        mailboxes or domains; the quarantine module must be allowed for the
        caller.


        Messages: `item_deleted` per item (for an admin also for IDs that do
        not exist); `access_denied` (danger) for a non-numeric or foreign ID.
      operationId: deleteQuarantineItems
      tags:
        - Quarantine
      requestBody:
        content:
          application/json:
            schema:
              description: IDs of quarantine items (a single ID works too)
              oneOf:
                - type: array
                  items:
                    type: [integer, string]
                - type: [integer, string]
            example:
              - "33"
              - "34"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/qitem:
    post:
      summary: Release or learn quarantined messages
      description: >-
        Acts on quarantine items. An API key (admin) may act on every item,
        others only on items of their mailboxes or domains; the quarantine
        module must be allowed for the caller.


          - `release` and `learnham` do the same: the message is delivered to
            its recipient (through Postfix, as the original message or as an
            attachment, see the release format of `POST /api/v1/edit/quarantine`),
            deleted from the quarantine and learned as ham by Rspamd.
          - `learnspam` deletes the item and learns the message as spam.

        Messages: `item_released` and `learned_ham`, or `qlearn_spam`, per
        item; `access_denied` (danger) for a non-numeric, unknown or foreign
        ID; `release_send_failed` (warning); `ham_learn_error`,
        `spam_learn_error` (danger); `fuzzy_learn_error` (warning). When
        Postfix cannot be reached or answers with an unexpected SMTP code, the
        remaining items are not processed. An unknown `action` does nothing
        and is answered with `Task completed`.
      operationId: editQuarantineItems
      tags:
        - Quarantine
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID or list of IDs of quarantine items
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - release
                        - learnham
                        - learnspam
                  required:
                    - action
              required:
                - items
                - attr
            example:
              items:
                - "33"
                - "34"
              attr:
                action: release
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/recipient_map:
    post:
      tags:
        - Address Rewriting
      summary: Delete recipient maps
      operationId: deleteRecipientMap
      description: >-
        Deletes recipient maps by ID (`recipient_map_entry_deleted` per ID,
        also for IDs that do not exist). A non-numeric ID stops the call.
        Administrators and API keys only.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the recipient maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/relayhost:
    post:
      tags:
        - Routing
      summary: Delete sender-dependent transports
      operationId: deleteRelayhost
      description: >-
        Deletes sender-dependent transports by ID (`relayhost_removed` per ID,
        also for IDs that do not exist). Domains that used one fall back to the
        default route (`relayhost` 0); the `relayhost` attribute of mailboxes
        is not reset. Administrators and API keys only.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the sender-dependent transports (a single value works too)
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/resource:
    post:
      tags:
        - Resources
      summary: Delete resources
      operationId: deleteResource
      description: >-
        Deletes resources and their SOGo data. Admins and domain admins (for
        their domains). Messages per resource: `resource_removed` or
        `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Resource addresses
              items:
                type: string
            example:
              - MeetingRoom1@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/syncjob:
    post:
      summary: Delete sync jobs
      description: >-
        Deletes sync jobs. Needs the `syncjobs` ACL and access to the local
        mailbox of each job (admins and API keys: every job). The OAuth2 token
        of the job's remote account is deleted when no other job uses it.
        Answers one message per id: `deleted_syncjob` with the id as sent, or
        `access_denied` (unknown job, id that is no number, no access).
      operationId: deleteSyncJobs
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Job ids
              items:
                type:
                  - integer
                  - string
            example:
              - 12
              - 13
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/syncjob_source:
    post:
      summary: Delete sync sources
      description: >-
        Deletes sync sources that no sync job uses (ids that are no number are
        skipped). Needs the `syncjobs` ACL and edit rights on the source.
        Answers one message per id: `imapsync_source_deleted`, or
        `imapsync_source_in_use`, `access_denied` (unknown id, no edit rights).
      operationId: deleteSyncJobSources
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Source ids
              items:
                type:
                  - integer
                  - string
            example:
              - 3
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/tls-policy-map:
    post:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Delete TLS policy maps
      operationId: deleteTlsPolicyMap
      description: >-
        Deletes TLS policy maps by ID (`tls_policy_map_entry_deleted` per ID,
        also for IDs that do not exist). A non-numeric ID stops the call.
        Administrators and API keys only.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the TLS policy maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/transport:
    post:
      tags:
        - Routing
      summary: Delete transport maps
      operationId: deleteTransport
      description: >-
        Deletes transport maps by ID (`relayhost_removed` per ID, also for IDs
        that do not exist). Administrators and API keys only.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the transport maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 4
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailbox/tag/{mailbox}:
    post:
      tags:
        - Mailboxes
      summary: Remove tags from a mailbox
      operationId: deleteMailboxTags
      description: >-
        Removes the given tags from the mailbox. Admins and domain admins (for
        their domains); `access_denied` otherwise. Answers `mailbox_modified`,
        or "Cannot delete item" when no tag was sent.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Tag names
              items:
                type: string
            example:
              - sales
              - trainee
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain/tag/{domain}:
    post:
      summary: Remove tags of a domain
      description: >-
        Removes tags from a domain. Answers `domain_modified` when at least one
        tag name was sent (also when the domain did not have it), `Cannot
        delete item` for an empty list; errors `domain_invalid`,
        `access_denied`.
      operationId: deleteDomainTags
      tags:
        - Domains
      parameters:
        - name: domain
          in: path
          required: true
          description: Domain name
          schema:
            type: string
          example: example.org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Tag names
              items:
                type: string
            example:
              - customer
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/alias:
    post:
      tags:
        - Aliases
      summary: Update aliases
      operationId: editAlias
      description: >-
        Changes the aliases in `items`; attributes that are left out keep their
        value, except the `goto_*` flags, which are 0 when left out. An alias
        that discards or learns its mail (`null@localhost`, `spam@localhost`,
        `ham@localhost`) therefore needs its `goto_*` flag in every edit:
        without it, the current destination fails the address check
        (`goto_invalid`), nothing is saved and the answer still contains
        `alias_modified`.


        Per alias: `alias_modified` on success; `alias_invalid` for an unknown
        alias or one of a domain the caller does not manage;
        `alias_group_managed` for the distribution address of a mailbox group
        (change it in the group). A new `address` is checked like in
        add/alias (`access_denied`, `alias_invalid`, `is_alias_or_mailbox`,
        `domain_not_found`, `is_spam_alias`); send-as grants of mailbox groups
        follow the new address. Destinations that are no e-mail address
        (`goto_invalid`), external while external destinations are disabled
        (`external_goto_denied`) or equal to the alias (`alias_goto_identical`)
        are dropped; if none remains, nothing is saved. Comments are not
        limited to 160 characters here.


        `expand_alias` does not change the alias: it creates the missing copies
        of it in the alias domains of its domain (same destinations, active,
        visible in SOGo, `sender_allowed` 0) and answers `alias_modified`, or
        warns `is_not_primary_alias` for an alias that is itself in an alias
        domain.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs or addresses of the aliases, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    address:
                      type: string
                      description: New alias address, `@example.org` for a catch-all
                    goto:
                      type: string
                      description: >-
                        New destination addresses, separated by spaces,
                        commas, semicolons or line breaks; replaces the current
                        ones. Ignored if a `goto_*` flag is 1.
                    goto_null:
                      type: [boolean, integer, string]
                      description: 1 = discard the mail silently
                      default: 0
                    goto_spam:
                      type: [boolean, integer, string]
                      description: 1 = learn the mail as spam
                      default: 0
                    goto_ham:
                      type: [boolean, integer, string]
                      description: 1 = learn the mail as ham
                      default: 0
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
                    sogo_visible:
                      type: [boolean, integer, string]
                      description: 1 = selectable sender in SOGo
                    internal:
                      type: [boolean, integer, string]
                      description: 1 = only reachable from its own domain and its alias domains
                    sender_allowed:
                      type: [boolean, integer, string]
                      description: 1 = the destination mailboxes may send as this alias
                    public_comment:
                      type: string
                      description: Comment shown to the users
                    private_comment:
                      type: string
                      description: Comment for administrators
                    expand_alias:
                      type: [boolean, integer]
                      description: >-
                        true or 1 = create the missing copies of the alias in
                        the alias domains; all other attributes are ignored
              required:
                - items
                - attr
            example:
              items:
                - 12
              attr:
                goto: anna@example.org,ben@example.org,carla@example.org
                active: "1"
                public_comment: Sales team
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/api-key:
    post:
      summary: Edit API keys
      description: >-
        Changes API keys; attributes that are not sent keep their value.
        `regen_key` gives a key a new random value: clients using the old value
        are locked out. Service keys from mailcow.conf (API_KEY,
        API_KEY_READ_ONLY) cannot be changed here.


        One message per key. Success: `api_key_modified`. Errors:
        `access_denied` (no key with this ID), `api_key_service_locked`,
        `api_key_access_invalid`, `api_key_description_invalid`,
        `api_key_network_invalid`, `ip_list_empty`.
      operationId: editApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID of the API key, or a list of IDs
                  oneOf:
                    - type: [integer, string]
                    - type: array
                      items:
                        type: [integer, string]
                attr:
                  allOf:
                    - $ref: "#/components/schemas/ApiKeyAttributes"
                    - type: object
                      properties:
                        regen_key:
                          type: [integer, string, boolean]
                          description: 1 = generate a new key value
                          default: 0
              required:
                - items
                - attr
            example:
              items:
                - 3
              attr:
                allow_from:
                  - 192.0.2.10
                  - 198.51.100.0/24
                regen_key: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain:
    post:
      summary: Edit domains
      description: >-
        Changes domains. With an API key (admin) every attribute can be set;
        quotas are in MiB, attributes not sent keep their value (`aliases`,
        `maxquota` and `quota` keep it also for 0 or an empty value).
        `relay_all_recipients` = 1 sets `backupmx`, `relay_unknown_only` = 1
        sets both. `tags` are added to the existing tags (remove tags with
        delete/domain/tag); a tag the domain has already ends the request
        without an answer after the other values were saved. A domain admin (UI session) can only change
        `description` (with the ACL `domain_desc`), `gal` and `tags`. Rate
        limits are set with edit/rl-domain. Errors per domain:
        `domain_invalid`, `mailbox_defquota_exceeds_mailbox_maxquota`,
        `defquota_empty`, `mailbox_quota_exceeds_domain_quota`,
        `maxquota_empty`, `max_quota_in_use`, `domain_quota_m_in_use`,
        `mailboxes_in_use`, `aliases_in_use`; success `domain_modified`.
      operationId: editDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain name or list of domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Description
                    aliases:
                      type: [integer, string]
                      description: Max. number of aliases
                    mailboxes:
                      type: [integer, string]
                      description: Max. number of mailboxes
                    defquota:
                      type: [integer, string]
                      description: Default quota of new mailboxes in MiB
                    maxquota:
                      type: [integer, string]
                      description: Max. quota per mailbox in MiB
                    quota:
                      type: [integer, string]
                      description: Quota of the whole domain in MiB
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Domain active
                    gal:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Global address list in SOGo
                    backupmx:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Relay this domain (backup MX)
                    relay_all_recipients:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Relay all recipients
                    relay_unknown_only:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Relay non-existing mailboxes only
                    relayhost:
                      type: [integer, string]
                      description: >-
                        ID of the sender-dependent transport (get/relayhost/all)
                        the domain sends through, 0 = none
                    tags:
                      type: array
                      items:
                        type: string
                      description: Tags to add
            example:
              items:
                - example.org
              attr:
                description: Example Org
                aliases: 400
                mailboxes: 20
                defquota: 3072
                maxquota: 10240
                quota: 51200
                active: 1
                gal: 1
                backupmx: 0
                relay_all_recipients: 0
                relay_unknown_only: 0
                relayhost: 0
                tags:
                  - premium
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain/footer:
    post:
      summary: Set the domain-wide footer
      description: >-
        Sets the footer that is added to all outgoing mails of addresses of the
        domains. The footer is replaced as a whole: values not sent are emptied.
        The footer texts can use `{= auth_user =}`, `{= from_user =}`,
        `{= from_name =}`, `{= from_addr =}`, `{= from_domain =}` and custom
        mailbox attributes like `{= foo =}`. Entries of `exclude` that are no
        existing mailbox, alias or alias domain are reported with
        `username_invalid` and left out. Success `domain_footer_modified`,
        errors `domain_invalid`, `access_denied` (both stop the call).
      operationId: editDomainFooter
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain name or list of domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    html:
                      type: string
                      default: ""
                      description: HTML footer
                    plain:
                      type: string
                      default: ""
                      description: Plain text footer
                    skip_replies:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      default: 0
                      description: No footer in replies
                    exclude:
                      description: >-
                        Mailboxes, aliases (addresses) and alias domains that
                        get no footer
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
            example:
              items:
                - example.org
              attr:
                html: "<p>Example Org &middot; {= from_name =}</p>"
                plain: "Example Org - {= from_name =}"
                skip_replies: 1
                exclude:
                  - noreply@example.org
                  - example.com
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/fail2ban:
    post:
      summary: Edit Fail2Ban settings, bans and filters
      description: >-
        Changes Fail2Ban (admins only, an API key may). What happens depends
        on `attr.action`:


          - `unban`, `whitelist`, `blacklist` act on the networks in `items`:
            queue the unban; add to the allowlist (and unban); add to the
            denylist (not `0.0.0.0/0` or the mailcow networks). Answer
            `object_modified` per network; `network_host_invalid` (danger)
            for an invalid network with `whitelist`/`blacklist` (`unban`
            skips it silently).
          - `unban-all` queues all active bans for unbanning (the denylist
            stays). Answer `f2b_modified`.
          - `edit-regex` replaces the regex filters with the list in
            `attr.regex` (numbered from 1). Answer `f2b_modified`.
          - `reset-regex` restores the default filters and waits up to 15
            seconds for netfilter (`reset_f2b_regex` (danger) when it takes
            longer). Send a non-empty `items` (the UI sends `["self"]`); the
            answer is `object_modified` per item.
          - Without `action` the settings are saved. Values that are not sent
            keep their value, except `ban_time_increment` and
            `manage_external`, which become 0, and `whitelist`/`blacklist`
            replace the lists. Values are clamped: `ban_time`, `max_ban_time`
            at least 60, `max_attempts`, `retry_window` at least 1,
            `netban_ipv4` 8-32, `netban_ipv6` 8-128. Answer `f2b_modified`,
            `network_host_invalid` (danger) for every entry of the lists that
            is left out.

        An `unban`, `whitelist`, `blacklist` or `reset-regex` without `items`
        saves the settings like a call without `action` (and so turns off
        `ban_time_increment` and `manage_external`); an unknown `action` with
        `items` answers `object_modified` without changing anything.
        `access_denied` for non-admins.
      operationId: editFail2Ban
      tags:
        - Fail2Ban
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Networks or IPs for `unban`, `whitelist`, `blacklist` (single value or list)
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - unban
                        - whitelist
                        - blacklist
                        - unban-all
                        - edit-regex
                        - reset-regex
                    regex:
                      type: array
                      items:
                        type: string
                      description: "`edit-regex`: the regex filters; the first group must match the IP"
                    ban_time:
                      type: [integer, string]
                      description: Ban time in seconds (min. 60)
                    ban_time_increment:
                      type: [boolean, integer, string]
                      description: 1 = the ban time grows with every ban of a network; not sent = 0
                    max_ban_time:
                      type: [integer, string]
                      description: Maximum ban time in seconds (min. 60)
                    max_attempts:
                      type: [integer, string]
                      description: Failed logins within `retry_window` that lead to a ban (min. 1)
                    retry_window:
                      type: [integer, string]
                      description: Window in seconds for `max_attempts` (min. 1)
                    netban_ipv4:
                      type: [integer, string]
                      description: IPv4 prefix length that is banned (8-32)
                    netban_ipv6:
                      type: [integer, string]
                      description: IPv6 prefix length that is banned (8-128)
                    whitelist:
                      type: string
                      description: Allowlist, networks or host names separated by space, comma, semicolon or newline; replaces the list
                    blacklist:
                      type: string
                      description: Denylist, networks separated by space, comma, semicolon or newline; replaces the list
                    manage_external:
                      type: [boolean, integer, string]
                      description: 1 = netfilter only keeps the banlist and sets no rules (block with the banlist URL externally); not sent = 0
              required:
                - attr
            examples:
              settings:
                summary: Save the settings
                value:
                  items: []
                  attr:
                    ban_time: "1800"
                    ban_time_increment: "1"
                    max_ban_time: "86400"
                    max_attempts: "10"
                    retry_window: "600"
                    netban_ipv4: "32"
                    netban_ipv6: "128"
                    whitelist: |-
                      192.0.2.0/24
                      mail.example.org
                    blacklist: 198.51.100.66/32
                    manage_external: "0"
              unban:
                summary: Unban a network
                value:
                  items:
                    - 203.0.113.7/32
                  attr:
                    action: unban
              regex:
                summary: Replace the regex filters
                value:
                  items:
                    - self
                  attr:
                    action: edit-regex
                    regex:
                      - "^mailcow UI: Invalid password for .+ by ([0-9a-f\\.:]+)$"
                      - "^Rspamd UI: Invalid password by ([0-9a-f\\.:]+)$"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Update mailboxes
      operationId: editMailbox
      description: >-
        Changes the given mailboxes. Fields that are not sent keep their value,
        except `attribute_hash`, which is cleared. Admins and domain admins (for
        their domains); a mailbox user gets `access_denied`. Some fields need an
        ACL of domain admins and are silently ignored without it: `sogo_access`
        (sogo_access), the protocol fields (protocol_access), `relayhost`
        (mailbox_relayhost), `extended_sender_acl` (extend_sender_acl, error
        `extended_sender_acl_denied`); API keys have all ACLs.


        Messages per mailbox: `mailbox_modified` or `username_invalid`,
        `access_denied`, `mailbox_quota_left_exceeded`,
        `mailbox_quota_exceeded`, `password_complexity`, `password_mismatch`,
        `sender_acl_invalid`, `extra_acl_invalid`, `extra_acl_invalid_domain`.
        Quota 0 (unlimited) for a mailbox with a quota needs the
        `unlimited_quota` ACL (`unlimited_quota_acl`, stops the call).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  $ref: "#/components/schemas/MailboxEdit"
            example:
              items:
                - john.doe@example.org
              attr:
                name: John Doe
                quota: 5120
                active: 1
                protocol_access:
                  - imap
                  - smtp
                  - sieve
                  - dav
                sender_acl:
                  - sales@example.org
                  - "@example.com"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox/custom-attribute:
    post:
      tags:
        - Mailboxes
      summary: Set custom attributes of mailboxes
      operationId: editMailboxCustomAttributes
      description: >-
        Replaces the custom attributes (free key/value pairs, e.g. for
        identity provider mappings) of the given mailboxes: `attribute[i]`
        gets `value[i]`, attributes that are not sent are removed; spaces in
        attribute names are removed. Both lists must have the same length.
        Admins and domain admins (for their domains). Messages per mailbox:
        `mailbox_modified`, `username_invalid`, `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    attribute:
                      description: Attribute names (a single string is one name)
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                    value:
                      description: Values, in the order of `attribute`
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
            example:
              items:
                - john.doe@example.org
              attr:
                attribute:
                  - department
                  - employee_id
                value:
                  - Sales
                  - "4711"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox-group:
    post:
      summary: Update mailbox groups
      description: >-
        Applies `attr` to every group in `items`, attributes that are not sent
        keep their value. The domain of a group cannot be changed. `members`
        replaces the manual members the caller may access; members added by the
        identity provider sync (`source` idp) stay and cannot be removed here
        (`group_member_idp`). Admins (every read/write API key) may edit every
        group; domain admins need the `mailbox_groups` ACL, and groups with
        send-as addresses or grants outside their domains are read-only for
        them.


        Answers one message per id: `group_modified` (plus warnings as for
        `add`) or the error of that group (`access_denied` for unknown ids and
        ids that are no number, the errors listed for `add`).
      operationId: editMailboxGroups
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Group ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  allOf:
                    - $ref: "#/components/schemas/MailboxGroupAttributes"
                    - type: object
                      properties:
                        reapply_template:
                          type:
                            - boolean
                            - integer
                            - string
                          description: >-
                            Admins only: apply the effective templates to all
                            members again, also when nothing changed
                          default: 0
            example:
              items:
                - 7
              attr:
                add_members:
                  - carol@example.org
                remove_members:
                  - bob@example.org
                sogo_grants:
                  - owner: shared@example.org
                    type: Calendar
                    folder: personal
                    access: write
                    subscribe: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/identity-provider-sync:
    post:
      summary: Request an identity sync run
      description: >-
        Admins only (every read/write API key). Queues a sync run of the
        Identity Provider (Keycloak and LDAP); the identity sync cron starts it
        within a minute, see `GET /api/v1/get/identity-provider/sync-status`.
        An identical pending request is reused. `items` is not used.


        Answers `iam_sync_requested`, or `iam_sync_mode_invalid`,
        `iam_sync_unavailable` (no Keycloak or LDAP provider configured),
        `access_denied`.
      operationId: requestIdentitySync
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  properties:
                    mode:
                      type: string
                      description: >-
                        `preview` lists the changes without applying them,
                        `run` applies them, `force` applies them without the
                        change limit (`offboarding_limit`)
                      enum:
                        - preview
                        - run
                        - force
                      default: run
            example:
              attr:
                mode: preview
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailq:
    post:
      summary: Act on the mail queue
      description: >-
        Runs a Postfix queue command (admins only, an API key may):


          - `hold` (`postsuper -h`), `unhold` (`postsuper -H`) and `deliver`
            (`postqueue -i`) act on the queue IDs in `items`.
          - `flush` (`postqueue -f`) tries to deliver the whole queue,
            `super_delete` (`postsuper -d ALL`) deletes every queued message.
            Both ignore `items`.

        Messages: `queue_command_success`; `Error: command failed: ...`
        (danger) with the output of the command; `unknown` (danger) when the
        command gave no answer; `access_denied` for non-admins. An unknown
        `action`, or `hold`/`unhold`/`deliver` without `items`, does nothing
        and is answered with `Task completed`. Queue IDs that are not
        hexadecimal are skipped.
      operationId: editMailQueue
      tags:
        - Queue Manager
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Queue ID or list of queue IDs (for `hold`, `unhold`, `deliver`)
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - hold
                        - unhold
                        - deliver
                        - flush
                        - super_delete
                  required:
                    - action
              required:
                - attr
            examples:
              hold:
                summary: Hold two messages
                value:
                  items:
                    - B98C6260CA1
                    - 4C1E8260D02
                  attr:
                    action: hold
              flush:
                summary: Flush the whole queue
                value:
                  items: []
                  attr:
                    action: flush
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/pushover:
    post:
      tags:
        - Mailbox user settings
      summary: Set the Pushover notifications of mailboxes
      operationId: editPushover
      description: >-
        Saves the Pushover settings (push notification on new mail) of the
        mailboxes, or removes them with `delete: "true"`. Needs the user ACL
        `pushover` (domain admins: their own ACL `pushover`, off by default).
        API keys may change any mailbox, a mailbox user only its own (the UI
        sends its address as `items`). `key` and `token` must be sent the first
        time; later, empty fields keep their value. Messages per mailbox:
        `pushover_settings_edited` or `access_denied`, `pushover_key`,
        `pushover_token`, "Invalid regex".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Pushover user key, 30 letters and digits
                    token:
                      type: string
                      description: Pushover application token, 30 letters and digits
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                    title:
                      type: string
                      description: Title of the notification (default "Mail")
                    text:
                      type: string
                      description: Text of the notification
                    senders:
                      type: string
                      description: Only notify for these senders (addresses separated by comma, space or semicolon; invalid ones are dropped)
                    senders_regex:
                      type: string
                      description: Only notify for senders matching this regular expression
                    evaluate_x_prio:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 sends high-priority mails as high-priority notifications (0 when not sent)
                    only_x_prio:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 notifies for high-priority mails only (0 when not sent)
                    sound:
                      type: string
                      description: Pushover sound name (empty when not sent)
                    delete:
                      type: string
                      enum:
                        - "true"
                      description: '"true" removes the Pushover settings, other fields are ignored'
            example:
              items:
                - john.doe@example.org
              attr:
                key: uQiRzpo4DXghDmr9QzzfQu27cmVRsG
                token: azGDORePK8gMaC0QOYAMyEEuzJnyUi
                active: 1
                title: New mail
                text: You've got mail
                senders: boss@example.org
                evaluate_x_prio: 1
                only_x_prio: 0
                sound: pushover
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/quarantine_notification:
    post:
      tags:
        - Quarantine
      summary: Set the quarantine notification interval of mailboxes
      operationId: editQuarantineNotification
      description: >-
        How often the mailbox user gets a summary of quarantined mail. Needs
        the user ACL `quarantine_notification`. API keys may change any
        mailbox, a mailbox user only its own. `quarantine_notification` must be
        sent: without it the call fails with an empty answer. Messages per
        mailbox: `mailbox_modified` or `access_denied` (also for an invalid
        value).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  required:
                    - quarantine_notification
                  properties:
                    quarantine_notification:
                      type: string
                      enum:
                        - never
                        - hourly
                        - daily
                        - weekly
            example:
              items:
                - john.doe@example.org
              attr:
                quarantine_notification: daily
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob:
    post:
      summary: Update sync jobs
      description: >-
        Applies `attr` to every job in `items`; attributes that are not sent
        keep their value, an empty `password1` or `user1` keeps the stored one.
        The local mailbox (`username`) cannot be changed. Needs the `syncjobs`
        ACL and access to the local mailbox of each job (admins and API keys:
        every job). The source is only checked again when `source_id` changes.
        Sending `last_run` or `success` (any value except null) resets that
        field. `prio` is set by admins only.


        Answers one message per id: `mailbox_modified` with the local mailbox,
        or the error of that job (`access_denied` for unknown jobs and ids that
        are no number, otherwise the errors of `add`).
      operationId: editSyncJobs
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Job ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  allOf:
                    - $ref: "#/components/schemas/SyncJobAttributes"
                    - type: object
                      properties:
                        last_run:
                          description: Any value except null resets the last run time (the job is due again)
                        success:
                          description: Any value except null resets the result of the last run
                        prio:
                          type:
                            - integer
                            - string
                          description: >-
                            Admins only: queue priority, higher runs first (see
                            `edit/syncjob/run_next`)
            example:
              items:
                - 12
                - 13
              attr:
                active: 0
                mins_interval: 60
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob/run_next:
    post:
      summary: Run sync jobs next
      description: >-
        Admins only (every read/write API key): moves the jobs to the front of
        the queue. Each job gets a `prio` above the current maximum, `last_run`
        and `success` are cleared, so the runner starts them next. Values in
        `items` that are no number are ignored, `attr` is not used.


        Answers `imapsync_job_running` (danger) for each job that is running
        right now and `imapsync_run_next_done` with the number of moved jobs.
        When no job was moved and none is running (e.g. unknown ids) the answer
        is `{"type": "error", "msg": "Cannot edit item"}`; without valid ids
        `access_denied`.
      operationId: runSyncJobsNext
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  description: Job ids
                  type: array
                  items:
                    type:
                      - integer
                      - string
                attr:
                  description: Not used
                  type: object
            example:
              items:
                - 12
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob_source:
    post:
      summary: Update sync sources
      description: >-
        Applies `attr` to every source in `items` (ids that are no number are
        skipped); attributes that are not sent keep their value, an empty
        `oauth_client_secret` keeps the stored secret. Domains and users are
        only replaced when `scope` is sent. Needs the `syncjobs` ACL and edit
        rights on the source (admins and API keys: every source; others the
        sources they created, domain admins also those of their mailboxes).
        Changing the server or the OAuth2 client drops the stored tokens.
        Changing the server or the OAuth2 client, or turning `verify_cert` off,
        needs access to every mailbox whose jobs use the source
        (`imapsync_source_used_by_others`). A client_credentials source fetches
        a new token while it is saved.


        Answers one message per id: `imapsync_source_modified` (plus
        `imapsync_source_token_refresh_failed` when the new token could not be
        fetched), or the error of that source (`access_denied` for unknown
        ids, the errors of `add`).
      operationId: editSyncJobSources
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Source ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  $ref: "#/components/schemas/SyncJobSourceAttributes"
            example:
              items:
                - 3
              attr:
                description: Migration finished in December
                scope: user
                users:
                  - alice@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob_source/refresh_token:
    post:
      summary: Refresh the token of a sync source
      description: >-
        Fetches a new OAuth2 token for a XOAUTH2 client_credentials source now
        (the cron refreshes tokens before they expire). Only the first id of
        `items` is used, `attr` is not used. Needs the `syncjobs` ACL and edit
        rights on the source. Answers `imapsync_source_token_refreshed`, or
        `imapsync_source_refresh_unsupported` (other sources),
        `imapsync_source_token_refresh_failed` (with the provider error),
        `access_denied` (unknown id, id that is no number, no edit rights).
      operationId: refreshSyncJobSourceToken
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  description: Source id (the first entry is used)
                  type: array
                  items:
                    type:
                      - integer
                      - string
                attr:
                  description: Not used
                  type: object
            example:
              items:
                - 5
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/imapsync_settings:
    post:
      summary: Update global sync job settings
      description: >-
        Admins only (every read/write API key). Sets how many sync jobs run at
        the same time and the bandwidth limit of every sync job process (a
        lower per-job `maxbytespersecond` still applies). `items` is not used.
        Answers `max_parallel_saved`, or `imapsync_max_parallel_invalid`,
        `imapsync_max_kb_per_second_invalid`, `access_denied`.
      operationId: editSyncJobSettings
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  required:
                    - max_parallel
                  properties:
                    max_parallel:
                      type:
                        - integer
                        - string
                      description: Sync jobs running at the same time, 1-32
                      minimum: 1
                      maximum: 32
                    max_kb_per_second:
                      type:
                        - integer
                        - string
                      description: >-
                        Bandwidth limit per sync job process in KB/s, 0-10485760
                        (stored as bytes/s); 0, empty or not sent = unlimited
                      default: 0
                      minimum: 0
                      maximum: 10485760
            example:
              attr:
                max_parallel: 4
                max_kb_per_second: 2000
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/user-acl:
    post:
      tags:
        - Mailboxes
      summary: Set the ACL of mailboxes
      operationId: editUserAcl
      description: >-
        Sets the user ACL (what a mailbox user may change in the UI) of the
        given mailboxes: listed ACLs are switched on, all others off. Admins
        and domain admins (for their domains); a domain admin cannot change
        ACLs that it does not have itself. Mailbox users get `access_denied`.
        Success: `acl_saved` per mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    user_acl:
                      description: ACLs to switch on (a single string is one ACL); an empty list switches all off
                      oneOf:
                        - $ref: "#/components/schemas/UserAclName"
                        - type: array
                          items:
                            $ref: "#/components/schemas/UserAclName"
            example:
              items:
                - john.doe@example.org
              attr:
                user_acl:
                  - spam_alias
                  - tls_policy
                  - spam_score
                  - spam_policy
                  - delimiter_action
                  - eas_reset
                  - pushover
                  - quarantine
                  - quarantine_notification
                  - app_passwds
                  - pw_reset
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/alias/{id}:
    get:
      tags:
        - Aliases
      summary: Get aliases
      operationId: getAliases
      description: >-
        `all` lists the aliases of every domain and alias domain the caller
        manages (an API key: all), an ID or address returns that alias.
        Mailbox addresses (alias rows pointing to themselves) are not listed.
        `{}` if there is none.
      parameters:
        - name: id
          in: path
          required: true
          description: "`all`, or the ID or address of an alias"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of aliases (`all`) or one alias
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Alias"
                  - $ref: "#/components/schemas/Alias"
              examples:
                all:
                  summary: get/alias/all
                  value:
                    - in_primary_domain: ""
                      id: 12
                      domain: example.org
                      public_comment: Sales team
                      private_comment: null
                      goto: anna@example.org,ben@example.org
                      address: sales@example.org
                      is_catch_all: 0
                      internal: 0
                      active: 1
                      active_int: 1
                      sogo_visible: 1
                      sogo_visible_int: 1
                      sender_allowed: 1
                      group_id: null
                      group_name: null
                      created: "2026-10-26 14:43:58"
                      modified: "2026-11-08 20:38:01"
                    - in_primary_domain: example.org
                      id: 20
                      domain: example.net
                      public_comment: ""
                      private_comment: ""
                      goto: null@localhost
                      address: "@example.net"
                      is_catch_all: 1
                      internal: 0
                      active: 1
                      active_int: 1
                      sogo_visible: 0
                      sogo_visible_int: 0
                      sender_allowed: 0
                      group_id: null
                      group_name: null
                      created: "2026-11-02 09:12:40"
                      modified: null
                one:
                  summary: get/alias/12
                  value:
                    in_primary_domain: ""
                    id: 12
                    domain: example.org
                    public_comment: Sales team
                    private_comment: null
                    goto: anna@example.org,ben@example.org
                    address: sales@example.org
                    is_catch_all: 0
                    internal: 0
                    active: 1
                    active_int: 1
                    sogo_visible: 1
                    sogo_visible_int: 1
                    sender_allowed: 1
                    group_id: null
                    group_name: null
                    created: "2026-10-26 14:43:58"
                    modified: "2026-11-08 20:38:01"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/alias/all/{domains}:
    get:
      tags:
        - Aliases
      summary: Get the aliases of domains
      operationId: getAliasesByDomain
      description: >-
        Lists the aliases of the named domains or alias domains. Domains the
        caller does not manage are skipped. `{}` if there is none.
      parameters:
        - name: domains
          in: path
          required: true
          description: Comma-separated domain names
          schema:
            type: string
          example: example.org,example.net
      responses:
        "200":
          description: The list of aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alias"
              example:
                - in_primary_domain: ""
                  id: 12
                  domain: example.org
                  public_comment: Sales team
                  private_comment: null
                  goto: anna@example.org,ben@example.org
                  address: sales@example.org
                  is_catch_all: 0
                  internal: 0
                  active: 1
                  active_int: 1
                  sogo_visible: 1
                  sogo_visible_int: 1
                  sender_allowed: 1
                  group_id: null
                  group_name: null
                  created: "2026-10-26 14:43:58"
                  modified: "2026-11-08 20:38:01"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/time_limited_aliases/{mailbox}:
    get:
      tags:
        - Mailbox user settings
      summary: Get the time-limited aliases of a mailbox
      operationId: getTimeLimitedAliases
      description: >-
        The time-limited aliases of the mailbox that are still valid or
        permanent. `{}` when there are none or the caller has no access (a
        mailbox user: other mailboxes). If `{mailbox}` is no address, the
        session user's aliases are returned (nothing for API keys).
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: List of aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeLimitedAlias"
              example:
                - address: kahd.osuwe@example.org
                  goto: john.doe@example.org
                  description: Online shop registration
                  validity: 1795699200
                  created: "2026-11-10 09:00:00"
                  modified: null
                  permanent: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Update time-limited aliases
      operationId: editTimeLimitedAlias
      description: >-
        Sets a new expiry (`validity` hours from now) or makes the aliases
        permanent. Needs the user ACL `spam_alias` and access to the target
        mailbox (API keys: any, mailbox users: their own). Aliases are skipped
        silently when neither `validity` nor a true `permanent` is sent.
        Messages per alias: `mailbox_modified` (without the address) or
        `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Alias address or list of addresses
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    validity:
                      type: [integer, string]
                      description: Hours from now until the alias expires (not range-checked); ends a permanent state
                    permanent:
                      type: [boolean, integer, string]
                      description: true makes the alias permanent (wins over `validity`)
            example:
              items:
                - kahd.osuwe@example.org
              attr:
                validity: 24
                permanent: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Delete time-limited aliases
      operationId: deleteTimeLimitedAlias
      description: >-
        Deletes time-limited aliases. Needs the user ACL `spam_alias` and
        access to the target mailbox (API keys: any, mailbox users: their own).
        Messages per alias: `mailbox_modified` or `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Alias addresses
              items:
                type: string
            example:
              - kahd.osuwe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/pushover-test:
    post:
      tags:
        - Mailbox user settings
      summary: Verify the Pushover credentials of mailboxes
      operationId: testPushover
      description: >-
        Checks the stored Pushover key and token of each mailbox with the
        Pushover API; `attr` is not used. Same access rules as `edit/pushover`.
        Messages per mailbox: "Pushover API OK (200): ..." (success) or
        "Pushover API ERR (code): ..." (danger), `access_denied`; a mailbox
        without settings stops the call with `pushover_credentials_missing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  description: Not used
            example:
              items:
                - john.doe@example.org
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/delimiter_action:
    post:
      tags:
        - Mailbox user settings
      summary: Set the handling of tagged mail
      operationId: editDelimiterAction
      description: >-
        What happens to mail for `user+tag@example.org`: moved to the subfolder
        "tag" (`subfolder`), "[tag]" added to the subject (`subject`), or
        nothing (`none`, also for any other value). Needs the user ACL
        `delimiter_action`. API keys may change any mailbox, a mailbox user
        only its own. Messages per mailbox: `mailbox_modified` or
        `access_denied`, `redis_error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    tagged_mail_handler:
                      type: string
                      enum:
                        - subfolder
                        - subject
                        - none
            example:
              items:
                - john.doe@example.org
              attr:
                tagged_mail_handler: subfolder
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/tls_policy:
    post:
      tags:
        - Mailbox user settings
      summary: Set the TLS policy of mailboxes
      operationId: editTlsPolicy
      description: >-
        Enforces TLS for incoming and/or outgoing mail of the mailboxes; a
        field that is not sent keeps its value. Needs the user ACL
        `tls_policy`. API keys may change any mailbox, a mailbox user only its
        own. Messages per mailbox: `mailbox_modified` or `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    tls_enforce_in:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 accepts incoming mail only over TLS
                    tls_enforce_out:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 sends outgoing mail only over TLS
            example:
              items:
                - john.doe@example.org
              attr:
                tls_enforce_in: 1
                tls_enforce_out: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/spam-score:
    get:
      tags:
        - Mailbox user settings
      summary: Get the default spam score
      operationId: getDefaultSpamScore
      description: >-
        The spam score thresholds of the session user; for API keys, which have
        no mailbox, the server default from the Rspamd actions ("add header"
        and "reject"; "5,15" if Rspamd cannot be asked).
      responses:
        "200":
          description: Thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpamScore"
              example:
                score: "8,15"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/api-key/{id}:
    get:
      summary: Get API key
      description: One API key including its key value. A read-only API key gets `{}`.
      operationId: getApiKey
