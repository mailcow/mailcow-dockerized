  /api/v1/search/domain:
    post:
      summary: Search domains (table of the UI)
      description: >-
        Paging, sorting and searching for the DataTables domain table of the UI.
        Read-only API keys may use it, domain admins see only their domains.


        Positions in `columns` and `order[].column`: 2 domain name, 3 aliases,
        4 mailboxes, 5 domain quota, 6 storage (sort only), 7 default mailbox
        quota, 8 max. mailbox quota, 10 relay domain, 14 tags (global search
        only), 15 active; others mean the domain name. `columns` is required
        with `search.value`.


        Without `Content-Type: application/json` all domains are returned. SQL
        errors answer `{"error": "..."}` with status 200.
      operationId: searchDomains
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainSearchRequest"
            example:
              draw: 1
              start: 0
              length: 10
              search:
                value: example
              order:
                - column: 2
                  dir: asc
              columns:
                - data: ""
                  searchable: false
                  orderable: false
                - data: chkbox
                  searchable: false
                  orderable: false
                - data: domain_h_name
                  searchable: true
                  orderable: true
                  search:
                    value: ""
      responses:
        "200":
          description: One page of domains, with the counts DataTables needs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainSearchResult"
              example:
                draw: 1
                recordsTotal: 12
                recordsFiltered: 1
                data:
                  - max_new_mailbox_quota: 10632560640
                    def_new_mailbox_quota: 3221225472
                    quota_used_in_domain: "104857600"
                    bytes_total: "79324302"
                    msgs_total: "132"
                    mboxes_in_domain: 3
                    mboxes_left: 7
                    domain_name: example.org
                    domain_h_name: example.org
                    description: Example Org
                    max_num_aliases_for_domain: 400
                    max_num_mboxes_for_domain: 10
                    def_quota_for_mbox: 3221225472
                    max_quota_for_mbox: 10737418240
                    max_quota_for_domain: 10737418240
                    relayhost: "0"
                    backupmx: 0
                    backupmx_int: 0
                    gal: 1
                    gal_int: 1
                    rl: false
                    active: 1
                    active_int: 1
                    relay_all_recipients: 0
                    relay_all_recipients_int: 0
                    relay_unknown_only: 0
                    relay_unknown_only_int: 0
                    created: "2026-09-21 10:24:34"
                    modified: "2026-11-06 18:15:08"
                    aliases_in_domain: 1
                    aliases_left: 399
                    domain_admins: "-"
        "401":
          $ref: "#/components/responses/Unauthorized"
