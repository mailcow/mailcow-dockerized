          description: OAuth2 client secret
        redirect_uri:
          type: string
          description: Redirect (callback) URL
        grant_types:
          type: [string, "null"]
          description: Not used
        scope:
          type: string
          description: Always `profile`
        user_id:
          type: [string, "null"]
          description: Not used
    SyslogLogEntry:
