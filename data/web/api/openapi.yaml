        - global_mime_from_whitelist.map
        - global_smtp_from_blacklist.map
        - global_smtp_from_whitelist.map
        - global_rcpt_blacklist.map
        - global_rcpt_whitelist.map
        - fishy_tlds.map
        - bad_words.map
        - bad_words_de.map
        - bad_languages.map
        - bulk_header.map
        - bad_header.map
        - monitoring_nolog.map
    Preset:
      type: object
