        subject:
          type: string
        virus_flag:
          type: integer
          description: Greater than 0 when Rspamd found a virus (`VIRUS_FOUND`)
        score:
          type: number
          description: Rspamd score
        rcpt:
          type: string
          description: Mailbox the item belongs to
        sender:
          type: string
        action:
          type: string
          description: Rspamd action, e.g. `reject` or `add header`
        created:
          type: integer
          description: Unix time
        notified:
