    PasswordPolicy:
      type: object
      description: Password policy; the values are strings, `false` if never saved
      properties:
        length:
          type: [string, boolean]
          description: Minimum length
        chars:
          type: [string, boolean]
          description: "\"1\": at least one letter"
        special_chars:
          type: [string, boolean]
          description: "\"1\": at least one character that is no letter or digit"
        lowerupper:
          type: [string, boolean]
          description: "\"1\": lowercase and uppercase letters"
        numbers:
          type: [string, boolean]
          description: "\"1\": at least one digit"
    MailboxGroupAttributes:
      type: object
      description: >-
        Attributes of a mailbox group. Flags take `1`, `true`, `on` or `yes`
        for on, anything else is off. Lists take a JSON array or a string
        separated by spaces, commas, semicolons or newlines; entries are
        lowercased.
      properties:
        name:
          type: string
          description: 1-100 characters, unique in the domain
        description:
          type: string
          description: Max. 255 characters
          default: ""
        address:
          type: string
          description: >-
            Distribution address in the domain of the group (must not be used
            by a mailbox, alias or spam alias); empty = no address. Wins over
            `local_part`.
        local_part:
          type: string
          description: Local part of the address in the domain of the group; empty = no address
        members:
          type:
            - array
            - string
          items:
            type: string
          description: >-
            Mailboxes (regular mailboxes, any domain the caller manages);
            replaces the manual members the caller may access
        add_members:
          type:
            - array
            - string
          items:
            type: string
          description: Mailboxes to add
        remove_members:
          type:
            - array
            - string
          items:
            type: string
          description: Manual members to remove
        send_as:
          type:
            - array
            - string
          items:
            type: string
          description: >-
            Replaces the addresses the members may send as: existing mailbox or
            alias addresses (not the group address, see `sender_allowed`) or
            `@domain` for a domain or alias domain
        sender_allowed:
          type:
            - boolean
            - integer
            - string
          description: Members may send as the group address
          default: 0
        sogo_visible:
          type:
            - boolean
            - integer
            - string
          description: Offer the group address as identity in SOGo (only with `sender_allowed`)
          default: 0
        internal:
          type:
            - boolean
            - integer
            - string
          description: Only senders of the domain may write to the group address
          default: 0
        active:
          type:
            - boolean
            - integer
            - string
          default: 1
        imap_grants:
          description: >-
            Replaces the mailboxes the members may open (Dovecot ACL on every
            folder, shown as Shared/<mailbox>); the caller needs access to every
            owner. `subscribe` = a cron subscribes the folders for every member
            once (within 15 minutes). A JSON string of the list is accepted too.
          type:
            - array
            - string
          items:
            type: object
            required:
              - owner
            properties:
              owner:
                type: string
                description: Mailbox to share
              rights:
                type: string
                description: >-
                  read = lookup, read, write-seen; write = also write,
                  write-deleted, insert, post, expunge, create; full = also delete
                enum:
                  - read
                  - write
                  - full
                default: read
              subscribe:
                type:
                  - boolean
                  - integer
                  - string
                default: 0
        sogo_grants:
          description: >-
            Replaces the SOGo folders shared with the members; the caller needs
            access to every owner. Pending until the owner opened SOGo once.
            `subscribe` = a cron subscribes every member once. A JSON string of
            the list is accepted too.
          type:
            - array
            - string
          items:
            type: object
            required:
              - owner
            properties:
              owner:
                type: string
                description: Mailbox whose folder is shared
              type:
                type: string
                enum:
                  - Calendar
                  - Contacts
                default: Calendar
              folder:
                type: string
                description: SOGo folder id (`A-Za-z0-9._-`, max. 100 characters)
                default: personal
              access:
                type: string
                enum:
                  - read
                  - write
                default: read
              subscribe:
                type:
                  - boolean
                  - integer
                  - string
                default: 0
        template_id:
          type:
            - integer
            - string
            - "null"
          description: >-
            Admins only: id of a mailbox template applied to the members;
            null, empty or 0 = none
        priority:
          type:
            - integer
            - string
          description: >-
            Admins only: -1000000 to 1000000; of several groups with a
            template the one with the highest priority wins
          default: 0
        idp_ref:
          type: string
          description: >-
            Admins only: id of the Identity Provider group whose members the
            identity sync keeps in the group (max. 255 characters); empty =
            none
    MailboxGroup:
      type: object
      properties:
        id:
          type: integer
        domain:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type:
            - string
            - "null"
          description: Distribution address, null = none
        sender_allowed:
          type: integer
          enum:
            - 0
            - 1
        sogo_visible:
          type: integer
          enum:
            - 0
            - 1
        internal:
          type: integer
          enum:
            - 0
            - 1
        template_id:
          type:
            - integer
            - "null"
        template:
          type:
            - string
            - "null"
          description: Name of the template
        priority:
          type: integer
        idp_ref:
          type:
            - string
            - "null"
          description: Identity Provider group id, set = members are synced
        members:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              source:
                type: string
                description: manual = added in mailcow, idp = added by the identity sync
                enum:
                  - manual
                  - idp
        send_as:
          type: array
          description: Addresses and `@domain` entries the members may send as
          items:
            type: string
        imap_grants:
          type: array
          items:
            type: object
            properties:
              owner:
                type: string
              rights:
                type: string
                enum:
                  - read
                  - write
                  - full
              subscribe:
                type: integer
                enum:
                  - 0
                  - 1
              state:
                type: string
                description: pending until Dovecot has the ACL, failed when setting it failed (retried by a cron)
                enum:
                  - pending
                  - applied
                  - failed
              last_error:
                type:
                  - string
                  - "null"
        sogo_grants:
          type: array
          items:
            type: object
            properties:
              owner:
                type: string
              type:
                type: string
                enum:
                  - Calendar
                  - Contacts
              folder:
                type: string
              access:
                type: string
                enum:
                  - read
                  - write
              subscribe:
                type: integer
                enum:
                  - 0
                  - 1
              state:
                type: string
                description: pending (`last_error` folder_missing) until the SOGo folder of the owner exists
                enum:
                  - pending
                  - applied
                  - failed
              last_error:
                type:
                  - string
                  - "null"
        active:
          type: integer
          enum:
            - 0
            - 1
        created:
          type:
            - string
            - "null"
        modified:
          type:
            - string
            - "null"
        can_edit:
          type: boolean
          description: The caller may change the group (false for read-only API keys)
    MailboxGroupMemberships:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              domain:
                type: string
              name:
                type: string
              address:
                type:
                  - string
                  - "null"
              sender_allowed:
                type: integer
              active:
                type: integer
              priority:
                type: integer
              template:
                type:
                  - string
                  - "null"
              source:
                type: string
                enum:
                  - manual
                  - idp
        template:
          type:
            - string
            - "null"
          description: Effective group template of the mailbox
        send_as:
          type: array
          description: Addresses the mailbox may send as through its active groups
          items:
            type: string
    SyncJobAttributes:
      type: object
      description: >-
        Attributes of a sync job. Flags are cast to integers: `1`, `"1"` and
        `true` are on, `0`, `"0"`, `false` (and the string `"true"`) are off;
        on add they default to off. The former connection attributes `host1`,
        `port1`, `enc1` and `authmech1` are ignored (see `source_id`).
      properties:
        source_id:
          type:
            - integer
            - string
          description: >-
            Id of an active sync source the caller may see
            (`GET /api/v1/get/syncjob_source/all`)
        user1:
          type: string
          description: Remote username at the source, max. 255 characters
        password1:
          type: string
          format: password
          description: >-
            Remote password; required unless the source uses XOAUTH2 (ignored
            then); empty on edit = keep
        mins_interval:
          type:
            - integer
            - string
          description: Minutes between runs, 1-43800
        subfolder2:
          type: string
          description: Folder in the local mailbox to sync into, empty = none
          default: ""
        exclude:
          type: string
          description: Regular expression of remote folders to skip
          default: ""
        maxage:
          type:
            - integer
            - string
          description: Only sync messages up to this age in days (1-32000), 0 = all
          default: 0
        maxbytespersecond:
          type:
            - integer
            - string
          description: >-
            Bandwidth limit in bytes/s (1-125000000), 0 = unlimited; the global
            limit of `edit/imapsync_settings` caps it
          default: 0
        timeout1:
          type:
            - integer
            - string
          description: Timeout of the remote connection in seconds (1-32000)
          default: 600
        timeout2:
          type:
            - integer
            - string
          description: Timeout of the local connection in seconds (1-32000)
          default: 600
        custom_params:
          type: array
          description: >-
            Extra imapsync options, replaces the stored list; empty list, empty
            string or null = none. Each option must be allowed by
            `GET /api/v1/get/syncjob_options`: `true` needs a value, `false`
            must have none, a string is the regular expression the value must
            match. Max. 100 options, values max. 1000 characters, each value is
            passed as one argument.
          items:
            $ref: "#/components/schemas/SyncJobCustomParam"
        delete2duplicates:
          type:
            - integer
            - string
            - boolean
          description: Delete duplicates in the local mailbox (--delete2duplicates)
        delete1:
          type:
            - integer
            - string
            - boolean
          description: Delete messages at the source after they were synced (--delete1)
        delete2:
          type:
            - integer
            - string
            - boolean
          description: Delete local messages that are not at the source (--delete2)
        automap:
          type:
            - integer
            - string
            - boolean
          description: Map special folders like "Sent Items" to their local counterparts (--automap)
        skipcrossduplicates:
          type:
            - integer
            - string
            - boolean
          description: Skip duplicates across folders, first come first served (--skipcrossduplicates)
        subscribeall:
          type:
            - integer
            - string
            - boolean
          description: Subscribe all folders (--subscribeall)
        dry:
          type:
            - integer
            - string
            - boolean
          description: Dry run, change nothing (--dry)
        active:
          type:
            - integer
            - string
            - boolean
          description: The job runs; a new job without `active` is inactive
          default: 0
    SyncJobCustomParam:
      type: object
      required:
        - o
      properties:
        o:
          type: string
          description: Option name, case-insensitive, leading dashes are removed
          example: folder
        v:
          type: string
          description: Value, empty for flags
          default: ""
          example: INBOX
    SyncJob:
      type: object
      description: A sync job; the remote password is never returned.
      properties:
        id:
          type: integer
        user2:
          type: string
          description: Local mailbox
        user1:
          type: string
          description: Remote username
        source_id:
          type: integer
        subfolder2:
          type: string
        exclude:
          type: string
        maxage:
          type: integer
        mins_interval:
          type: integer
        maxbytespersecond:
          type: string
          description: Bytes/s as text, "0" = unlimited
        timeout1:
          type: integer
        timeout2:
          type: integer
        custom_params:
          type:
            - string
            - "null"
          description: 'JSON text of the option list, e.g. `[{"o":"folder","v":"INBOX"}]`'
        custom_params_legacy:
          type:
            - string
            - "null"
          description: Free-text options of jobs from before the allowlist, not used by the runner
        delete2duplicates:
          type: integer
        delete1:
          type: integer
        delete2:
          type: integer
        automap:
          type: integer
        skipcrossduplicates:
          type: integer
        subscribeall:
          type: integer
        dry:
          type: integer
        active:
          type: integer
        regextrans2:
          type:
            - string
            - "null"
          description: Legacy column, read-only
        authmd51:
          type: integer
          description: Legacy column, read-only
        domain2:
          type: string
          description: Legacy column, read-only
        is_running:
          type: integer
        last_run:
          type:
            - string
            - "null"
        success:
          type:
            - integer
            - "null"
          description: Result of the last run (1 = imapsync exited with 0), null = not run yet
        exit_status:
          type:
            - string
            - "null"
          description: Exit status name of imapsync, e.g. EX_OK
        prio:
          type: integer
          description: Queue priority, higher runs first
        created:
          type:
            - string
            - "null"
        modified:
          type:
            - string
            - "null"
        source_name:
          type:
            - string
            - "null"
        source_description:
          type:
            - string
            - "null"
        source_host:
          type:
            - string
            - "null"
        source_port:
          type:
            - integer
            - "null"
        source_enc:
          type:
            - string
            - "null"
        source_auth_type:
          type:
            - string
            - "null"
        source_created_by:
          type:
            - string
            - "null"
        source_scope:
          type:
            - string
            - "null"
        source_oauth_flow:
          type:
            - string
            - "null"
        source_active:
          type:
            - integer
            - "null"
        source_oauth_token_expires:
          type:
            - integer
            - "null"
          description: Expiry (Unix time) of the token of a client_credentials source
        source_oauth_last_refresh_error:
          type:
            - string
            - "null"
        user_token_expires:
          type:
            - integer
            - "null"
          description: Expiry (Unix time) of the sign-in token of an authorization_code source
        user_token_error:
          type:
            - string
            - "null"
        user_token_exists:
          type: integer
          description: 1 = a sign-in token exists for (source, local mailbox, user1)
        log:
          type: string
          description: Output of the last run; empty with `no_log`
    SyncJobSourceAttributes:
      type: object
      description: >-
        Attributes of a sync source; on edit, attributes that are not sent keep
        their value.
      properties:
        name:
          type: string
          description: 1-100 characters, unique per creator
        description:
          type: string
          description: Max. 255 characters
          default: ""
        host:
          type: string
          description: IMAP server, host name or IP address (`host1` is accepted too)
        port:
          type:
            - integer
            - string
          description: 1-65535 (`port1` is accepted too)
        enc:
          type: string
          description: TLS = STARTTLS (`enc1` is accepted too)
          enum:
            - TLS
            - SSL
            - PLAIN
          default: TLS
        verify_cert:
          type:
            - integer
            - string
            - boolean
          description: Verify the server certificate; `0`, `"0"`, `false` or empty = no
          default: 1
        auth_type:
          type: string
          description: >-
            PLAIN, LOGIN and CRAM-MD5 use the password of each job, XOAUTH2 an
            OAuth2 token. Users cannot create or edit XOAUTH2 sources, but may
            use the ones they see.
          enum:
            - PLAIN
            - LOGIN
            - CRAM-MD5
            - XOAUTH2
          default: PLAIN
        active:
          type:
            - integer
            - string
          description: 1 = usable for jobs (cast to integer)
          default: 1
        scope:
          type: string
          description: >-
            Who may use the source: `all` (admins only), `domain` (the
            `domains`), `user` (the `users`; none = only the creator). Sources
            of users and client_credentials sources are always `user` without
            targets. On edit the targets only change when `scope` is sent.
          enum:
            - all
            - domain
            - user
          default: user
        domains:
          type: array
          description: Domains for scope `domain` (at least one), the caller must manage them
          items:
            type: string
        users:
          type: array
          description: Mailboxes for scope `user`, the caller must have access to them
          items:
            type: string
        oauth_flow:
          type: string
          description: >-
            XOAUTH2 grant: client_credentials = one token of the source for all
            mailboxes of the tenant; authorization_code = every mailbox owner
            signs in once in the mailcow UI (redirect URI
            `https://<MAILCOW_HOSTNAME>/syncjob-oauth`)
          enum:
            - client_credentials
            - authorization_code
          default: client_credentials
        oauth_token_endpoint:
          type: string
          description: XOAUTH2, required; https:// URL
        oauth_authorize_endpoint:
          type: string
          description: XOAUTH2 authorization_code, required; https:// URL
        oauth_userinfo_endpoint:
          type: string
          description: >-
            XOAUTH2 authorization_code, optional: identity endpoint used when
            the token response has no usable id_token; https:// URL
        oauth_client_id:
          type: string
          description: XOAUTH2, required, max. 500 characters
        oauth_client_secret:
          type: string
          format: password
          description: >-
            XOAUTH2, required, max. 500 characters; empty on edit = keep. Never
            returned.
        oauth_scope:
          type: string
          description: XOAUTH2, required, max. 500 characters
        oauth_extra_params:
          description: >-
            XOAUTH2, optional: extra OAuth2 parameters as JSON object with
            scalar values, or as JSON text (max. 4000 characters); empty =
            none. `prompt`, `access_type`, `login_hint`, `domain_hint` and `hd`
            go to the sign-in URL, all others to the token request; they never
            replace client id, secret, scope or grant fields.
          type:
            - object
            - string
            - "null"
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
    SyncJobSource:
      type: object
      description: A sync source; secrets are never returned.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          description: Creator; `API` for API keys, empty = handed over to the admins (creator deleted)
        scope:
          type: string
          enum:
            - all
            - domain
            - user
        domains:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: string
        host:
          type: string
        port:
          type: integer
        enc:
          type:
            - string
            - "null"
        host1:
          type: string
          description: Same as `host`
        port1:
          type: integer
          description: Same as `port`
        enc1:
          type:
            - string
            - "null"
          description: Same as `enc`
        verify_cert:
          type: integer
        auth_type:
          type:
            - string
            - "null"
        active:
          type: integer
        oauth_flow:
          type: string
        oauth_token_endpoint:
          type:
            - string
            - "null"
        oauth_authorize_endpoint:
          type:
            - string
            - "null"
        oauth_userinfo_endpoint:
          type:
            - string
            - "null"
        oauth_client_id:
          type:
            - string
            - "null"
        oauth_scope:
          type:
            - string
            - "null"
        oauth_extra_params:
          type:
            - string
            - "null"
          description: JSON text, null for callers who may not edit the source
        oauth_token_expires:
          type:
            - integer
            - "null"
          description: Expiry (Unix time) of the token of a client_credentials source
        oauth_last_refresh_error:
          type:
            - string
            - "null"
        oauth_last_refresh_attempt:
          type:
            - string
            - "null"
        oauth_redirect_uri:
          type: string
          description: Only for authorization_code sources, register it at the provider
        has_client_secret:
          type: boolean
        has_access_token:
          type: boolean
        can_edit:
          type: boolean
          description: The caller may change the source (false for read-only API keys)
        created:
          type:
            - string
            - "null"
        modified:
          type:
            - string
            - "null"
    SyncJobSettings:
      type: object
      properties:
        max_parallel:
          type: integer
          description: Sync jobs running at the same time
        max_bytes_per_second:
          type: integer
          description: Bandwidth limit per sync job process in bytes/s, 0 = unlimited
        max_kb_per_second:
          type: integer
          description: The same in KB/s
    IdentityProviderAttributes:
      type: object
      required:
        - authsource
      description: >-
        Configuration of the Identity Provider. Flags marked (boolean) are on
        for any non-empty value except `0`/`"0"`/`false`; flags marked (0/1) are
        cast to integers (the string `"true"` is 0).
      properties:
        authsource:
          type: string
          description: Provider type (case-insensitive)
          enum:
            - keycloak
            - generic-oidc
            - ldap
        client_id:
          type: string
          description: Keycloak, generic-oidc
        client_secret:
          type: string
          format: password
          description: Keycloak, generic-oidc
        redirect_url:
          type: string
          description: Keycloak, generic-oidc; URL of mailcow the provider redirects to after the login
        redirect_url_extra:
          type:
            - array
            - string
          items:
            type: string
          description: Keycloak, generic-oidc; more allowed redirect URLs, only changed when sent
        server_url:
          type: string
          description: Keycloak base URL
        realm:
          type: string
          description: Keycloak realm
        version:
          type: string
          description: Keycloak version
        mailpassword_flow:
          type:
            - integer
            - string
            - boolean
          description: (0/1) Keycloak; check mail client passwords through the Keycloak admin API
          default: 0
        group_paths:
          type: string
          description: >-
            Keycloak group sync: comma-separated group paths, e.g. `/Sales` or
            `/mailcow/*` (all groups below /mailcow); needs the `query-groups`
            permission
          default: ""
        authorize_url:
          type: string
          description: generic-oidc authorization endpoint
        token_url:
          type: string
          description: generic-oidc token endpoint
        userinfo_url:
          type: string
          description: generic-oidc userinfo endpoint
        client_scopes:
          type: string
          description: generic-oidc scopes
          default: openid profile email mailcow_template
        host:
          type: string
          description: LDAP server, several separated by commas (spaces are removed)
          default: ""
        port:
          type:
            - integer
            - string
          description: LDAP port
          default: 389
        use_ssl:
          type:
            - boolean
            - integer
            - string
          description: (boolean) LDAP over SSL
          default: false
        use_tls:
          type:
            - boolean
            - integer
            - string
          description: (boolean) LDAP StartTLS, ignored with `use_ssl`
          default: false
        basedn:
          type: string
          description: LDAP base DN of the user search
        binddn:
          type: string
          description: LDAP bind DN
        bindpass:
          type: string
          format: password
          description: LDAP bind password
        username_field:
          type: string
          description: LDAP attribute with the mail address of the user
          default: mail
        filter:
          type: string
          description: LDAP filter of the users that may log in
          default: ""
        attribute_field:
          type: string
          description: LDAP attribute whose value is matched against `mappers`
          default: ""
        id_attribute:
          type: string
          description: >-
            LDAP attribute with a stable user id; empty = objectGUID, entryUUID,
            nsUniqueId or ipaUniqueID, else the DN
          default: ""
        disabled_filter:
          type: string
          description: >-
            LDAP filter of disabled users (Active Directory accounts with
            ACCOUNTDISABLE are always disabled)
          default: ""
        group_basedn:
          type: string
          description: LDAP base DN of the group search, empty = `basedn`
          default: ""
        group_filter:
          type: string
          description: LDAP filter of the synced groups, required for the group sync
          default: ""
        group_name_attribute:
          type: string
          default: cn
        group_member_mode:
          type: string
          description: >-
            LDAP source of the memberships: memberOf of the users, member
            attribute of the groups, or Active Directory incl. nested groups
          enum:
            - memberof
            - member
            - ad_chain
          default: memberof
        group_member_attribute:
          type: string
          description: LDAP member attribute for `group_member_mode` member
          default: member
        ignore_ssl_error:
          type:
            - boolean
            - integer
            - string
          description: (boolean) Do not verify TLS certificates
          default: false
        login_provisioning:
          type:
            - boolean
            - integer
            - string
          description: (boolean) Create mailboxes at their first login
          default: false
        periodic_sync:
          type:
            - integer
            - string
            - boolean
          description: (0/1) Keycloak, LDAP; update mailboxes from the provider every `sync_interval`
          default: 0
        import_users:
          type:
            - integer
            - string
            - boolean
          description: (0/1) Keycloak, LDAP; create mailboxes for new users of the provider
          default: 0
        sync_interval:
          type:
            - integer
            - string
          description: Keycloak, LDAP; minutes between sync runs (at least 1)
          default: 15
        offboarding:
          type:
            - integer
            - string
            - boolean
          description: >-
            (0/1) Keycloak, LDAP; users disabled at the provider, or missing in
            two complete sync runs, get login disabled (mailbox active = 2, mail
            is still received); only mailboxes disabled by the sync are enabled
            again
          default: 0
        offboarding_limit:
          type:
            - integer
            - string
          description: >-
            Keycloak, LDAP; runs that would disable more mailboxes or remove
            more group memberships than this share in percent (0-100, at least
            5 mailboxes) are blocked
          default: 10
        group_sync:
          type:
            - integer
            - string
            - boolean
          description: >-
            (0/1) Keycloak, LDAP; sync the members of provider groups to mailbox
            groups (members added in mailcow stay)
          default: 0
        group_autocreate:
          type:
            - integer
            - string
            - boolean
          description: >-
            (0/1) Keycloak, LDAP; create a mailbox group for every provider
            group without one
          default: 0
        group_default_domain:
          type: string
          description: Keycloak, LDAP; domain of new groups whose mail is not in a mailcow domain
          default: ""
        default_template:
          type: string
          description: >-
            Mailbox template for new mailboxes without a matching mapping (not
            used for updates); only changed when sent
        mappers:
          type: array
          items:
            type: string
          description: >-
            Attribute values, each mapped to the template at the same position
            in `templates`; only changed when both lists are sent, pairs with an
            empty value are dropped
        templates:
          type: array
          items:
            type: string
          description: Mailbox templates for `mappers`
    IdentityProviderSettings:
      type: object
      description: >-
        Stored settings (see `IdentityProviderAttributes`). Values are strings
        as stored, except `redirect_url_extra`, `mappers` and `templates`
        (lists) and `use_ssl`, `use_tls`, `login_provisioning`,
        `ignore_ssl_error` (booleans; `login_provisioning` is `1` when never
        stored). Secrets are `*` for read-only API keys.
      properties:
        authsource:
          type: string
        client_secret:
          type: string
        bindpass:
          type: string
        access_token:
          type: string
          description: Cached admin API token of Keycloak
        redirect_url_extra:
          type: array
          items:
            type: string
        mappers:
          type: array
          items:
            type: string
        templates:
          type: array
          items:
            type: string
        use_ssl:
          type: boolean
        use_tls:
          type: boolean
        ignore_ssl_error:
          type: boolean
        login_provisioning:
          type:
            - boolean
            - integer
      additionalProperties:
        type: string
    IdentitySyncStatus:
      type: object
      properties:
        provider:
          type: string
          description: Configured provider, empty = none
        can_sync:
          type: boolean
          description: The provider can be synced (Keycloak, LDAP)
        sync_enabled:
          type: boolean
          description: Scheduled runs are on (periodic sync, import, offboarding or group sync)
        counts:
          type: object
          description: Mailboxes of the provider (no resources)
          properties:
            accounts:
              type: integer
            linked:
              type: integer
              description: Linked to a user of the provider
            idp_disabled:
              type: integer
              description: Login disabled by the sync
            missing:
              type: integer
              description: Not found at the provider by the last runs
        runs:
          type: array
          description: The last 10 runs, newest first
          items:
            $ref: "#/components/schemas/IdentitySyncRun"
    IdentitySyncRun:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
        mode:
          type: string
          enum:
            - run
            - preview
            - force
        status:
          type: string
          enum:
            - pending
            - running
            - ok
            - blocked
            - error
        requested_by:
          type: string
          description: Who requested the run, empty for scheduled runs
        created:
          type: string
        started:
          type:
            - string
            - "null"
        finished:
          type:
            - string
            - "null"
        summary:
          type:
            - object
            - "null"
          description: >-
            Result, null while pending: `counts` per kind of change, `details`
            (up to 50 entries per list), `blocked`, `errors` (up to 50), `mode`;
            failed runs only `error` and `mode`
          properties:
            counts:
              type: object
              additionalProperties:
                type: integer
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            blocked:
              type: boolean
            errors:
              type: array
              items:
                type: string
            error:
              type: string
            mode:
              type: string
    IdentityLink:
      type: object
      properties:
        provider:
          type: string
        external_id:
          type:
            - string
            - "null"
          description: User id at the provider
        idp_disabled:
          type: integer
          description: 1 = login disabled by the identity sync
        missing_since:
          type:
            - string
            - "null"
          description: Since when the sync does not find the user at the provider
  responses:
    Unauthorized:
      description: >-
        The API key is unknown or inactive (`authentication failed`), or the
        request comes from an address the key does not allow
        (`api access denied for ip <address>`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: error
            msg: authentication failed
    Forbidden:
      description: The API key is read-only
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: error
            msg: API read/write access denied
    WriteResult:
      description: >-
        The messages of the call; `{"type": "success", "msg": "Task completed"}`
        or `{"type": "error", "msg": "Cannot ... item"}` if it produced none.
        Check `type`: the status is 200 for failures too.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Messages"
              - $ref: "#/components/schemas/TaskResult"
          examples:
            messages:
              summary: Messages of the call
              value:
                - type: success
                  log:
                    - mailbox
                    - add
                    - alias
                    - address: alias@example.org
                      goto: user@example.org
                  msg:
                    - alias_added
                    - alias@example.org
            failed:
              summary: Failed without a message
              value:
                type: error
                msg: Cannot add item
    AcmeLogs:
      description: The log entries, `{}` if there are none
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AcmeLogEntry"
          example:
            - time: "1794308452"
              message: mail.example.org - Certificates were successfully validated, no changes or renewals required, sleeping for another day.
    ApiLogs:
      description: The log entries, `{}` if there are none
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ApiLogEntry"
          example:
            - time: 1794334338
              uri: /api/v1/edit/domain-admin
              method: POST
              remote: 192.0.2.10
              data: "attr='{\"active\":\"1\",\"password\":\"*\",\"password2\":\"*\"}', items='[\"domainadmin1\"]'"
            - time: 1794334330
              uri: /api/v1/get/status/version
              method: GET
              remote: 192.0.2.10
              data: ""
