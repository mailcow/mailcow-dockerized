          schema:
            type: array
            items:
              $ref: "#/components/schemas/SyslogLogEntry"
          example:
            - time: "1794334332"
              program: dovecot
              priority: info
              message: "imap-login: Login: user=<john.doe@example.org>, method=PLAIN, rip=198.51.100.7, lip=172.22.1.250, mpid=310, TLS, session=<c0kD4l8L2N7GZGMH>"
    NetfilterLogs:
