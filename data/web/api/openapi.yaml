        password:
          type: string
          description: SMTP password in clear text
        active:
          type: integer
          description: 1 = active, 0 = inactive
        password_short:
          type: string
          description: First three characters of the password and `...`
        used_by_domains:
          type: string
          description: Comma-separated domains that use the transport, may be empty
        used_by_mailboxes:
          type: string
          description: Comma-separated mailboxes that use the transport, may be empty
    Transport:
      type: object
      description: A transport map entry
      properties:
        id:
          type: integer
