        - name: id
          in: path
          required: true
          description: "`all` or the ID of a recipient map"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of recipient maps (`all`) or one recipient map
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/RecipientMap"
                  - $ref: "#/components/schemas/RecipientMap"
              examples:
                all:
                  summary: get/recipient_map/all
                  value:
                    - id: 1
                      recipient_map_old: jane.doe@example.org
                      recipient_map_new: jane.smith@example.org
                      active: 1
                      created: "2026-11-04 08:30:00"
                      modified: null
                    - id: 2
                      recipient_map_old: "@example.net"
                      recipient_map_new: "@example.org"
                      active: 0
                      created: "2026-11-04 08:31:12"
                      modified: "2026-11-05 17:02:45"
                one:
                  summary: get/recipient_map/1
                  value:
                    id: 1
                    recipient_map_old: jane.doe@example.org
                    recipient_map_new: jane.smith@example.org
                    active: 1
                    created: "2026-11-04 08:30:00"
                    modified: null
                    "0": null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/bcc:
    post:
      tags:
        - Address Rewriting
      summary: Update BCC maps
      operationId: editBccMap
      description: >-
        Changes the BCC maps in `items`; fields not sent keep their value,
        `local_dest` cannot be changed. Same callers as add/bcc. `type` is not
        validated: send only `sender` or `rcpt`.


        Messages: `bcc_edited`; errors `bcc_must_be_email`, `bcc_exists`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs of the BCC maps, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    bcc_dest:
                      type: string
                      description: E-mail address that gets the copies
                    type:
                      type: string
                      enum:
                        - sender
                        - rcpt
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 3
              attr:
                bcc_dest: journal@example.com
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/recipient_map:
    post:
      tags:
        - Address Rewriting
      summary: Update recipient maps
      operationId: editRecipientMap
      description: >-
        Changes the recipient maps in `items`; fields not sent keep their
        value. `recipient_map_entry_exists` stops the call.


