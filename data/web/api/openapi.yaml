        attributes:
          type: object
          description: >-
            The settings: quota in bytes, tags, tagged_mail_handler,
            quarantine_notification, quarantine_category, rl_value, rl_frame,
            the flags force_pw_update, force_tfa, sogo_access, active,
            tls_enforce_in, tls_enforce_out, imap_access ... dav_access and one
