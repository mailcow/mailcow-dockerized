  /api/v1/add/alias-domain:
    post:
      summary: Add alias domains
      description: >-
        Adds alias domains: mail to an address of the alias domain goes to the
        same local part in the target domain. Needs the ACL `alias_domains`
        (API keys have it) and access to the target domain, which must be an
        existing domain and no relay domain. Like add/domain this can set the
        rate limit and create a DKIM key for each alias domain. Per alias
        domain: success `aliasd_added`, errors `alias_domain_invalid` (also
        when the name is taken by a domain or alias domain),
        `aliasd_targetd_identical`, `targetd_not_found`,
        `targetd_relay_domain`; for the call: `access_denied`,
        `target_domain_invalid`. An invalid alias domain name currently ends
        the request without an answer.
      operationId: addAliasDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alias_domain
                - target_domain
              properties:
                alias_domain:
                  type: string
                  description: >-
                    Alias domain name; several are separated by spaces, commas,
                    semicolons or line breaks
                target_domain:
                  type: string
                  description: The domain the alias domain points to
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Alias domain active (inactive when not sent)
                rl_value:
                  type: [integer, string]
                  description: Rate limit, messages per `rl_frame`; empty or 0 = none
                rl_frame:
                  type: string
                  enum: [s, m, h, d]
                  description: Rate limit time frame
                dkim_selector:
                  type: string
                  description: Selector of the DKIM key that is created
                key_size:
                  type: [integer, string]
                  description: >-
                    RSA key size in bits of the DKIM key that is created; a key
                    is created only when `key_size` and `dkim_selector` are sent
            example:
              alias_domain: example.net
              target_domain: example.org
              active: 1
              rl_value: 100
              rl_frame: h
              dkim_selector: dkim
              key_size: 2048
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/alias-domain:
    post:
      summary: Edit alias domains
      description: >-
        Changes alias domains; attributes not sent keep their value. The new
        target domain must be an existing domain (no alias domain) the caller
        has access to. Success `aliasd_modified`, errors per alias domain
        `alias_domain_invalid` (unknown), `target_domain_invalid`,
        `access_denied`. Rate limits are set with edit/rl-domain.
      operationId: editAliasDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Alias domain name or list of alias domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Alias domain active
                    target_domain:
                      type: string
                      description: New target domain
            example:
              items:
                - example.net
              attr:
                active: 1
                target_domain: example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/alias-domain:
    post:
      summary: Delete alias domains
      description: >-
        Deletes alias domains together with their aliases, spam aliases, BCC
        maps and mailbox group data. Success `alias_domain_removed`, errors
        `domain_invalid`, `access_denied`. The rate limit of the alias domain
        is not removed.
      operationId: deleteAliasDomain
