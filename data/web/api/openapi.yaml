        may); other callers get an empty answer.


        The answer is sent with `Content-Type: application/json`, but the body
        is the plain postcat text, not JSON-encoded. An unknown or
        non-hexadecimal queue ID gives the error text of postcat.
      operationId: getQueuedMessage
      tags:
