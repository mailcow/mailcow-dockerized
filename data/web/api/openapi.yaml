                      type: object
                    blkio_stats:
                      type: object
                    networks:
                      type: object
                    pids_stats:
                      type: object
                  additionalProperties: true
              example:
                - read: "2026-11-10T19:20:01.123456789Z"
                  name: /mailcowdockerized-dovecot-mailcow-1
                  id: 5d0f3cbb2a6e4f6c8e0e1c3b9a7d2f41b6c5e8a9d0f1e2c3b4a5968778695a4b
                  pids_stats:
                    current: 38
                  memory_stats:
                    usage: 104857600
                    limit: 12541669376
                  blkio_stats:
                    io_service_bytes_recursive:
                      - major: 8
                        minor: 0
                        op: read
                        value: 1052672
                      - major: 8
                        minor: 0
                        op: write
                        value: 40960
                  networks:
                    eth0:
                      rx_bytes: 2621440
                      tx_bytes: 1048576
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/host:
