        - app_passwds
        - bcc_maps
        - pushover
        - filters
        - ratelimit
        - spam_policy
        - extend_sender_acl
        - unlimited_quota
        - protocol_access
        - smtp_ip_access
        - alias_domains
        - mailbox_relayhost
        - domain_relayhost
        - domain_desc
        - alias_external_goto
        - mailbox_groups
    ApiKey:
      type: object
      description: An API key
      properties:
        id:
          type: integer
        description:
          type: string
          description: Free text; `API_KEY` or `API_KEY_READ_ONLY` for the service keys
        access:
          type: string
          enum:
            - ro
            - rw
          description: "`ro`: read-only (get routes only), `rw`: read/write"
        api_key:
          type: string
          description: The key value, sent in the `X-API-Key` header
        allow_from:
          type: array
          description: IP addresses and networks the key may be used from
          items:
            type: string
        skip_ip_check:
          type: integer
          enum: [0, 1]
          description: 1 = the key may be used from any address
        service:
          type: integer
          enum: [0, 1]
          description: 1 = service key from mailcow.conf, can only be changed there
        active:
          type: integer
          enum: [0, 1]
        created:
          type: [string, "null"]
        modified:
          type: [string, "null"]
    ApiKeyAttributes:
      type: object
      description: Attributes of an API key for add and edit
      properties:
        description:
          type: string
          description: Free text, at most 255 characters
          default: ""
        access:
          type: string
          enum:
            - ro
            - rw
          description: "`ro`: read-only (get routes only), `rw`: read/write. Required for a new key."
        allow_from:
          description: >-
            Allowed IP addresses and CIDR networks, as list or as string
