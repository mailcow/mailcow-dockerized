                description: ""
                created_by: admin
                scope: all
                host1: imap.gmail.com
                port1: 993
                enc1: SSL
                verify_cert: 1
                auth_type: XOAUTH2
                oauth_flow: authorization_code
                oauth_token_endpoint: https://oauth2.googleapis.com/token
                oauth_authorize_endpoint: https://accounts.google.com/o/oauth2/v2/auth
                oauth_userinfo_endpoint: null
                oauth_client_id: 1234567890-example.apps.googleusercontent.com
                oauth_scope: https://mail.google.com/ openid email
                oauth_extra_params: '{"access_type":"offline","prompt":"consent"}'
                oauth_token_expires: null
                oauth_last_refresh_error: null
                oauth_last_refresh_attempt: null
                created: "2026-11-01 10:00:00"
                modified: null
                active: 1
                domains: []
                users: []
                can_edit: true
                host: imap.gmail.com
                port: 993
                enc: SSL
                has_client_secret: true
                has_access_token: false
                oauth_redirect_uri: https://mail.example.org/syncjob-oauth
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjob_options:
    get:
      summary: Get allowed custom imapsync options
      description: >-
        The imapsync options sync jobs may use in `custom_params`
        (`$IMAPSYNC_OPTIONS` of vars.local.inc.php, defaults from vars.inc.php;
        options that run code, use local files or print secrets are always
        removed). Option name (lowercase, without dashes) mapped to its rule:
        `true` needs a value, `false` is a flag without value, a string is a
        regular expression the whole value must match. Available to every
        logged-in caller.
      operationId: getSyncJobOptions
      tags:
        - Sync jobs
      responses:
        "200":
          description: Option name => rule
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type:
                    - boolean
                    - string
              example:
                authmd51: false
                debugssl: true
                folder: true
                maxsize: true
                syncinternaldates: false
                sslargs1: "^SSL_verify_mode=[01]$"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/imapsync_settings:
    get:
      summary: Get global sync job settings
      description: >-
        Settings of the sync job runner (admins and API keys; `{}` for others).
      operationId: getSyncJobSettings
      tags:
        - Sync jobs
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobSettings"
              example:
                max_parallel: 3
                max_bytes_per_second: 2048000
                max_kb_per_second: 2000
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjobs/all:
    get:
      summary: Get all sync jobs
      description: >-
        All sync jobs in queue order (highest `prio` first, then jobs that
        never ran, then the least recently run), with their logs. Admins (every
        API key) get every job, also jobs whose local mailbox no longer exists;
        domain admins the jobs of the mailboxes of their domains; mailbox users
        none (see `GET /api/v1/get/syncjobs/{mailbox}`). Answers `{}` when
        there is no job.
      operationId: getSyncJobs
      tags:
        - Sync jobs
      responses:
        "200":
          description: The sync jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncJob"
              example:
                - id: 12
                  user2: alice@example.org
                  regextrans2: ""
                  authmd51: 0
                  domain2: ""
                  subfolder2: Imported
                  user1: alice@old-provider.example.com
                  exclude: "(?i)spam|(?i)junk"
                  maxage: 0
                  mins_interval: 20
                  maxbytespersecond: "0"
                  delete2duplicates: 1
                  delete1: 0
                  delete2: 0
                  automap: 1
                  skipcrossduplicates: 0
                  custom_params: '[{"o":"folder","v":"INBOX"}]'
                  timeout1: 600
                  timeout2: 600
                  subscribeall: 1
                  dry: 0
                  is_running: 0
                  last_run: "2026-11-09 08:20:01"
                  success: 1
                  exit_status: EX_OK
                  created: "2026-11-03 09:40:09"
                  modified: "2026-11-03 09:42:21"
                  active: 1
                  source_id: 3
                  custom_params_legacy: null
                  prio: 0
                  source_name: Old provider
                  source_description: Migration from the old provider
                  source_host: imap.example.com
                  source_port: 993
                  source_enc: SSL
                  source_auth_type: PLAIN
                  source_created_by: API
                  source_scope: domain
                  source_oauth_flow: client_credentials
                  source_active: 1
                  source_oauth_token_expires: null
                  source_oauth_last_refresh_error: null
                  user_token_expires: null
                  user_token_error: null
                  user_token_exists: 0
                  log: "Transfer started at Mon Nov  9 08:20:02 2026\n..."
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjobs/{mailbox}:
    get:
      summary: Get sync jobs of a mailbox
      description: >-
        The sync jobs of a local mailbox in queue order, with their logs.
        Admins (every API key) get the jobs of every existing mailbox, domain
        admins of their mailboxes, users of their own. A value that is no email
        address returns the caller's own jobs (none for an API key). Answers
        `{}` when there is no job or no access.
      operationId: getMailboxSyncJobs
      tags:
