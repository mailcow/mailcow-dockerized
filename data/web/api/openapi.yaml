          description: The clients, `{}` if there are none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuth2Client"
              example:
                - id: 1
                  client_id: 17c76aaa88c0
                  client_secret: 73fc668a88147e32a31ff80c
                  redirect_uri: https://app.example.org/oauth/callback
                  grant_types: null
                  scope: profile
                  user_id: null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/oauth2-client:
    post:
      summary: Edit OAuth2 clients
      description: >-
        Does one of three things per client, in this order of precedence:
        `revoke_tokens` deletes all access and refresh tokens of the client,
        `renew_secret` gives it a new random secret, otherwise `redirect_uri`
        is set. `revoke_tokens` and `renew_secret` act when they are present,
        whatever their value.


        Success: `object_modified` per client. Errors: `access_denied` (no
        client with this ID; stops the call), `Redirect/Callback URL cannot be
        empty`.
      operationId: editOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID of the client, or a list of IDs
                  oneOf:
                    - type: [integer, string]
                    - type: array
                      items:
                        type: [integer, string]
                attr:
                  type: object
                  properties:
                    redirect_uri:
                      type: string
                      description: New redirect URL; empty or missing keeps the current one
                    revoke_tokens:
                      type: [integer, string, boolean]
                      description: Present = delete the access and refresh tokens of the client
                    renew_secret:
                      type: [integer, string, boolean]
                      description: Present = generate a new client secret
              required:
                - items
                - attr
            example:
              items:
                - 1
              attr:
                redirect_uri: https://app.example.org/oauth/callback2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/policy_bl_domain/{domain}:
