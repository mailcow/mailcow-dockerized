                  required:
                    - quarantine_category
                  properties:
                    quarantine_category:
                      type: string
                      enum:
                        - reject
                        - add_header
                        - all
            example:
              items:
                - john.doe@example.org
              attr:
                quarantine_category: all
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/quarantine/{id}:
    get:
      summary: Get a quarantined message
      description: >-
        Returns one quarantine item with the raw message and the Rspamd
        symbols. Domain admins and mailbox users only get their own items.
        `[]` for an unknown ID.
      operationId: getQuarantineItem
      tags:
        - Quarantine
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the quarantine item
          schema:
            type: string
          example: "33"
      responses:
        "200":
          description: The quarantine item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineItemDetails"
              example:
                id: 33
                qid: 8224615004C1
                subject: You have won
                score: 15.48
                ip: 198.51.100.23
                action: reject
                symbols: '[{"name":"BAYES_SPAM","score":5.1,"options":["99.99%"]},{"name":"RBL_SPAMHAUS_SBL","score":4.0}]'
                fuzzy_hashes: "[]"
                sender: bounces@send.example.com
                rcpt: john.doe@example.org
                msg: "Return-Path: <bounces@send.example.com>\r\nFrom: Prize <bounces@send.example.com>\r\nTo: john.doe@example.org\r\nSubject: You have won\r\n\r\nClick here\r\n"
                domain: null
                notified: 1
                created: "2026-11-10 09:47:14"
                user: unknown
                qhash: 3f9d8c0b2a4e6f1d7c5b9a8e0f2d4c6b8a1e3f5d7c9b0a2e4f6d8c1b3a5e7f9d
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/quarantine:
    post:
      summary: Edit quarantine settings
      description: >-
        Saves the global quarantine settings. Fields not sent are reset; a
        missing `retention_size` or `max_size` turns the quarantine off. The
        current values cannot be read through the API.


        Messages: `saved_settings`; errors `redis_error`.
      operationId: editQuarantineSettings
      tags:
        - Quarantine
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Ignored
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      const: settings
                    retention_size:
                      type: [integer, string]
                      description: Items kept per mailbox; 0 disables the quarantine
                    max_size:
                      type: [integer, string]
                      description: Maximum size in MiB of a quarantined message; 0 disables the quarantine
                    max_score:
                      type: [number, string]
                      description: No notification for messages with a higher spam score; empty = no limit
                    max_age:
                      type: [integer, string]
                      description: Days an item is kept; 0 or less becomes 365
                    release_format:
                      type: string
                      enum:
                        - raw
                        - attachment
                      default: raw
                      description: Deliver released messages as they are or as an attachment of a new message
                    exclude_domains:
                      type: array
                      items:
                        type: string
                      description: Domains and alias domains whose mail is not quarantined
                    sender:
                      type: string
                      description: Sender of the notifications (invalid address = empty)
                    subject:
                      type: string
                      description: Subject of the notifications
                    bcc:
                      type: string
                      description: Address that gets a copy of every notification (invalid address = empty)
                    redirect:
                      type: string
                      description: Address that gets all notifications instead of the mailboxes (invalid address = empty)
                    html_tmpl:
                      type: string
                      description: HTML template of the notifications (empty = the default template)
                  required:
                    - action
              required:
                - attr
            example:
              items:
                - self
              attr:
                action: settings
                retention_size: "20"
                max_size: "15"
                max_score: ""
                max_age: "365"
                release_format: raw
                exclude_domains:
                  - example.com
                sender: quarantine@example.org
                subject: Spam Quarantine Notification
                bcc: ""
                redirect: ""
                html_tmpl: ""
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/recipient_map/{id}:
    get:
      tags:
        - Address Rewriting
      summary: Get recipient maps
      operationId: getRecipientMaps
      description: >-
        `all` lists the recipient maps, an ID returns one map with an extra
        member `"0": null`. `{}` if there is none or the caller is no
        administrator.
