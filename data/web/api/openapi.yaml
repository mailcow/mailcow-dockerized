  /api/v1/get/app-passwd/all:
    get:
      tags:
        - App Passwords
      summary: Get the app passwords of the logged-in mailbox
      operationId: getOwnAppPasswords
      description: >-
        The app passwords of the session user. Meant for a mailbox user
        session; an API key has no mailbox and gets `{}` (use
        `get/app-passwd/all/{mailbox}`).
      responses:
        "200":
          description: List of app passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/app-passwd/{id}:
    get:
      tags:
        - App Passwords
      summary: Get an app password (broken)
      operationId: getAppPassword
      description: >-
        Does not work: json_api.php reads `$object['id']` from the path segment,
        which is a string, so the request ends with an error and an empty body.
        Use `get/app-passwd/all/{mailbox}`.
      parameters:
        - name: id
          in: path
          required: true
          description: App password ID
          schema:
            type: integer
          example: 23
      responses:
        "200":
          description: Empty body
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/app-passwd:
    post:
      tags:
        - App Passwords
      summary: Update app passwords
      operationId: editAppPassword
      description: >-
        Changes app passwords by ID; fields that are not sent keep their value.
        Needs the user ACL `app_passwds`. The app passwords are assigned to
        `username`, which defaults to the session user: API keys must send the
        mailbox the app passwords belong to (without it the backend tries to
        assign them to "API", the database refuses that and the answer is
        empty); a mailbox user may leave it out. Messages per ID:
        `object_modified`, `app_passwd_id_invalid`, `password_complexity`,
        `password_mismatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: App password ID or list of IDs
                  oneOf:
                    - type: integer
                    - type: array
                      items:
                        type: integer
                attr:
                  type: object
                  properties:
                    username:
                      type: string
                      description: Mailbox the app passwords belong to (required for API keys)
                    app_name:
                      type: string
                    app_passwd:
                      type: string
                      format: password
                      description: New password; changed only together with `app_passwd2`
                    app_passwd2:
                      type: string
                      format: password
                    protocols:
                      description: Replaces the allowed protocols
                      type: array
                      items:
                        type: string
                        enum:
                          - imap_access
                          - smtp_access
                          - pop3_access
                          - sieve_access
                          - dav_access
                          - eas_access
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
            example:
              items:
                - 23
              attr:
                username: john.doe@example.org
                active: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/bcc/{id}:
    get:
      tags:
        - Address Rewriting
      summary: Get BCC maps
      operationId: getBccMaps
      description: >-
        `all` lists the BCC maps of the domains the caller manages (an API key:
        all), an ID returns that map. `{}` if there is none. The answer for an
        ID carries an additional member `"0": null` (json_api.php appends an
        undefined variable).
      parameters:
        - name: id
          in: path
          required: true
          description: "`all` or the ID of a BCC map"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of BCC maps (`all`) or one BCC map
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/BccMap"
                  - $ref: "#/components/schemas/BccMap"
              examples:
                all:
                  summary: get/bcc/all
                  value:
                    - id: 3
                      local_dest: "@example.org"
                      bcc_dest: archive@example.com
                      active: 1
                      type: rcpt
                      created: "2026-11-03 10:15:22"
                      domain: example.org
                      modified: null
                one:
                  summary: get/bcc/3
                  value:
                    id: 3
                    local_dest: "@example.org"
                    bcc_dest: archive@example.com
                    active: 1
                    type: rcpt
                    created: "2026-11-03 10:15:22"
                    domain: example.org
                    modified: null
                    "0": null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/dkim/{domain}:
    get:
      summary: Get the DKIM key of a domain
      description: >-
        The DKIM public key of a domain or alias domain with the TXT record to
        publish at `<selector>._domainkey.<domain>`; `{}` if it has none. The
        private key is only answered when `SHOW_DKIM_PRIV_KEYS` is enabled in
        vars.local.inc.php, else `privkey` is empty.
      operationId: getDkimKey
      tags:
        - DKIM
      parameters:
        - name: domain
          in: path
          required: true
          description: Domain or alias domain name
          schema:
            type: string
          example: example.org
      responses:
        "200":
          description: The DKIM key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DkimKey"
              example:
                pubkey: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxV3...IDAQAB
                length: "2048"
                dkim_txt: v=DKIM1;k=rsa;t=s;s=email;p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxV3...IDAQAB
                dkim_selector: dkim
                privkey: ""
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/add/dkim_import:
    post:
      summary: Import a DKIM key
      description: >-
        Imports an RSA private key as the DKIM key of a domain; the public key
        is derived from it. Admins only. The domain name must be valid but is
        not checked against the domains of mailcow. The old key of the domain
        is removed first, so a successful import answers `dkim_removed` and
        `dkim_added`. Errors `access_denied`, `private_key_error`,
        `dkim_domain_or_sel_invalid`, `dkim_domain_or_sel_exists` (a key exists
        and `overwrite_existing` is not set).
      operationId: importDkimKey
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - private_key_file
              properties:
                domain:
                  type: string
                  description: Domain name
                dkim_selector:
                  type: string
                  default: dkim
                  description: Selector (letters, digits, `-`, `_`, `.`)
                private_key_file:
                  type: string
                  description: The private key in PEM format (the text, not a file upload)
                overwrite_existing:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Replace an existing key of the domain
            example:
              domain: example.org
              dkim_selector: dkim2026
              private_key_file: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASC...\n-----END PRIVATE KEY-----"
              overwrite_existing: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/domain-admin/all:
    get:
