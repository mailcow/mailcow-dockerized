              max_num_mboxes_for_domain: 25
              def_quota_for_mbox: 2048
              max_quota_for_mbox: 5120
              max_quota_for_domain: 51200
              rl_value: 500
              rl_frame: h
              active: 1
              gal: 1
              backupmx: 0
              relay_all_recipients: 0
              relay_unknown_only: 0
