          description: Secret of the release and delete links in the notification mails
    Fail2Ban:
      type: object
      properties:
        ban_time:
          type: integer
          description: Ban time in seconds
        ban_time_increment:
          type: boolean
          description: The ban time grows with every ban of a network
        max_ban_time:
          type: integer
          description: Maximum ban time in seconds
        netban_ipv4:
          type: integer
          description: IPv4 prefix length that is banned
        netban_ipv6:
          type: integer
          description: IPv6 prefix length that is banned
        max_attempts:
          type: integer
          description: Failed logins within `retry_window` that lead to a ban
        retry_window:
          type: integer
          description: Window in seconds for `max_attempts`
        banlist_id:
          type: string
          description: ID of the banlist URL `/f2b-banlist?id=<banlist_id>`
        manage_external:
          type: integer
          description: 1 = netfilter sets no rules, the banlist is for an external firewall
        regex:
          type: object
          description: Regex filters by number
          additionalProperties:
            type: string
        whitelist:
          type: string
          description: Allowlisted networks and hosts, one per line
        blacklist:
          type: string
          description: Denylisted networks, one per line
        perm_bans:
          type: array
          description: Permanent bans (only present when there are any)
          items:
            type: object
