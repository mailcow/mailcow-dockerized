                  allow_from:
                    - 192.0.2.0/24
                  skip_ip_check: 0
                  service: 1
                  active: 1
                  created: "2026-09-21 10:20:00"
                  modified: null
                - id: 3
                  description: provisioning
                  access: rw
                  api_key: 1B7E2C-94F0A3-6D5B18-C2E7F4-03A9D6
                  allow_from:
                    - 192.0.2.10
                    - 2001:db8::/64
                  skip_ip_check: 0
                  service: 0
                  active: 1
                  created: "2026-11-02 09:12:44"
                  modified: "2026-11-05 16:40:02"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/app-passwd/all/{mailbox}:
    get:
      tags:
        - App Passwords
      summary: Get the app passwords of a mailbox
      operationId: getAppPasswords
      description: >-
        The app passwords of the mailbox, including the password hashes. `{}`
        if there are none or the caller has no access to the mailbox (a
        mailbox user: other mailboxes).
      parameters:
