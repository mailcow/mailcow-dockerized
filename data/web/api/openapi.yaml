      responses:
        "200":
          description: List of app passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppPassword"
              example:
                - id: 23
                  name: Thunderbird
                  mailbox: john.doe@example.org
                  domain: example.org
                  password: "{BLF-CRYPT}$2y$10$..."
                  created: "2026-11-08 20:38:01"
