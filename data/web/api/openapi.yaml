                  value:
                    in_primary_domain: ""
                    id: 12
                    domain: example.org
                    public_comment: Sales team
                    private_comment: null
                    goto: anna@example.org,ben@example.org
                    address: sales@example.org
                    is_catch_all: 0
                    internal: 0
                    active: 1
                    active_int: 1
                    sogo_visible: 1
                    sogo_visible_int: 1
                    sender_allowed: 1
                    group_id: null
                    group_name: null
                    created: "2026-10-26 14:43:58"
                    modified: "2026-11-08 20:38:01"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/alias/all/{domains}:
    get:
      tags:
        - Aliases
      summary: Get the aliases of domains
      operationId: getAliasesByDomain
      description: >-
        Lists the aliases of the named domains or alias domains, skipping
        domains the caller does not manage. `{}` if there is none.
      parameters:
