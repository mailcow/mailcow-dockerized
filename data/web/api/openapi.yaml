            force_pw_update:
              type: string
              enum: ["0", "1"]
              description: "\"1\" = the password must be changed at the next login"
    DomainAdmin:
      type: object
      description: A domain administrator account
      properties:
        username:
          type: string
        tfa_active:
          type: integer
          enum: [0, 1]
          description: 1 = two-factor authentication is active
        tfa_active_int:
          type: integer
          enum: [0, 1]
          description: Same as `tfa_active`
        active:
          type: integer
          enum: [0, 1]
          description: 1 = the account can log in
        active_int:
          type: integer
          enum: [0, 1]
          description: Same as `active`
        created:
          type: string
          description: Creation time (`YYYY-MM-DD hh:mm:ss`)
        attributes:
          type: object
          properties:
            force_tfa:
              type: string
              enum: ["0", "1"]
              description: "\"1\" = two-factor authentication must be set up at the next login"
            force_pw_update:
              type: string
              enum: ["0", "1"]
