      required:
        - desc
        - content
    RspamdSetting:
      type: object
      properties:
        id:
          type: integer
        desc:
          type: string
          description: Short description
        content:
          type: string
          description: Rule content in Rspamd settings syntax
        active:
          type: integer
          enum:
            - 0
            - 1
    RspamdRegexMap:
      type: string
