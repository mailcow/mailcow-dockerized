        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/relayhost:
    post:
      tags:
        - Routing
      summary: Update sender-dependent transports
      operationId: editRelayhost
      description: >-
        Changes the sender-dependent transports in `items`; attributes that are
        left out keep their value (an empty `hostname` too). Administrators
        and API keys only. Per entry: `object_modified` (without the host
        name), `relayhost_invalid` (unknown ID), `mysql_error`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs of the sender-dependent transports, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    hostname:
                      type: string
                      description: Next hop, e.g. `[smtp.example.com]:587`
                    username:
                      type: string
                      description: SMTP user name, empty for no authentication
                    password:
                      type: string
                      description: SMTP password
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 1
              attr:
                password: New-Secret-Passphrase-43
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/transport:
    post:
      tags:
        - Routing
      summary: Update transport maps
      operationId: editTransport
      description: >-
        Changes the transport maps in `items`; attributes that are left out
        keep their value (an empty `destination`, `nexthop`, `is_mx_based` or
        `active` too). An empty `username` also clears the password. The
        credentials are written to every entry with the same next hop.
        Administrators and API keys only.


        Per entry: `object_modified` (without names), `relayhost_invalid`
        (unknown ID), `mysql_error`; `transport_dest_exists`,
        `invalid_destination`, `next_hop_interferes` and
        `next_hop_interferes_any` stop the call.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs of the transport maps, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    destination:
                      type: string
                      description: One destination (see add/transport)
                    nexthop:
                      type: string
                      description: Next hop, e.g. `[mx.example.com]:25`
                    username:
                      type: string
                      description: SMTP user name; empty removes the credentials
                    password:
                      type: string
                      description: SMTP password
                    is_mx_based:
                      type: [boolean, integer, string]
                      description: 1 = `destination` is a regular expression for MX names
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 4
              attr:
                nexthop: "[mx2.example.com]:25"
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/cors:
    post:
      summary: Edit CORS settings
      description: >-
        Sets which origins (web pages of other hosts) may call the API from a
        browser and with which methods. A missing value is replaced by its
        default. `items` is not used.


        Success: `cors_headers_edited`. Errors: `cors_invalid_origin`,
        `cors_invalid_method`.
      operationId: editCors
      tags:
        - Cross-Origin Resource Sharing (CORS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    allowed_origins:
                      description: >-
                        Origins (`scheme://host[:port]`, http or https, no path)
                        or `*` for any origin; a list or a string with one
                        origin per line. Default: the URL of the mailcow host.
                      oneOf:
                        - type: array
                          items:
                            type: string
                        - type: string
                    allowed_methods:
                      description: >-
                        Allowed methods: `GET`, `POST`, `PUT`, `DELETE`
                        (uppercase); a list or a string separated by single
                        spaces, commas, semicolons or newlines (`GET,POST`, not
                        `GET, POST`). Default: all four.
                      oneOf:
                        - type: array
                          items:
                            type: string
                            enum:
                              - GET
                              - POST
                              - PUT
                              - DELETE
                        - type: string
              required:
                - attr
            example:
              attr:
                allowed_origins:
                  - https://app.example.org
                  - https://admin.example.com:8443
                allowed_methods:
                  - GET
                  - POST
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/spam-score/{mailbox}:
    get:
      tags:
        - Mailbox user settings
      summary: Get the spam score of a mailbox
      operationId: getSpamScore
      description: >-
        The spam score thresholds of the mailbox: its own values or the server
        default. `{}` if the caller has no access to the mailbox (a mailbox
        user: other mailboxes).
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: Thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpamScore"
              example:
                score: "6,12"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/spam-score:
    post:
      tags:
        - Mailbox user settings
      summary: Set the spam score of mailboxes
      operationId: editSpamScore
      description: >-
        Sets the spam thresholds of the mailboxes: from the first value on mail
        goes to the junk folder, from the second it is rejected (equal values:
        the second is raised by 0.1). `default` removes the own values. Needs
        the user ACL `spam_score`. API keys may change any mailbox, a mailbox
        user only its own. Messages per mailbox: `mailbox_modified` or
        `access_denied`, "Invalid spam score, format must be "1,2" where first
        is low and second is high spam value.".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  required:
                    - spam_score
                  properties:
                    spam_score:
                      type: string
                      description: '"low,high" (numbers) or "default"'
                      examples:
                        - "6,12"
                        - default
            example:
              items:
                - john.doe@example.org
              attr:
                spam_score: "6,12"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/mailbox/template:
    post:
      tags:
        - Mailboxes
      summary: Create a mailbox template
      operationId: addMailboxTemplate
      description: >-
        Saves a named set of mailbox settings that `add/mailbox` (field
        `template`) and the UI use as defaults. Admins only (`access_denied`
        otherwise). Errors: `template_name_invalid` (empty name),
        `template_exists`, `quarantine_category_invalid`. Success:
        `template_added`. Fields that are not sent get the defaults named in
        the schema; without `acl` the template grants no user ACL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - template
                  properties:
                    template:
                      type: string
                      description: Name of the template
                - $ref: "#/components/schemas/MailboxTemplateInput"
            example:
              template: Sales
              quota: 2048
              tags:
                - sales
              quarantine_notification: daily
              quarantine_category: reject
              rl_value: 100
              rl_frame: h
              active: 1
              protocol_access:
                - imap
                - smtp
                - sieve
              acl:
                - spam_alias
                - spam_score
                - app_passwds
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/mailbox/all:
    get:
