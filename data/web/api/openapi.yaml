      operationId: getDomainRatelimits
      tags:
        - Ratelimits
      parameters:
        - name: domain
          in: path
          required: true
          description: "`all` or a domain or alias domain name"
          schema:
            type: string
          example: example.org
      responses:
        "200":
          description: The rate limit, or the list of rate limits (`all`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DomainRatelimit"
                  - type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/DomainRatelimit"
                        - type: object
                          properties:
                            domain:
                              type: string
                              description: Domain or alias domain
              example:
                value: "100"
                frame: h
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/rl-domain:
    post:
      summary: Set rate limits of domains
      description: >-
        Sets the rate limit of domains or alias domains. Needs the ACL
        `ratelimit`. `rl_frame` is required also when removing the limit.


        Messages: `rl_saved`; error `rl_timeframe`.
      operationId: editDomainRatelimits
      tags:
        - Ratelimits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain or alias domain name, or a list of them
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  required:
                    - rl_frame
                  properties:
                    rl_value:
                      type: [integer, string]
                      description: Messages per `rl_frame`; empty or 0 removes the limit
                    rl_frame:
                      type: string
                      enum: [s, m, h, d]
                      description: Time frame (second, minute, hour, day)
            example:
              items:
                - example.org
              attr:
                rl_value: 100
                rl_frame: h
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/rl-mbox/all:
    get:
      tags:
        - Ratelimits
      summary: Get the rate limits of all mailboxes
      operationId: getMailboxRatelimits
      description: >-
        The rate limits set on single mailboxes the caller manages (no domain
        limits). `{}` if none.
      responses:
        "200":
          description: List of rate limits
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/MailboxRatelimit"
                    - type: object
                      properties:
                        mailbox:
                          type: string
              example:
                - value: "100"
                  frame: h
                  mailbox: john.doe@example.org
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/rl-mbox:
    post:
      tags:
        - Ratelimits
      summary: Set the rate limit of mailboxes
      operationId: editMailboxRatelimit
      description: >-
        Sets the rate limit of mailboxes: `rl_value` messages per `rl_frame`. 0
        or empty removes it, but `rl_frame` must still be valid. Domain admins
        need the ACL `ratelimit`. Answers `rl_saved` or `rl_timeframe`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  required:
                    - rl_frame
                  properties:
                    rl_value:
                      type: [integer, string]
                      description: Number of messages, 0 or empty removes the limit
                    rl_frame:
                      type: string
                      enum:
                        - s
                        - m
                        - h
                        - d
                      description: Per second, minute, hour or day
            example:
              items:
                - john.doe@example.org
              attr:
                rl_value: 100
                rl_frame: h
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/rlhash:
    post:
      tags:
        - Ratelimits
      summary: Reset a rate limit counter
      operationId: deleteRatelimitHash
      description: >-
        Resets the counter of a rate-limited sender (`rl_hash` from
        `get/logs/ratelimited`) so it can send again. Send one hash. Answers
        `1` (not JSON) when deleted, else an empty body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: The hash
              items:
                type: string
                pattern: "^RL[0-9A-Za-z=]+$"
            example:
              - RLkfx5cv4sq1i3ehpkz5bgdhcq9u9gkzj
      responses:
        "200":
          description: "`1` if deleted, else an empty body"
          content:
            application/json:
              schema:
                type: integer
                const: 1
              example: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
