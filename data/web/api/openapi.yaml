  /api/v1/add/mta-sts:
    post:
      summary: Add an MTA-STS policy
      description: >-
        Adds the MTA-STS policy of a domain, published (when active) at
        `https://mta-sts.<domain>/.well-known/mta-sts.txt`. Alias domains always
        publish the policy of their target domain: a policy added for an alias
        domain is accepted but never published. The policy ID for the
        `_mta-sts` TXT record is the time of the change (`YYYYMMDDhhmmss`). There is no read route: the policy is shown in the
        UI only. Answers `Task completed` on success; errors `access_denied`
        (unknown domain or no access), `version_invalid`, `mode_invalid`,
        `max_age_invalid`, `mx_invalid`, and the database message when the
        domain has a policy already (use edit/mta-sts).
      operationId: addMtaSts
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - version
                - mode
                - mx
                - max_age
              properties:
                domain:
                  type: string
                  description: Domain or alias domain
                version:
                  type: string
                  enum: [stsv1, STSv1]
                  description: Policy version (case-insensitive)
                mode:
                  type: string
                  enum: [enforce, testing, none]
                  description: >-
                    `enforce` rejects delivery without valid TLS, `testing`
                    only reports, `none` publishes without effect
                mx:
                  type: string
                  description: >-
                    Comma-separated MX host names the senders may deliver to,
                    wildcards like `*.example.org` allowed
                max_age:
                  type: [integer, string]
                  description: Seconds senders may cache the policy, 1 to 31536000
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Policy published (inactive when not sent)
            example:
              domain: example.org
              version: stsv1
              mode: enforce
              mx: mail.example.org,mx2.example.org
              max_age: 86400
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mta-sts:
    post:
      summary: Edit MTA-STS policies
      description: >-
        Changes the MTA-STS policies of domains; attributes not sent keep their
        value, but `version` must always be sent (else `version_invalid`). A
        change of `version`, `mode`, `mx` or `max_age` gives the policy a new
        ID. Success `object_modified`, errors per domain `access_denied` (also
        for a domain without policy), `version_invalid`, `mode_invalid`,
        `max_age_invalid`, `mx_invalid`.
      operationId: editMtaSts
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain name or list of domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  required:
                    - version
                  properties:
                    version:
                      type: string
                      enum: [stsv1, STSv1]
                      description: Policy version
                    mode:
                      type: string
                      enum: [enforce, testing, none]
                      description: Policy mode
                    mx:
                      type: string
                      description: Comma-separated MX host names
                    max_age:
                      type: [integer, string]
                      description: Seconds senders may cache the policy, 1 to 31557600
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Policy published
            example:
              items:
                - example.org
              attr:
                version: stsv1
                mode: testing
                mx: mail.example.org
                max_age: 604800
                active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/fail2ban:
    get:
      summary: Get Fail2Ban settings and bans
      description: >-
        Returns the Fail2Ban (netfilter) settings, the regex filters, the
        allow- and denylists and the current bans. Admins only (an API key
        may); other callers get `{}`. Any further path segment
        (e.g. `/api/v1/get/fail2ban/all`) gives the same answer.
      operationId: getFail2Ban
      tags:
        - Fail2Ban
      responses:
        "200":
          description: Settings and bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fail2Ban"
              example:
                ban_time: 1800
                ban_time_increment: true
                max_ban_time: 86400
                netban_ipv4: 32
                netban_ipv6: 128
                max_attempts: 10
                retry_window: 600
                banlist_id: a2c11baf-5770-47de-9c5e-575bd7bc9218
                manage_external: 0
                regex:
                  "1": "^mailcow UI: Invalid password for .+ by ([0-9a-f\\.:]+)$"
                  "2": "^Rspamd UI: Invalid password by ([0-9a-f\\.:]+)$"
                whitelist: |-
                  192.0.2.0/24
                  mail.example.org
                blacklist: 198.51.100.66/32
                perm_bans:
                  - network: 198.51.100.66/32
                    ip: 198.51.100.66
                active_bans:
                  - queued_for_unban: 0
                    network: 203.0.113.7/32
                    ip: 203.0.113.7
                    banned_until: 00h 27m 08s
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/fail2ban/banlist:
    post:
      summary: Renew the Fail2Ban banlist URL
      description: >-
        Gives the banlist (`/f2b-banlist?id=<banlist_id>`, the list of denied
        and banned networks for an external firewall) a new random ID, so the
        old URL stops working. `items` must hold the current `banlist_id`
        (from `GET /api/v1/get/fail2ban`); `attr` can be left out. Admins
        only (an API key may).


        Answers `f2b_banlist_refreshed`; a wrong ID is answered with status
        404 and `Cannot edit item`, a Redis error with 500 and `redis_error`.
      operationId: refreshFail2BanBanlist
      tags:
        - Fail2Ban
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: The current banlist ID (single value or a list with it as first element)
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  description: Not used
              required:
                - items
            example:
              items:
                - a2c11baf-5770-47de-9c5e-575bd7bc9218
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`items` does not hold the current banlist ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
              example:
                type: error
                msg: Cannot edit item
  /api/v1/get/logs/acme/{count}:
