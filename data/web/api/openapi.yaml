openapi: 3.1.0
info:
  description: >-
    The API of mailcow, the mail server suite with antispam, antivirus and a
    web UI.


    **API keys**: create them in the mailcow UI under System > Configuration >
    Access > Administrators, card API. A key works from its allowed IP
    addresses (or from anywhere if the IP check is skipped). Read-only keys
    may use the `get` routes only. Keys set in mailcow.conf (`API_KEY`,
    `API_KEY_READ_ONLY`, `API_ALLOW_FROM`) are shown in the UI but can only be
    changed in mailcow.conf. A key acts as an administrator.


    **Requests**: `get` routes use GET, all others POST with
    `Content-Type: application/json`.

      - add: the new object as body
      - edit: `{"items": [...], "attr": {...}}`, `items` are the objects to
        change, `attr` the values to set
      - delete: the list of objects to delete


    **Answers**: write routes return the list of messages of the call
    (`type`, `msg`), or `{"type": "success", "msg": "Task completed"}` /
    `{"type": "error", "msg": "Cannot add item"}` if there are none. The
    status is 200 for failures too, so check `type`. Read routes return the
    object or list, `{}` or `[]` if there is nothing. Unknown routes answer
    404, invalid JSON 400, a wrong method 405.

  title: mailcow API
  version: "1.0.0"

servers:
  - url: /

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Message:
      type: object
      description: >-
        One message of a write call, as the mailcow UI shows it. `msg` is a key
        of the mailcow language files, alone or as a list with the values of its
        placeholders.
      properties:
        type:
          type: string
          enum:
            - success
            - danger
            - warning
            - info
        log:
          type: array
          description: >-
            The call that produced the message (function, action, object,
            data), secrets replaced by `*`
          items: {}
        msg:
          oneOf:
            - type: string
            - type: array
              items: {}
      required:
        - type
        - msg
    Messages:
      type: array
      items:
        $ref: "#/components/schemas/Message"
    TaskResult:
      type: object
      description: Answer of a write call that produced no message
      properties:
        type:
          type: string
          enum:
            - success
            - error
        msg:
          type: string
          examples:
            - Task completed
            - Cannot add item
      required:
        - type
        - msg
    Error:
      type: object
      properties:
        type:
          type: string
          const: error
        msg:
          type: string
      required:
        - type
        - msg
    Domain:
      type: object
      description: >-
        A domain. Quotas and sizes are in bytes; the `*_int` fields repeat the
        value before them.
      properties:
        domain_name:
          type: string
          description: Domain name (IDN as punycode)
        domain_h_name:
          type: string
          description: Domain name in Unicode
        description:
          type: string
          description: Description
        max_new_mailbox_quota:
          type: integer
          description: >-
            Largest quota a new mailbox can get: the free domain quota, at most
            the max. mailbox quota
        def_new_mailbox_quota:
          type: integer
          description: Quota a new mailbox gets by default
        quota_used_in_domain:
          type: [string, integer]
          description: Sum of the quotas of the mailboxes
        bytes_total:
          type: [string, integer]
          description: Storage used by the mailboxes
        msgs_total:
          type: [string, integer]
          description: Number of messages in the mailboxes
        mboxes_in_domain:
          type: integer
          description: Number of mailboxes
        mboxes_left:
          type: integer
          description: Mailboxes that can still be added
        max_num_aliases_for_domain:
          type: integer
          description: Max. number of aliases
        max_num_mboxes_for_domain:
          type: integer
          description: Max. number of mailboxes
        def_quota_for_mbox:
          type: integer
          description: Default quota of new mailboxes
        max_quota_for_mbox:
          type: integer
          description: Max. quota per mailbox
        max_quota_for_domain:
          type: integer
          description: Quota of the whole domain
        relayhost:
          type: [string, integer]
          description: ID of the sender-dependent transport, "0" = none
        backupmx:
          type: integer
          enum: [0, 1]
          description: Relay domain (backup MX)
        backupmx_int:
          type: integer
          enum: [0, 1]
        gal:
          type: integer
          enum: [0, 1]
          description: Global address list in SOGo
        gal_int:
          type: integer
          enum: [0, 1]
        rl:
          description: Rate limit, `false` if none
          oneOf:
            - $ref: "#/components/schemas/DomainRatelimit"
            - type: boolean
              const: false
        active:
          type: integer
          enum: [0, 1]
          description: Domain active
        active_int:
          type: integer
          enum: [0, 1]
        relay_all_recipients:
          type: integer
          enum: [0, 1]
          description: Relay all recipients
        relay_all_recipients_int:
          type: integer
          enum: [0, 1]
        relay_unknown_only:
          type: integer
          enum: [0, 1]
          description: Relay non-existing mailboxes only
        relay_unknown_only_int:
          type: integer
          enum: [0, 1]
        created:
          type: string
          description: Creation time (`YYYY-MM-DD hh:mm:ss`)
        modified:
          type: [string, "null"]
          description: Time of the last change
        aliases_in_domain:
          type: [integer, string]
          description: Number of aliases, including those of its alias domains
        aliases_left:
          type: integer
          description: Aliases that can still be added
        domain_admins:
          type: string
          description: Comma-separated domain admins, `-` if none; admins only
        tags:
          type: array
          items:
            type: string
          description: Tags; missing when the domain has none
    DomainRatelimit:
      type: object
      description: Rate limit of a domain or alias domain
      properties:
        value:
          type: string
          description: Messages per time frame
        frame:
          type: string
          enum: [s, m, h, d]
          description: Time frame (second, minute, hour, day)
    DomainTemplate:
      type: object
      properties:
        id:
          type: integer
          description: Template ID
        template:
          type: string
          description: Template name
        type:
          type: string
          const: domain
        attributes:
          $ref: "#/components/schemas/DomainTemplateAttributes"
        created:
          type: string
          description: Creation time
        modified:
          type: [string, "null"]
          description: Time of the last change
    DomainTemplateAttributes:
      type: object
      description: Values of a domain template as stored; quotas in bytes
      properties:
        tags:
          type: array
          items:
            type: string
        max_num_aliases_for_domain:
          type: integer
        max_num_mboxes_for_domain:
          type: integer
        def_quota_for_mbox:
          type: integer
        max_quota_for_mbox:
          type: integer
        max_quota_for_domain:
          type: integer
        rl_frame:
          type: string
          enum: [s, m, h, d]
        rl_value:
          type: [string, integer]
          description: Rate limit, "" = none
        active:
          type: integer
          enum: [0, 1]
        gal:
          type: integer
          enum: [0, 1]
        backupmx:
          type: integer
          enum: [0, 1]
        relay_all_recipients:
          type: integer
          enum: [0, 1]
        relay_unknown_only:
          type: integer
          enum: [0, 1]
        dkim_selector:
          type: string
        key_size:
          type: integer
    DomainTemplateInput:
      type: object
      description: >-
        Values of a domain template, quotas in MiB. The defaults apply when a
        template is added; for edit/domain/template see there.
      properties:
        template:
          type: string
          description: Template name, unique
        tags:
          type: array
          items:
            type: string
          default: []
          description: Tags of new domains
        max_num_aliases_for_domain:
          type: [integer, string]
          default: 400
          description: Max. number of aliases
        max_num_mboxes_for_domain:
          type: [integer, string]
          default: 10
          description: Max. number of mailboxes
        def_quota_for_mbox:
          type: [integer, string]
          default: 3072
          description: Default quota of new mailboxes in MiB
        max_quota_for_mbox:
          type: [integer, string]
          default: 10240
          description: Max. quota per mailbox in MiB
        max_quota_for_domain:
          type: [integer, string]
          default: 10240
          description: Quota of the whole domain in MiB
        rl_value:
          type: [integer, string]
          default: ""
          description: Rate limit, messages per `rl_frame`; empty = none
        rl_frame:
          type: string
          enum: [s, m, h, d]
          default: s
          description: Rate limit time frame
        active:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 1
        gal:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 1
          description: Global address list in SOGo
        backupmx:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
          description: Relay domain (backup MX)
        relay_all_recipients:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
        relay_unknown_only:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
        dkim_selector:
          type: string
          default: dkim
          description: Selector of the DKIM key of new domains
        key_size:
          type: [integer, string]
          default: 2048
          description: DKIM key size in bits of new domains
    AliasDomain:
      type: object
      properties:
        alias_domain:
          type: string
          description: Alias domain name
        target_domain:
          type: string
          description: Domain the alias domain points to
        parent_is_backupmx:
          type: integer
          enum: [0, 1]
          description: The target domain is a relay domain
        active:
          type: integer
          enum: [0, 1]
          description: Alias domain active
        active_int:
          type: integer
          enum: [0, 1]
        rl:
          description: Rate limit, `false` if none
          oneOf:
            - $ref: "#/components/schemas/DomainRatelimit"
            - type: boolean
              const: false
        created:
          type: string
          description: Creation time
        modified:
          type: [string, "null"]
          description: Time of the last change
    DomainPolicyEntry:
      type: object
      properties:
        object:
          type: string
          description: The domain or mailbox the entry belongs to
        value:
          type: string
          description: Sender address or pattern
        prefid:
          type: integer
          description: Entry ID (for delete/domain-policy)
    DkimKey:
      type: object
      properties:
        pubkey:
          type: string
          description: Public key (base64, without PEM lines)
        length:
          type: string
          enum: ["1024", "2048", "3072", "4096", ">= 8192"]
          description: Key size in bits, estimated from the public key
        dkim_txt:
          type: string
          description: >-
            Content of the DNS TXT record; split into quoted strings of 255
            characters when `SPLIT_DKIM_255` is enabled
        dkim_selector:
          type: string
          description: Selector
        privkey:
          type: string
          description: >-
            Private key in PEM format, base64-encoded, when
            `SHOW_DKIM_PRIV_KEYS` is enabled, else empty
    DomainSearchRequest:
      type: object
      description: >-
        Server-side processing parameters of DataTables
        (https://datatables.net/manual/server-side). Without `start` and
        `length` all matching domains are answered.
      properties:
        draw:
          type: integer
          description: Request counter, answered as it is
        start:
          type: integer
          description: Offset of the first domain
        length:
          type: integer
          description: Number of domains, -1 = all
        search:
          type: object
          properties:
            value:
              type: string
              description: Searched in all columns with `searchable` true
        order:
          type: array
          items:
            type: object
            properties:
              column:
                type: integer
                description: Position in `columns` (see the description of the route)
              dir:
                type: string
                enum: [asc, desc]
        columns:
          type: array
          description: >-
            The columns of the table; the position gives the database column
            (see the description of the route)
          items:
            type: object
            properties:
              data:
                type: [string, integer]
                description: >-
                  Column name of the UI; a column position makes
                  `search.value` of this entry filter that column
              searchable:
                type: [boolean, string]
                description: Column takes part in the global search; must be set
              orderable:
                type: [boolean, string]
                description: Column may be sorted by; must be set
              search:
                type: object
                properties:
                  value:
                    type: string
                    description: Filter of this column
    DomainSearchResult:
      type: object
      properties:
        draw:
          type: integer
          description: "`draw` of the request"
        recordsTotal:
          type: integer
          description: Number of domains the caller can see
        recordsFiltered:
          type: integer
          description: Number of domains that match the search
        data:
          type: array
          description: The domains of the page
          items:
            $ref: "#/components/schemas/Domain"
    MailboxItems:
      description: One mailbox address or a list of them
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    UserAclName:
      type: string
      description: "A user ACL: something the mailbox user may do in the UI"
      enum:
        - spam_alias
        - tls_policy
        - spam_score
        - spam_policy
        - delimiter_action
        - syncjobs
        - eas_reset
        - sogo_profile_reset
        - pushover
        - quarantine
        - quarantine_attachments
        - quarantine_notification
        - quarantine_category
        - app_passwds
        - pw_reset
    ProtocolAccessName:
      type: string
      enum:
        - imap
        - pop3
        - smtp
        - sieve
        - eas
        - dav
    MailboxAttributes:
      type: object
      description: Settings of a mailbox; flags are "0" or "1"
      properties:
        force_pw_update:
          type: [string, integer]
          description: The user must change the password at the next login
        force_tfa:
          type: [string, integer]
          description: The user must set up two-factor authentication at the next login
        tls_enforce_in:
          type: [string, integer]
        tls_enforce_out:
          type: [string, integer]
        sogo_access:
          type: [string, integer]
          description: Login to SOGo from the UI
        imap_access:
          type: [string, integer]
        pop3_access:
          type: [string, integer]
        smtp_access:
          type: [string, integer]
        sieve_access:
          type: [string, integer]
        eas_access:
          type: [string, integer]
        dav_access:
          type: [string, integer]
        relayhost:
          type: [string, integer]
          description: ID of the sender-dependent transport, "0" for none
        shared:
          type: [string, integer]
          description: Shared mailbox without a login of its own
        passwd_update:
          type: [string, integer]
          description: Time of the last password change
        mailbox_format:
          type: string
        quarantine_notification:
          type: string
          enum:
            - never
            - hourly
            - daily
            - weekly
        quarantine_category:
          type: string
          enum:
            - reject
            - add_header
            - all
        attribute_hash:
          type: string
          description: Hash of the template the settings came from, cleared by manual changes
        recovery_email:
          type: string
          description: Address for password reset mails (present after it was set)
        template:
          type: string
          description: Name of the template the mailbox was created from (if any)
    Mailbox:
      type: object
      description: >-
        A mailbox. The reduced form lacks `max_new_quota`, `spam_aliases`,
        `pushover_active`, `rl`, `rl_scope`, `is_relayed` and `sender_acl`;
        `tags` is missing without tags.
      properties:
        username:
          type: string
          description: Address of the mailbox
        active:
          type: integer
          description: 1 active, 0 inactive, 2 login disabled (mail is still accepted)
        active_int:
          type: integer
          description: Same as `active`
        domain:
          type: string
        name:
          type: string
          description: Full name
        local_part:
          type: string
        quota:
          type: integer
          description: Quota in bytes, 0 = unlimited
        messages:
          type: integer
          description: Number of messages
        attributes:
          $ref: "#/components/schemas/MailboxAttributes"
        custom_attributes:
          type: [object, array]
          description: Custom attributes (an empty list when there are none)
          additionalProperties:
            type: string
        quota_used:
          type: integer
          description: Used bytes
        percent_in_use:
          type: [integer, string]
          description: Used part of the quota in percent, "- " for unlimited quota
        created:
          type: string
        modified:
          type: [string, "null"]
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
        percent_class:
          type: string
          enum:
            - info
            - success
            - warning
            - danger
          description: info (unlimited), success, warning (≥ 75 %), danger (≥ 90 %)
        last_imap_login:
          type: integer
          description: Unix time of the last IMAP login, 0 = none
        last_smtp_login:
          type: integer
        last_pop3_login:
          type: integer
        last_sso_login:
          type: integer
        last_sogo_login:
          type: integer
        max_new_quota:
          type: integer
          description: Largest quota in bytes the mailbox may get (domain limits)
        spam_aliases:
          type: integer
          description: Number of valid time-limited aliases
        pushover_active:
          type: integer
          enum: [0, 1]
        rl:
          description: Effective rate limit, `false` if there is none
          oneOf:
            - $ref: "#/components/schemas/MailboxRatelimit"
            - type: boolean
              const: false
        rl_scope:
          type: string
          enum:
            - mailbox
            - domain
          description: Whether `rl` is the mailbox's own limit or the domain limit
        is_relayed:
          type: integer
          description: 1 if the domain is relayed (backup MX)
        sender_acl:
          type: array
          description: Internal addresses and @domains the mailbox may send as
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    MailboxAdd:
      type: object
      required:
        - local_part
        - domain
      properties:
        local_part:
          type: string
          description: Part before the @
        domain:
          type: string
          description: Domain of the mailbox
        name:
          type: string
          description: Full name (`<` and `>` at the ends are removed)
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
          default: mailcow
          description: Login source; an external one only if it is the configured identity provider, else mailcow
        password:
          type: string
          format: password
          description: Checked against the password policy; empty (with `password2`) for a shared mailbox
        password2:
          type: string
          format: password
          description: The password again
        template:
          type: [integer, string]
          description: ID of the mailbox template for the defaults (default the first)
        quota:
          type: [integer, string]
          description: Quota in MiB, 0 = unlimited
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
          description: 1 active, 0 inactive, 2 login disabled (mail is accepted)
        tags:
          type: array
          items:
            type: string
          description: Tags (the first 26 are saved)
        protocol_access:
          type: array
          description: Allowed protocols; when sent it replaces the single `*_access` fields
          items:
            $ref: "#/components/schemas/ProtocolAccessName"
        imap_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        pop3_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        smtp_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sieve_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        eas_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        dav_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Login to SOGo from the UI
        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Password change at the first login (always 0 for external sources)
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Two-factor setup at the first login (always 0 for generic-oidc)
        tls_enforce_in:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        tls_enforce_out:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        relayhost:
          type: [integer, string]
          default: 0
          description: ID of a sender-dependent transport, 0 = none
        shared:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
          description: Shared mailbox without a login of its own, opened by group members
        quarantine_notification:
          type: string
          enum:
            - never
            - hourly
            - daily
            - weekly
        quarantine_category:
          type: string
          enum:
            - reject
            - add_header
            - all
        tagged_mail_handler:
          type: string
          enum:
            - subfolder
            - subject
            - none
          description: Handling of mail to address+tag, see `edit/delimiter_action`
        acl:
          type: array
          description: User ACLs to grant; when sent, all others are off
          items:
            $ref: "#/components/schemas/UserAclName"
        rl_value:
          type: [integer, string]
          description: Rate limit, messages per `rl_frame` (0 or empty = none)
        rl_frame:
          type: string
          enum:
            - s
            - m
            - h
            - d
        attribute_hash:
          type: string
          description: Internal, the hash of the template the values come from
    MailboxEdit:
      type: object
      properties:
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
          description: 1 active, 0 inactive, 2 login disabled (mail is accepted)
        name:
          type: string
          description: Full name; empty keeps the current name
        quota:
          type: [integer, string]
          description: Quota in MiB, 0 = unlimited; empty keeps the current quota
        password:
          type: string
          format: password
          description: New password (authsource mailcow), checked against the password policy
        password2:
          type: string
          format: password
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
          description: An external source only if it is the configured identity provider
        pw_recovery_email:
          type: string
          description: Address for password reset mails (authsource mailcow only)
        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        protocol_access:
          type: array
          description: Allowed protocols; when sent it replaces the single `*_access` fields
          items:
            $ref: "#/components/schemas/ProtocolAccessName"
        imap_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        pop3_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        smtp_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sieve_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        eas_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        dav_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        relayhost:
          type: [integer, string]
          description: ID of a sender-dependent transport, 0 = none
        shared:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        tags:
          type: array
          items:
            type: string
          description: Tags to add; existing tags stay (remove with `delete/mailbox/tag/{mailbox}`)
        tagged_mail_handler:
          type: string
          enum:
            - subfolder
            - subject
            - none
        sender_acl:
          description: >-
            Replaces the internal addresses and @domains the mailbox may send
            as; `*` (admins only) allows all, `["default"]` removes all
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        extended_sender_acl:
          type: string
          description: Replaces the external sender addresses or domains, separated by space, comma or semicolon
        attribute_hash:
          type: string
          description: Internal; cleared when not sent
    MailboxTemplateInput:
      type: object
      properties:
        quota:
          type: [integer, string]
          default: 0
          description: Quota in MiB, 0 = unlimited
        tags:
          type: array
          items:
            type: string
        tagged_mail_handler:
          type: string
          enum:
            - subfolder
            - subject
            - none
          default: none
        quarantine_notification:
          type: string
          enum:
            - never
            - hourly
            - daily
            - weekly
          default: hourly
        quarantine_category:
          type: string
          enum:
            - reject
            - add_header
            - all
          default: reject
        rl_value:
          type: [integer, string]
          description: Rate limit, messages per `rl_frame`
        rl_frame:
          type: string
          enum:
            - s
            - m
            - h
            - d
          default: s
        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
          default: 1
        tls_enforce_in:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        tls_enforce_out:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        protocol_access:
          type: array
          items:
            $ref: "#/components/schemas/ProtocolAccessName"
          description: Allowed protocols (default all)
        acl:
          type: array
          items:
            $ref: "#/components/schemas/UserAclName"
          description: User ACLs granted to new mailboxes
    MailboxTemplate:
      type: object
      properties:
        id:
          type: integer
        template:
          type: string
          description: Name
        type:
          type: string
          const: mailbox
        attributes:
          type: object
          description: The settings as in the example; quota in bytes, one `acl_<name>` flag per user ACL
          additionalProperties: true
        created:
          type: string
        modified:
          type: [string, "null"]
    Resource:
      type: object
      properties:
        name:
          type: string
          description: Address of the resource
        kind:
          type: string
          enum:
            - location
            - group
            - thing
        multiple_bookings:
          type: integer
          description: 0 always free, -1 unlimited but busy when booked, n ≥ 1 at most n bookings
        description:
          type: string
        active:
          type: integer
        active_int:
          type: integer
        domain:
          type: string
        local_part:
          type: string
    AppPassword:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mailbox:
          type: string
        domain:
          type: string
        password:
          type: string
          description: Hash of the app password
        created:
          type: string
        modified:
          type: [string, "null"]
        imap_access:
          type: integer
        smtp_access:
          type: integer
        dav_access:
          type: integer
        eas_access:
          type: integer
        pop3_access:
          type: integer
        sieve_access:
          type: integer
        active:
          type: integer
    SieveFilter:
      type: object
      properties:
        active:
          type: integer
          enum: [0, 1]
        id:
          type: integer
        username:
          type: string
          description: Mailbox
        filter_type:
          type: string
          enum:
            - prefilter
            - postfilter
        script_data:
          type: string
          description: The Sieve script
        script_desc:
          type: string
    TimeLimitedAlias:
      type: object
      properties:
        address:
          type: string
        goto:
          type: string
          description: Mailbox the alias delivers to
        description:
          type: string
        validity:
          type: integer
          description: Unix time of expiry (0 when made permanent by an edit)
        created:
          type: string
        modified:
          type: [string, "null"]
        permanent:
          type: integer
          enum: [0, 1]
    SpamPolicyEntry:
      type: object
      properties:
        object:
          type: string
          description: Mailbox or domain the entry belongs to
        value:
          type: string
          description: Sender address, domain or pattern
        prefid:
          type: integer
          description: ID for `delete/mailbox-policy`
    MailboxRatelimit:
      type: object
      properties:
        value:
          type: string
          description: Number of messages
        frame:
          type: string
          enum:
            - s
            - m
            - h
            - d
          description: Per second, minute, hour or day
    SpamScore:
      type: object
      properties:
        score:
          type: string
          description: '"low,high": junk folder from low, rejected from high'
    LastLogin:
      type: object
      properties:
        ui:
          description: Previous successful UI login, `false` if there is none, `[]` for domain admins
          oneOf:
            - type: object
              properties:
                remote:
                  type: string
                  description: IP address
                time:
                  type: integer
                  description: Unix time
            - type: boolean
              const: false
            - type: array
              maxItems: 0
        sasl:
          type: array
          items:
            type: object
            properties:
              real_rip:
                type: string
                description: Client IP; private and internal addresses as "Web/EAS/Internal (address)"
              datetime:
                type: string
              service:
                type: string
                description: e.g. imap, smtp, pop3, SOGO, SSO, MAILCOWUI
              app_password:
                type: integer
                description: ID of the app password used, 0 = none
              app_password_name:
                type: [string, "null"]
              location:
                type: string
                description: Country code of public addresses (if known)
    MailboxSearchRequest:
      type: object
      description: DataTables server-side request
      properties:
        draw:
          type: integer
          description: Counter, returned unchanged
        start:
          type: integer
          description: Offset of the first row; without it all rows are returned
        length:
          type: integer
          description: Rows per page, -1 = all
        search:
          type: object
          properties:
            value:
              type: string
              description: Searched in all searchable columns (substring)
        order:
          type: array
          items:
            type: object
            properties:
              column:
                type: integer
                description: Column number (index in `columns`)
              dir:
                type: string
                enum:
                  - asc
                  - desc
        columns:
          type: array
          description: Column n of the table is `columns[n]`; needed to search or sort
          items:
            type: object
            properties:
              data:
                type: [string, integer]
                description: >-
                  Name of the column in the UI; for this column's
                  `search.value` only a column number works, other values
                  filter the address
              searchable:
                type: [boolean, string]
                description: true or "true" includes the column in the search
              orderable:
                type: [boolean, string]
                description: true or "true" allows sorting by the column
              search:
                type: object
                properties:
                  value:
                    type: string
                    description: Filter for this column only (substring)
    MailboxSearchResult:
      type: object
      properties:
        draw:
          type: integer
        recordsTotal:
          type: integer
        recordsFiltered:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Mailbox"
    Alias:
      type: object
      properties:
        in_primary_domain:
          type: string
          description: Target domain if `domain` is an alias domain, else empty
        id:
          type: integer
        domain:
          type: string
          description: Domain of the address, a domain or alias domain
        public_comment:
          type: [string, "null"]
          description: Comment shown to the users
        private_comment:
          type: [string, "null"]
          description: Comment for administrators
        goto:
          type: string
          description: >-
            Comma-separated destination addresses, or `null@localhost`
            (discard), `spam@localhost` (learn as spam), `ham@localhost` (learn
            as ham)
        address:
          type: string
          description: Alias address, `@example.org` for a catch-all
        is_catch_all:
          type: integer
          description: 1 = catch-all of the domain
        internal:
          type: integer
          description: 1 = only reachable from its own domain and its alias domains
        active:
          type: integer
          description: 1 = active, 0 = inactive
        active_int:
          type: integer
          description: Same as `active`
        sogo_visible:
          type: integer
          description: 1 = selectable sender in SOGo
        sogo_visible_int:
          type: integer
          description: Same as `sogo_visible`
        sender_allowed:
          type: integer
          description: 1 = the destination mailboxes may send as this alias
        group_id:
          type: [integer, "null"]
          description: >-
            Mailbox group whose distribution address this is; such aliases can
            only be changed in the group
        group_name:
          type: [string, "null"]
          description: Name of that mailbox group
        created:
          type: string
          description: Creation time, `YYYY-MM-DD hh:mm:ss`
        modified:
          type: [string, "null"]
          description: Time of the last change
    BccMap:
      type: object
      properties:
        id:
          type: integer
        local_dest:
          type: string
          description: Domain as `@example.org` or the address of a mailbox or alias
        bcc_dest:
          type: string
          description: Address that gets the copies
        active:
          type: integer
          description: 1 = active, 0 = inactive
        type:
          type: string
          enum:
            - sender
            - rcpt
          description: "`sender`: mail sent by `local_dest`; `rcpt`: mail sent to it"
        created:
          type: string
        domain:
          type: string
          description: Domain of `local_dest`
        modified:
          type: [string, "null"]
    RecipientMap:
      type: object
      properties:
        id:
          type: integer
        recipient_map_old:
          type: string
          description: Original recipient, an address or `@domain`
        recipient_map_new:
          type: string
          description: New recipient, an address or `@domain`
        active:
          type: integer
          description: 1 = active, 0 = inactive
        created:
          type: string
        modified:
          type: [string, "null"]
    TlsPolicyMap:
      type: object
      properties:
        id:
          type: integer
        dest:
          type: string
          description: Destination
        policy:
          type: string
          enum:
            - none
            - may
            - encrypt
            - dane
            - dane-only
            - fingerprint
            - verify
            - secure
        parameters:
          type: [string, "null"]
          description: Space-separated `name=value` attributes, may be empty
        active:
          type: integer
          description: 1 = active, 0 = inactive
        created:
          type: string
        modified:
          type: [string, "null"]
    Relayhost:
      type: object
