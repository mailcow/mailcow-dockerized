  /api/v1/edit/transport:
    post:
      tags:
        - Routing
      summary: Update transport maps
      operationId: editTransport
      description: >-
        Changes the transport maps in `items`; fields not sent keep their
        value. An empty `username` also clears the password; credentials apply
        to all entries of the next hop. Destination and next-hop errors stop
        the call.


        Messages: `object_modified`; errors `relayhost_invalid`,
        `transport_dest_exists`, `invalid_destination`, `next_hop_interferes`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs of the transport maps, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    destination:
                      type: string
                      description: One destination (see add/transport)
                    nexthop:
                      type: string
                      description: Next hop, e.g. `[mx.example.com]:25`
                    username:
                      type: string
                      description: SMTP user name; empty removes the credentials
                    password:
                      type: string
                      description: SMTP password
                    is_mx_based:
                      type: [boolean, integer, string]
                      description: 1 = `destination` is a regular expression for MX names
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 4
              attr:
                nexthop: "[mx2.example.com]:25"
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/cors:
    post:
      summary: Edit CORS settings
      description: >-
        Sets the origins and methods allowed to call the API from a browser. A
        missing value is reset to its default.


        Messages: `cors_headers_edited`; errors `cors_invalid_origin`,
        `cors_invalid_method`.
      operationId: editCors
      tags:
        - Cross-Origin Resource Sharing (CORS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    allowed_origins:
                      description: >-
                        `scheme://host[:port]` (http/https, no path) or `*`; a
                        list or one origin per line. Default: the mailcow URL.
                      oneOf:
                        - type: array
                          items:
                            type: string
                        - type: string
                    allowed_methods:
                      description: >-
                        Uppercase; a list or a string with single separators
                        (`GET,POST`, not `GET, POST`). Default: all four.
                      oneOf:
                        - type: array
                          items:
                            type: string
                            enum:
                              - GET
                              - POST
                              - PUT
                              - DELETE
                        - type: string
              required:
                - attr
            example:
              attr:
                allowed_origins:
                  - https://app.example.org
                  - https://admin.example.com:8443
                allowed_methods:
                  - GET
                  - POST
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
