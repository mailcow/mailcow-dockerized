          schema:
            type: string
          example: example.org
        - $ref: "#/components/parameters/MailboxTagsQuery"
      responses:
        "200":
          description: List of mailboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mailbox"
