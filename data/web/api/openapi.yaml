        arrival_time:
          type: integer
          description: Unix time
        message_size:
          type: integer
          description: Size in bytes
        forced_expire:
          type: boolean
        sender:
          type: string
        recipients:
          type: array
          description: Recipient addresses, with the reason of the delay in brackets if there is one
          items:
            type: string
    QuarantineItem:
      type: object
