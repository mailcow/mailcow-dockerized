  /api/v1/edit/mailbox/template:
    post:
      tags:
        - Mailboxes
      summary: Update mailbox templates
      operationId: editMailboxTemplate
      description: >-
        Changes mailbox templates and passes the change on to the mailboxes
        whose effective group template it is. Admins only (`access_denied`).
        The template "Default" keeps its name. Messages: `template_id_invalid`,
        `quarantine_category_invalid`, once at the end `template_modified`.


        Send the complete template as the UI does: values that are not sent are
        not taken over from the stored template. `quota` falls back to 0
        (unlimited), `quarantine_category` must be sent (else
        `quarantine_category_invalid`), and without `protocol_access` or `acl`
        the protocol or ACL settings are lost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Template ID or list of template IDs
                  oneOf:
                    - type: integer
                    - type: array
                      items:
                        type: integer
                attr:
                  allOf:
                    - type: object
                      properties:
                        template:
                          type: string
                          description: New name of the template (not for "Default")
                    - $ref: "#/components/schemas/MailboxTemplateInput"
            example:
              items:
                - 3
              attr:
                template: Sales
                quota: 4096
                tags:
                  - sales
                tagged_mail_handler: subfolder
                quarantine_notification: daily
                quarantine_category: reject
                rl_value: 100
                rl_frame: h
                force_pw_update: 0
                force_tfa: 0
                sogo_access: 1
                active: 1
                tls_enforce_in: 0
                tls_enforce_out: 1
                protocol_access:
                  - imap
                  - smtp
                  - sieve
                  - dav
                acl:
                  - spam_alias
                  - spam_score
                  - delimiter_action
                  - app_passwds
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/rename-mbox:
    post:
      tags:
        - Mailboxes
      summary: Rename a mailbox
      operationId: renameMailbox
      description: >-
        Renames `old_local_part@domain` to `new_local_part@domain`: the address
        in all tables (aliases, ACLs, filters, app passwords, BCC and recipient
        maps, sync jobs, groups, SOGo), the maildir and the SOGo account; IMAP
        ACLs are moved over. `items` is not used, the mailbox is named in
        `attr`. The mailbox must be active (1 or 2). Admins and domain admins
        (for their domains). Errors: `username_invalid`, `access_denied`.
        Success: `mailbox_renamed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  required:
                    - domain
                    - old_local_part
                    - new_local_part
                  properties:
                    domain:
                      type: string
                      description: Domain of the mailbox
                    old_local_part:
                      type: string
                      description: Current local part
                    new_local_part:
                      type: string
                      description: New local part
                    create_alias:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      default: 0
                      description: 1 creates an alias from the old to the new address
            example:
              items: []
              attr:
                domain: example.org
                old_local_part: john.doe
                new_local_part: john
                create_alias: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailbox/template:
    post:
      tags:
        - Mailboxes
      summary: Delete mailbox templates
      operationId: deleteMailboxTemplate
      description: >-
        Deletes mailbox templates by ID; the template "Default" is kept
        silently. Admins only (`access_denied`). Answers `template_removed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Template IDs
              items:
                type: integer
            example:
              - 3
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/last-login/{mailbox}:
    get:
      tags:
        - Mailboxes
      summary: Get the last logins of a mailbox
      operationId: getLastLogin
      description: >-
        Logins of the mailbox in the last 7 days (`sasl`: one entry per
        address, service and app password with the latest time) and its
        previous UI login (`ui`, the one before the latest). `sasl` is empty
        without access to the mailbox; `ui` is only given to admins (API keys)
        and the mailbox user itself (`false` when there is none), domain admins
        get an empty list.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: Logins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastLogin"
              example:
                ui:
                  remote: 198.51.100.23
                  time: 1793011200
                sasl:
                  - real_rip: 198.51.100.23
                    datetime: "2026-11-09 08:12:44"
                    service: imap
                    app_password: 23
                    app_password_name: Thunderbird
                    location: DE
                  - real_rip: Web/EAS/Internal (172.22.1.248)
                    datetime: "2026-11-08 17:03:10"
                    service: SOGO
                    app_password: 0
                    app_password_name: null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/last-login/{mailbox}/{days}:
    get:
      tags:
        - Mailboxes
      summary: Get the last logins of a mailbox for a period
      operationId: getLastLoginDays
      description: >-
        Like `get/last-login/{mailbox}` for the last `{days}` days; values
        below 1 mean 7.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
        - name: days
          in: path
          required: true
          description: Number of days
          schema:
            type: integer
            minimum: 1
          example: 30
      responses:
        "200":
          description: Logins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/reset-last-login/{mailbox}:
    get:
      tags:
        - Mailboxes
      summary: Clear the login history of a mailbox
      operationId: resetLastLogin
      description: >-
        Deletes the stored logins of the mailbox (the SASL log and, for admins
        and the mailbox user itself, the successful UI logins). A `get` route
        that changes data: read-only API keys can call it too. Always answers
        `true`.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: boolean
              example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/delete/eas_cache:
    post:
      tags:
        - Mailboxes
      summary: Reset the ActiveSync devices of mailboxes
      operationId: deleteEasCache
      description: >-
        Deletes the ActiveSync device cache of the mailboxes, so devices sync
        from scratch. Needs the user ACL `eas_reset`. API keys may reset any
        mailbox, a mailbox user only its own. Messages per mailbox: `eas_reset`
        or `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxItems"
            example:
              - john.doe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/sogo_profile:
    post:
      tags:
        - Mailboxes
      summary: Reset the SOGo profile of mailboxes
      operationId: deleteSogoProfile
      description: >-
        Deletes the SOGo data of the mailboxes: profile, settings, calendars,
        address books and their shares. Needs the user ACL
        `sogo_profile_reset`. API keys may reset any mailbox, a mailbox user
        only its own. Messages per mailbox: `sogo_profile_reset` or
        `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxItems"
            example:
              - john.doe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/bcc-destination-options:
    get:
      tags:
        - Mailboxes
      summary: Get the possible BCC map destinations
      operationId: getBccDestinationOptions
      description: >-
        What a BCC map can be bound to: the domains the caller manages, per
        mailbox the mailbox and its aliases (aliases of other domains only if
        the caller manages them), and the alias domains. Keys without entries
        are left out.
      responses:
        "200":
          description: Domains, mailboxes with their addresses, alias domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      type: string
                  mailboxes:
                    type: object
                    description: Mailbox address → the mailbox and its aliases
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  alias_domains:
                    type: array
                    items:
                      type: string
              example:
                domains:
                  - example.org
                mailboxes:
                  john.doe@example.org:
                    - john.doe@example.org
                    - sales@example.org
                  jane.roe@example.org:
                    - jane.roe@example.org
                alias_domains:
                  - example.net
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/search/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Search mailboxes page by page
      operationId: searchMailboxes
      description: >-
        Server-side search behind the mailbox table of the UI, with the request
        and answer format of DataTables (server-side processing): paging,
        sorting and a search over the mailboxes the caller manages (API keys:
        all; resources are not included). Read-only API keys may use it.
        Mailbox users get `403` with `Insufficient permissions`.


        Columns are addressed by number, as in the UI table: 2 address
        (`username`), 3 quota, 4 last mail login, 5 last password change, 6
        quota in use, 7 name, 20 messages, 23 tags, 24 active. Sorting works on
        all of them except 23; searching on 2, 3, 7, 23 and 24. Searching in 4,
        5, 6 or 20 or sorting by 23 makes the database query fail, so send
        these columns as not searchable/orderable. Other numbers stand for the
        address. `columns` is needed for a search or a sort:
        `columns[n]` describes column n.


        Each entry of `data` holds the full details of a mailbox, like
        `get/mailbox/{id}`. `recordsTotal` counts the mailboxes after the
        search too (same as `recordsFiltered`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxSearchRequest"
            example:
              draw: 1
              start: 0
              length: 25
              search:
                value: john
              order:
                - column: 2
                  dir: asc
              columns:
                - searchable: false
                  orderable: false
                - searchable: false
                  orderable: false
                - data: username
                  searchable: true
                  orderable: true
                - searchable: false
                  orderable: true
                - searchable: false
                  orderable: true
                - searchable: false
                  orderable: true
                - searchable: false
                  orderable: true
                - data: name
                  searchable: true
                  orderable: true
      responses:
        "200":
          description: >-
            One page of mailboxes. A failing database query answers
            `{"error": "An SQL error occurred: ..."}` instead.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MailboxSearchResult"
                  - type: object
                    properties:
                      error:
                        type: string
              examples:
                page:
                  $ref: "#/components/examples/MailboxSearchPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is a mailbox user or not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                type: error
                msg: Insufficient permissions
  /api/v1/edit/identity-provider:
    post:
      summary: Configure the Identity Provider
      description: >-
        Admins only (every read/write API key). Saves the configuration of the
        external Identity Provider (Keycloak, generic OpenID Connect or LDAP).
        Send the complete configuration of the provider: every setting of the
        provider is written, settings that are not sent get their default (flags
        off, `login_provisioning` off, `group_autocreate` off), and the secrets
        (`client_secret`, `bindpass`) must be sent again. `redirect_url_extra`,
        `default_template` and the `mappers`/`templates` pair are only changed
        when sent. Settings of other providers stay stored. The cached Keycloak
        access token is cleared. Changing the LDAP `id_attribute` drops the
        stored LDAP ids (mailboxes are linked by email again). `items` is not
        used.


        Answers `object_modified`. Errors: `required_data_missing` (`authsource`
        or a required setting missing: Keycloak `server_url`, `realm`,
        `client_id`, `client_secret`, `redirect_url`, `version`; generic-oidc
        `authorize_url`, `token_url`, `userinfo_url`, `client_id`,
        `client_secret`, `redirect_url`; LDAP `basedn`, `binddn`, `bindpass`),
        `invalid_authsource`, `authsource_in_use` (mailboxes use another
        external provider), `access_denied`. Secrets are logged as `*`.
      operationId: editIdentityProvider
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  $ref: "#/components/schemas/IdentityProviderAttributes"
            examples:
              keycloak:
                value:
                  attr:
                    authsource: keycloak
                    server_url: https://auth.example.org
                    realm: mailcow
                    client_id: mailcow
                    client_secret: client-secret-value
                    redirect_url: https://mail.example.org
                    redirect_url_extra:
                      - https://webmail.example.org
                    version: 26.1.3
                    login_provisioning: 1
                    mailpassword_flow: 0
                    periodic_sync: 1
                    import_users: 1
                    sync_interval: 15
                    offboarding: 1
                    offboarding_limit: 10
                    group_sync: 1
                    group_autocreate: 1
                    group_paths: /mailcow/*
                    group_default_domain: example.org
                    default_template: Default
                    mappers:
                      - staff
                    templates:
                      - Staff
              ldap:
                value:
                  attr:
                    authsource: ldap
                    host: ldap1.example.org,ldap2.example.org
                    port: 636
                    use_ssl: 1
                    use_tls: 0
                    ignore_ssl_error: 0
                    basedn: dc=example,dc=org
                    binddn: cn=mailcow,ou=services,dc=example,dc=org
                    bindpass: bind-password
                    username_field: mail
                    filter: (objectClass=inetOrgPerson)
                    attribute_field: departmentNumber
                    login_provisioning: 1
                    periodic_sync: 1
                    import_users: 1
                    sync_interval: 30
                    group_sync: 1
                    group_filter: (objectClass=groupOfNames)
                    group_member_mode: member
                    group_member_attribute: member
                    default_template: Default
              generic-oidc:
                value:
                  attr:
                    authsource: generic-oidc
                    authorize_url: https://sso.example.org/application/o/authorize/
                    token_url: https://sso.example.org/application/o/token/
                    userinfo_url: https://sso.example.org/application/o/userinfo/
                    client_id: mailcow
                    client_secret: client-secret-value
                    redirect_url: https://mail.example.org
                    client_scopes: openid profile email mailcow_template
                    login_provisioning: 1
                    default_template: Default
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/identity-provider:
    get:
      summary: Get Identity Provider settings
      description: >-
        The stored settings of the external Identity Provider (admins and API
        keys; `{}` for others). Values are returned as stored (mostly strings),
        also settings of a provider that was configured before. Read-only API
        keys get `*` instead of `client_secret`, `bindpass` and `access_token`;
        read/write API keys get them in plain text. Without a configuration the
        answer is `{"login_provisioning": 1}`. Any further path segment other
        than `sync-status` returns the same.
      operationId: getIdentityProvider
      tags:
        - Identity Provider
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderSettings"
              example:
                authsource: keycloak
                server_url: https://auth.example.org
                realm: mailcow
                client_id: mailcow
                client_secret: "*"
                redirect_url: https://mail.example.org
                redirect_url_extra:
                  - https://webmail.example.org
                version: 26.1.3
                mailpassword_flow: "0"
                periodic_sync: "1"
                import_users: "1"
                sync_interval: "15"
                ignore_ssl_error: false
                login_provisioning: true
                group_paths: /mailcow/*
                offboarding: "1"
                offboarding_limit: "10"
                group_sync: "1"
                group_autocreate: "1"
                group_default_domain: example.org
                default_template: Default
                mappers:
                  - staff
                templates:
                  - Staff
                access_token: "*"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/identity-provider-test:
    post:
      summary: Test an Identity Provider connection
      description: >-
        Admins only (every read/write API key). Tests the connection data in
        `attr` (the stored settings are not used, send the secrets too):
        Keycloak requests a client_credentials token from
        `<server_url>/realms/<realm>/protocol/openid-connect/token`, generic-oidc
        sends an OPTIONS request to `token_url` (both succeed on HTTP 200, 7 s
        timeout), LDAP connects and binds with `host`, `port`, `basedn`,
        `binddn`, `bindpass` (all required), `use_ssl`, `use_tls`. Nothing is
        stored. `items` is not used.


        The answer carries no details: `{"type": "success", "msg": "Task
        completed"}` or `{"type": "error", "msg": "Cannot edit item"}`
        (`access_denied` for non-admins). A missing or unknown `authsource`
        answers success without testing anything.
      operationId: testIdentityProvider
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  required:
                    - authsource
                  properties:
                    authsource:
                      type: string
                      enum:
                        - keycloak
                        - generic-oidc
                        - ldap
                    server_url:
                      type: string
                      description: Keycloak base URL
                    realm:
                      type: string
                      description: Keycloak realm
                    client_id:
                      type: string
                      description: Keycloak client id
                    client_secret:
                      type: string
                      description: Keycloak client secret
                    token_url:
                      type: string
                      description: generic-oidc token endpoint
                    ignore_ssl_error:
                      type:
                        - boolean
                        - integer
                        - string
                      description: Do not verify the TLS certificate
                    host:
                      type: string
                      description: LDAP host, or several separated by commas
                    port:
                      type:
                        - integer
                        - string
                      description: LDAP port
                    basedn:
                      type: string
                    binddn:
                      type: string
                    bindpass:
                      type: string
                    use_ssl:
                      type:
                        - boolean
                        - integer
                        - string
                      description: LDAPS
                    use_tls:
                      type:
                        - boolean
                        - integer
                        - string
                      description: StartTLS, ignored with `use_ssl`
            example:
              attr:
                authsource: keycloak
                server_url: https://auth.example.org
                realm: mailcow
                client_id: mailcow
                client_secret: client-secret-value
                ignore_ssl_error: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/identity-provider:
    post:
      summary: Delete the Identity Provider configuration
      description: >-
        Admins only (every read/write API key). Deletes all Identity Provider
        settings, all mailbox links (`identity-link`) and the sync run history.
        Refused with `authsource_in_use` while any mailbox uses an external
        provider. The body must be valid JSON, its content is not used (e.g.
        `[]`). Answers `item_deleted`, or `authsource_in_use`, `access_denied`.
      operationId: deleteIdentityProvider
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              description: Not used, any JSON value
            example: []
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/filter:
    post:
      tags:
        - Mailbox filters
      summary: Create a Sieve filter
      operationId: addFilter
      description: >-
        Adds a Sieve script to a mailbox. Needs the ACL `filters`, which admins
        (API keys) and domain admins have, mailbox users not. `username` is
        required for API keys and domain admins (`no_user_defined`). The script
        is checked with a Sieve parser (`sieve_error`). Activating a filter
        deactivates the other filters of the same type and mailbox. Errors:
        `access_denied`, `script_empty`, `value_missing`, `filter_type`.
        Success: `mailbox_modified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - script_data
                - script_desc
                - filter_type
              properties:
                username:
                  type: string
                  description: Mailbox of the filter
                script_desc:
                  type: string
                  description: Description
                script_data:
                  type: string
                  description: The Sieve script
                filter_type:
                  type: string
                  enum:
                    - prefilter
                    - postfilter
                  description: Runs before (prefilter) or after (postfilter) the user's own filters
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
            example:
              username: john.doe@example.org
              script_desc: Move newsletters
              script_data: |-
                require "fileinto";
                if header :contains "List-Id" "newsletter" {
                  fileinto "Newsletters";
                }
              filter_type: prefilter
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/filters/all:
    get:
      tags:
        - Mailbox filters
      summary: Get all Sieve filters
      operationId: getFilters
      description: >-
        The Sieve filters of all mailboxes the caller manages, `{}` when there
        are none.
      responses:
        "200":
          description: List of filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SieveFilter"
              example:
                - active: 1
                  id: 7
                  username: john.doe@example.org
                  filter_type: prefilter
                  script_data: |-
                    require "fileinto";
                    if header :contains "List-Id" "newsletter" {
                      fileinto "Newsletters";
                    }
                  script_desc: Move newsletters
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/filters/{mailbox}:
    get:
      tags:
        - Mailbox filters
      summary: Get the Sieve filters of a mailbox
      operationId: getMailboxFilters
      description: >-
        The Sieve filters of the mailbox, `{}` when there are none or the
        caller has no access. If `{mailbox}` is no address, the session user's
        filters are returned (nothing for API keys).
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: List of filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SieveFilter"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/filter:
    post:
      tags:
        - Mailbox filters
      summary: Update Sieve filters
      operationId: editFilter
      description: >-
        Changes filters by ID; fields that are not sent keep their value.
        Needs the ACL `filters` (admins, domain admins). Activating a filter
        deactivates the other filters of the same type and mailbox. Messages
        per ID: `mailbox_modified` or `access_denied` (unknown ID or no
        access), `sieve_error`, `filter_type`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Filter ID or list of IDs
                  oneOf:
                    - type: integer
                    - type: array
                      items:
                        type: integer
                attr:
                  type: object
                  properties:
                    script_desc:
                      type: string
                    script_data:
                      type: string
                    filter_type:
                      type: string
                      enum:
                        - prefilter
                        - postfilter
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
            example:
              items:
                - 7
              attr:
                active: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/filter:
    post:
      tags:
        - Mailbox filters
      summary: Delete Sieve filters
      operationId: deleteFilter
      description: >-
        Deletes filters by ID; IDs that are not numeric are skipped. Needs the
        ACL `filters` (admins, domain admins). Messages per ID: `delete_filter`
        or `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Filter IDs
              items:
                type: integer
            example:
              - 7
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/active-user-sieve/{mailbox}:
    get:
      tags:
        - Mailbox filters
      summary: Get the active Sieve script of a mailbox
      operationId: getActiveUserSieve
      description: >-
        The Sieve script the user activated in its mail client or SOGo (read
        from Dovecot), as a list with one string. `{}` when there is none or
        the caller has no access. If `{mailbox}` is no address, the session
        user's script is read (nothing for API keys).
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: The script as the only element of a list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  type: string
              example:
                - |-
                  require ["fileinto"];
                  if header :contains "subject" "invoice" {
                    fileinto "Invoices";
                  }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/add/mailbox-policy:
    post:
      tags:
        - Mailbox antispam policies
      summary: Add a sender to the allow or deny list of a mailbox
      operationId: addMailboxPolicy
      description: >-
        Adds a sender address or pattern to the spam allow list (`wl`, mail is
        never treated as spam) or deny list (`bl`, mail is rejected) of a
        mailbox. Needs the user ACL `spam_policy`. `username` is required for
        all callers; a mailbox user may only name its own mailbox. Errors:
        `access_denied`, `policy_list_from_invalid` (characters other than
        letters, digits, `@ _ . - *`), `policy_list_from_exists`. Success:
        `mailbox_modified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - object_list
                - object_from
              properties:
                username:
                  type: string
                  description: Mailbox
                object_list:
                  type: string
                  enum:
                    - wl
                    - bl
                  description: wl = allow list, bl = deny list
                object_from:
                  type: string
                  description: Sender address, domain or pattern with `*`
            example:
              username: john.doe@example.org
              object_list: bl
              object_from: "*@spam.example.com"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/policy_wl_mailbox/{mailbox}:
    get:
      tags:
        - Mailbox antispam policies
      summary: Get the allow list of a mailbox
      operationId: getMailboxPolicyAllowList
      description: >-
        The allow list entries that apply to the mailbox: its own and those of
        its domain (`object` tells which). `{}` when there are none, the
        mailbox does not exist or the caller has no access. If `{mailbox}` is
        no address, the session user's list is returned (nothing for API
        keys).
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpamPolicyEntry"
              example:
                - object: john.doe@example.org
                  value: "*@partner.example.com"
                  prefid: 12
                - object: example.org
                  value: newsletter@example.net
                  prefid: 4
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/policy_bl_mailbox/{mailbox}:
    get:
      tags:
        - Mailbox antispam policies
      summary: Get the deny list of a mailbox
      operationId: getMailboxPolicyDenyList
      description: >-
        Like `get/policy_wl_mailbox/{mailbox}` for the deny list.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpamPolicyEntry"
              example:
                - object: john.doe@example.org
                  value: "*@spam.example.com"
                  prefid: 13
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/delete/mailbox-policy:
    post:
      tags:
        - Mailbox antispam policies
      summary: Delete allow or deny list entries of mailboxes
      operationId: deleteMailboxPolicy
      description: >-
        Deletes allow or deny list entries of mailboxes by their `prefid`.
        Needs the user ACL `spam_policy` and access to the mailbox of the entry
        (entries of a domain are refused, use `delete/domain-policy`). Messages
        per ID: `items_deleted` or `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: prefid values
              items:
                type: integer
            example:
              - 13
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/rsetting:
    post:
      summary: Add Rspamd settings rule
      description: >-
        Adds a rule to the Rspamd settings map (admins only, an API key may).
        `content` is the body of an Rspamd settings entry (`priority`, `rcpt`,
        `from`, `authenticated`, `apply` ...); active rules are handed to
        Rspamd as `additional_settings_<id>`. The presets of
        `GET /api/v1/get/presets/rspamd` are examples.


        Messages: `settings_map_added`; `map_content_empty` (danger) when
        `content` is empty; `access_denied` for non-admins. `desc` is required
        by the database: without it the insert fails and the answer is empty.
      operationId: addRspamdSetting
      tags:
        - Rspamd
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RspamdSettingAttributes"
            example:
              desc: Disable all but DKIM and rate limit for authenticated users
              content: |-
                priority = 10;
                authenticated = yes;
                apply "default" {
                  symbols_enabled = ["DKIM_SIGNED", "RATELIMITED", "RATELIMIT_UPDATE", "RATELIMIT_CHECK"];
                }
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/rsetting/{id}:
    get:
      summary: Get Rspamd settings rules
      description: >-
        Returns one rule of the Rspamd settings map, or all rules with `all`
        (a list of the same objects). Admins only (an API key may); other
        callers, unknown IDs and an empty map get `{}`.
      operationId: getRspamdSettings
      tags:
        - Rspamd
      parameters:
        - name: id
          in: path
          required: true
          description: "`all` or the ID of a rule"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The rule, or the list of rules for `all`
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/RspamdSetting"
                  - $ref: "#/components/schemas/RspamdSetting"
              example:
                - id: 1
                  desc: Disable Rspamd for example.org
                  content: |-
                    priority = 10;
                    rcpt = "/.*@example\.org$/";
                    from = "/.*/";
                    apply "default" {
                      MAILCOW_WHITE = -9999.0;
                    }
                    symbols [
                      "MAILCOW_WHITE"
                    ]
                  active: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/rsetting:
    post:
      summary: Edit Rspamd settings rules
      description: >-
        Changes rules of the Rspamd settings map (admins only, an API key may).
        Only the attributes that are sent change; an empty `desc` or `content`
        keeps the old value. `content` is trimmed.


        Messages: `object_modified` (with all requested IDs) for every changed
        rule, `settings_map_invalid` (danger) for an unknown ID,
        `access_denied` for non-admins.
      operationId: editRspamdSetting
      tags:
        - Rspamd
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID or list of IDs of the rules
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    desc:
                      type: string
                      description: Short description (empty = keep)
                    content:
                      type: string
                      description: Rule content (empty = keep)
                    active:
                      type: [boolean, integer, string]
                      description: 1 = the rule is handed to Rspamd, 0 = inactive (not sent = keep)
              required:
                - items
                - attr
            example:
              items:
                - 1
              attr:
                desc: Disable Rspamd for example.org
                active: "0"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/rsetting:
    post:
      summary: Delete Rspamd settings rules
      description: >-
        Deletes rules of the Rspamd settings map (admins only, an API key may).
        Answers `settings_map_removed` for every ID, also for IDs that do not
        exist; `access_denied` for non-admins.
      operationId: deleteRspamdSettings
      tags:
        - Rspamd
      requestBody:
        content:
          application/json:
            schema:
              description: IDs of the rules (a single ID works too)
              oneOf:
                - type: array
                  items:
                    type: [integer, string]
                - type: [integer, string]
            example:
              - 1
              - 2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/rspamd-map:
    post:
      summary: Edit Rspamd global regex maps
      description: >-
        Replaces the content of global Rspamd regex maps (Configuration >
        Global filters in the UI; admins only, an API key may). Each line is a
        regular expression like `/^spam@example\.org$/i`, lines starting with
        `#` are comments. The UI checks the expressions before it saves, the
        API does not. Every map takes about a second (the file is touched
        again for Rspamd to reload it).


        Messages: `object_modified` per map, `global_map_invalid` (danger) for
        an unknown map name, `global_map_write_error` (danger) when the file
        cannot be written, `access_denied` for non-admins. A known map whose
        file does not exist is not written but still answered with
        `object_modified`.
      operationId: editRspamdMap
      tags:
        - Rspamd
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: File name or list of file names of the maps; all of them get the same content
                  oneOf:
                    - type: array
                      items:
                        $ref: "#/components/schemas/RspamdRegexMap"
                    - $ref: "#/components/schemas/RspamdRegexMap"
                attr:
                  type: object
                  properties:
                    rspamd_map_data:
                      type: string
                      description: New content of the map (trimmed, replaces the whole file)
                  required:
                    - rspamd_map_data
              required:
                - items
                - attr
            example:
              items:
                - global_smtp_from_blacklist.map
              attr:
                rspamd_map_data: |-
                  # Envelope senders to reject
                  /^spammer@example\.com$/i
                  /@spam\.example\.net$/i
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/rspamd/actions:
    get:
      summary: Get Rspamd action statistics
      description: >-
        Returns how many messages Rspamd handled with each action (from
        Rspamd's `/stat`), as `[action, count]` pairs. Greylisted
        messages are counted as `soft reject`. Admins only (an API key may);
        other callers, or an Rspamd that does not answer, get `{}`.
      operationId: getRspamdActions
      tags:
        - Rspamd
      responses:
        "200":
          description: List of `[action, count]` pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                      description: Action, e.g. `reject`, `soft reject`, `rewrite subject`, `add header`, `no action`
                    - type: integer
                      description: Number of messages
                  minItems: 2
                  maxItems: 2
              example:
                - - reject
                  - 38
                - - soft reject
                  - 1
                - - rewrite subject
                  - 0
                - - add header
                  - 6
                - - no action
                  - 255
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/presets/{kind}:
    get:
      summary: Get Rspamd or Sieve presets
      description: >-
        Returns the example presets the UI offers: `rspamd` for Rspamd settings
        rules (see `POST /api/v1/add/rsetting`), `sieve` for Sieve filters.
        `headline` is translated into the language of the session. Admins and
        domain admins (an API key may); other callers get `{}`.
      operationId: getPresets
      tags:
        - Rspamd
        - Global filters
      parameters:
        - name: kind
          in: path
          required: true
          description: Kind of presets
          schema:
            type: string
            enum:
              - rspamd
              - sieve
          example: rspamd
      responses:
        "200":
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"
              example:
                - name: preset_1
                  headline: Disable all but DKIM and rate limit for authenticated users
                  content: |-
                    priority = 10;
                    authenticated = yes;
                    apply "default" {
                      symbols_enabled = ["BCC", "DKIM_SIGNED", "RATELIMITED", "RATELIMIT_UPDATE", "RATELIMIT_CHECK", "DYN_RL_CHECK", "HISTORY_SAVE", "MILTER_HEADERS", "ARC_SIGNED"];
                    }
                - name: preset_4
                  headline: Disable Rspamd for a domain
                  content: |-
                    priority = 10;
                    rcpt = "/.*@example.org$/";
                    from = "/.*/";
                    apply "default" {
                      MAILCOW_WHITE = -9999.0;
                    }
                    symbols [
                      "MAILCOW_WHITE"
                    ]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/add/global-filter:
    post:
      summary: Save a global Sieve filter
      description: >-
        Replaces the global Sieve prefilter (runs before the filters of the
        mailboxes) or postfilter (runs after them) and restarts Dovecot.
        Admins only (an API key may). The script is parsed first and not
        saved when it has errors.


        Messages: `dovecot_restart_success`, or `dovecot_restart_failed`
        (warning), then `global_filter_written`; `sieve_error` (danger) with
        the parser error; `invalid_filter_type` (danger);
        `global_filter_write_error` (danger); `access_denied` for non-admins.
      operationId: addGlobalFilter
      tags:
        - Global filters
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter_type:
                  type: string
                  enum:
                    - prefilter
                    - postfilter
                  description: Which global filter to replace
                script_data:
                  type: string
                  description: The Sieve script (CRLF and CR line ends become LF)
              required:
                - filter_type
                - script_data
            example:
              filter_type: postfilter
              script_data: |-
                require "fileinto";
                if header :contains "X-Spam-Flag" "YES" {
                  fileinto "Junk";
                }
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/global_filters/all:
    get:
      summary: Get the global Sieve filters
      description: >-
        Returns the global Sieve prefilter and postfilter. Admins only (an API
        key may); other callers get `{}`.
      operationId: getGlobalFilters
      tags:
        - Global filters
      responses:
        "200":
          description: Both scripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalFilters"
              example:
                prefilter: |
                  # global_sieve_before script
                  # global_sieve_before -> user sieve_before (mailcow UI) -> user sieve_after (mailcow UI) -> global_sieve_after
                postfilter: |-
                  # global_sieve_after script
                  require "fileinto";

                  if header :contains "X-Spam-Flag" "YES" {
                    fileinto "Junk";
                  }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/global_filters/{filter_type}:
    get:
      summary: Get one global Sieve filter
      description: >-
        Returns the global Sieve prefilter or postfilter as a JSON string.
        Admins only (an API key may); other callers and an empty script get
        `{}`.
      operationId: getGlobalFilter
      tags:
        - Global filters
      parameters:
        - name: filter_type
          in: path
          required: true
          description: Which global filter
          schema:
            type: string
            enum:
              - prefilter
              - postfilter
          example: prefilter
      responses:
        "200":
          description: The Sieve script
          content:
            application/json:
              schema:
                type: string
              example: |
                # global_sieve_before script
                # global_sieve_before -> user sieve_before (mailcow UI) -> user sieve_after (mailcow UI) -> global_sieve_after
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/quota_notification:
    post:
      summary: Edit quota notification settings
      description: >-
        Saves sender, subject and template of the mails users get when their
        mailbox crosses 80 % and 95 % of its quota (admins only, an API key
        may). `items` is ignored. Every call writes all three values: one that
        is not sent becomes empty. The current values cannot be read through
        the API.


        Messages: `saved_settings`; `redis_error` (danger); `access_denied`
        for non-admins.
      operationId: editQuotaNotification
      tags:
        - Quota notifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Ignored
                attr:
                  type: object
                  properties:
                    sender:
                      type: string
                      description: Sender address (control characters and non-ASCII bytes are removed; an invalid address becomes empty)
                    subject:
                      type: string
                      description: Subject
                    html_tmpl:
                      type: string
                      description: HTML template (empty = the default template)
              required:
                - attr
            example:
              items:
                - quota_notification
              attr:
                sender: quota-warning@example.org
                subject: Quota warning
                html_tmpl: ""
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/quota_notification_bcc:
    post:
      summary: Edit quota notification BCC of a domain
      description: >-
        Sets the addresses that get a copy of every quota warning of a domain
        (the subject gets the username appended). Admins and domain admins of
        the domain (an API key may; the domain or alias domain must exist).
        `items` is ignored. The list replaces the old one; the current list
        cannot be read through the API.


        Messages: `saved_settings`; `goto_invalid` (danger) for an invalid
        address, which is left out while the others are saved; `redis_error`
        (danger); `access_denied` for an unknown or foreign domain.
      operationId: editQuotaNotificationBcc
      tags:
        - Quota notifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Ignored
                attr:
                  type: object
                  properties:
                    domain:
                      type: string
                      description: Domain or alias domain
                    bcc_rcpt:
                      type: string
                      description: Addresses, separated by space, comma, semicolon or newline
                    active:
                      type: [boolean, integer, string]
                      description: 1 = send the copies; becomes 0 when no valid address is left
                  required:
                    - domain
              required:
                - attr
            example:
              items:
                - quota_bcc
              attr:
                domain: example.org
                bcc_rcpt: |-
                  postmaster@example.org
                  helpdesk@example.org
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/admin/all:
    get:
      summary: Get administrators
      description: >-
        Lists all administrators with their details. Domain administrators are
        not part of this list (see `get/domain-admin/all`). The API key itself
        (account `API`) is no administrator account and is not listed.
      operationId: getAdmins
      tags:
        - Administrators
      responses:
        "200":
          description: The administrators, `{}` if there are none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Admin"
              example:
                - username: admin
                  tfa_active: 1
                  tfa_active_int: 1
                  active: 1
                  active_int: 1
                  created: "2026-09-21 10:23:08"
                  attributes:
                    force_tfa: "0"
                    force_pw_update: "0"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/admin/{username}:
    get:
      summary: Get administrator
      description: Details of one administrator.
      operationId: getAdmin
      tags:
        - Administrators
      parameters:
        - name: username
          in: path
          required: true
          description: Username of the administrator
          schema:
            type: string
          example: admin
      responses:
        "200":
          description: The administrator, `{}` if there is no administrator of this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
              example:
                username: admin
                tfa_active: 0
                tfa_active_int: 0
                active: 1
                active_int: 1
                created: "2026-09-21 10:23:08"
                attributes:
                  force_tfa: "0"
                  force_pw_update: "0"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/add/admin:
    post:
      summary: Create administrator
      description: >-
        Creates an administrator account with full access to mailcow.
        The username is converted to lowercase; it may only contain letters,
        digits, `_`, `.` and `-` and must not be used by another administrator
        or domain administrator. The password must match `password2` and the
        password policy.


        Success: `admin_added`. Errors: `username_invalid`, `object_exists`,
        `password_complexity`, `password_mismatch`.
      operationId: addAdmin
      tags:
        - Administrators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username (letters, digits, `_`, `.`, `-`; stored in lowercase)
                password:
                  type: string
                  description: Password, must match the password policy
                password2:
                  type: string
                  description: The password again
                active:
                  type: [integer, string, boolean]
                  description: >-
                    1 = the account can log in, 0 = disabled. Missing counts as
                    0: send `1` for a usable account.
                  default: 0
              required:
                - username
                - password
                - password2
            example:
              username: admin2
              password: "Rand0m-Passw0rd!"
              password2: "Rand0m-Passw0rd!"
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/admin:
    post:
      summary: Edit administrators
      description: >-
        Changes administrator accounts. Attributes that are not sent keep their
        value, except `force_tfa` and `force_pw_update`, which are set to 0 when
        they are missing. The password is only changed when `password` is not
        empty. Renaming an account moves its two-factor authentication and the
        sync job sources it created to the new name (FIDO2 keys stay with the
        old name).


        One message per account. Success: `admin_modified`. Errors:
        `access_denied` (no administrator of this name), `username_invalid`
        (invalid `username_new` or the name of another administrator), warning
        `no_active_admin` (the last active administrator cannot be
        deactivated). A password that does not match `password2` or the policy
        (`password_mismatch`, `password_complexity`) stops the call.
      operationId: editAdmin
      tags:
        - Administrators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Username of the administrator, or a list of usernames
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    active:
                      type: [integer, string, boolean]
                      description: 1 = active, 0 = disabled
                    username_new:
                      type: string
                      description: New username (letters, digits, `_`, `.`, `-`)
                    password:
                      type: string
                      description: New password; empty or missing keeps the password
                    password2:
                      type: string
                      description: The new password again
                    force_tfa:
                      type: [integer, string, boolean]
                      description: 1 = the administrator must set up two-factor authentication at the next login
                      default: 0
                    force_pw_update:
                      type: [integer, string, boolean]
                      description: 1 = the administrator must change the password at the next login
                      default: 0
                    disable_tfa:
                      type: [integer, string, boolean]
                      description: >-
                        Present (with any value) = deactivate the two-factor
                        authentication of the account
              required:
                - items
                - attr
            example:
              items:
                - admin2
              attr:
                active: 1
                password: "N3w-Passw0rd!"
                password2: "N3w-Passw0rd!"
                force_pw_update: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/admin:
    post:
      summary: Delete administrators
      description: >-
        Deletes administrator accounts with their two-factor authentication
        and FIDO2 keys; sync job sources they created are released.


        One message per account. Success: `admin_removed`. Errors:
        `username_invalid` (no administrator of this name), warning
        `cannot_delete_self` (the account of the current login, never the case
        for an API key).
      operationId: deleteAdmin
      tags:
        - Administrators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Usernames of the administrators
              items:
                type: string
            example:
              - admin2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/passwordpolicy:
    get:
      summary: Get password policy
      description: >-
        The password policy for mailboxes, administrators and domain
        administrators. Any further path segment except `html` gives the same
        answer.
      operationId: getPasswordPolicy
      tags:
        - Password policy
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordPolicy"
              example:
                length: "8"
                chars: "1"
                special_chars: "0"
                lowerupper: "1"
                numbers: "1"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/passwordpolicy/html:
    get:
      summary: Get password policy as HTML
      description: >-
        The password policy as an HTML snippet in the default language, as the
        mailcow UI shows it below password fields.
      operationId: getPasswordPolicyHtml
      tags:
        - Password policy
      responses:
        "200":
          description: The HTML snippet as a JSON string
          content:
            application/json:
              schema:
                type: string
              example: <p class="help-block small">- Minimum password length is 8<br>- Must contain at least one alphabetic character<br>- Must contain lowercase and uppercase characters<br>- Must contain at least one number</p>
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/passwordpolicy:
    post:
      summary: Edit password policy
      description: >-
        Changes the password policy; attributes that are not sent keep their
        value. The policy is checked when a password is set, existing passwords
        are not affected. `items` is not used.


        Success: `password_policy_saved`.
      operationId: editPasswordPolicy
      tags:
        - Password policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    length:
                      type: [integer, string]
                      description: Minimum length; values below 3 keep the current length
                    chars:
                      type: [integer, string, boolean]
                      description: 1 = at least one letter
                    lowerupper:
                      type: [integer, string, boolean]
                      description: 1 = lowercase and uppercase letters
                    special_chars:
                      type: [integer, string, boolean]
                      description: 1 = at least one character that is no letter or digit
                    numbers:
                      type: [integer, string, boolean]
                      description: 1 = at least one digit
              required:
                - attr
            example:
              attr:
                length: 12
                chars: 1
                lowerupper: 1
                special_chars: 0
                numbers: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/reset-password-notification:
    post:
      summary: Edit password reset e-mail
      description: >-
        Sets sender, subject and templates of the e-mail a mailbox user gets
        to reset a forgotten password (sent to the recovery address of the
        mailbox). All four values are replaced: a missing value is saved as
        empty; without both templates the default templates are used.
        Password reset is only offered while sender and subject are set.
        Subject and templates may use the placeholders `{{username}}`,
        `{{username2}}` (recovery address), `{{date}}`, `{{token_lifetime}}`
        (minutes), `{{hostname}}` and `{{link}}`. `items` is not used.


        Success: `saved_settings`.
      operationId: editPasswordResetNotification
      tags:
        - Password policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    from:
                      type: string
                      description: Sender address; an invalid address is saved as empty
                    subject:
                      type: string
                      description: Subject
                    text_tmpl:
                      type: string
                      description: Plain text template
                    html_tmpl:
                      type: string
                      description: HTML template (the text template becomes its alternative part)
              required:
                - attr
            example:
              attr:
                from: noreply@example.org
                subject: Reset your password
                text_tmpl: "Hello {{username}}, open {{link}} within {{token_lifetime}} minutes to set a new password."
                html_tmpl: "<p>Hello {{username}},</p><p><a href=\"{{link}}\">Set a new password</a> within {{token_lifetime}} minutes.</p>"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/app_links:
    post:
      summary: Edit app links
      description: >-
        Replaces the custom links of the "Apps" menu. The links are sent as
        four lists of equal length, one entry per link; if the lengths differ,
        nothing is saved but `app_links` is reported anyway. An empty list
        removes all custom links. The links of mailcow itself (SOGo, ...) are
        set in vars.local.inc.php and are not affected. `items` is not used.


        Success: `app_links`. Error: `demo_mode_enabled`.
      operationId: editAppLinks
      tags:
        - UI customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    app:
                      type: array
                      description: Names of the links
                      items:
                        type: string
                    href:
                      type: array
                      description: URLs shown on the login page and to users without `user_href`
                      items:
                        type: string
                    user_href:
                      type: array
                      description: >-
                        URLs for logged-in accounts, `%u` is replaced with the
                        username; empty = `href`
                      items:
                        type: string
                    hide:
                      type: array
                      description: >-
                        Per link: `"0"` or `0` shows it on the login page, any
                        other value (also `false`) hides it there
                      items:
                        type: [string, integer, boolean]
              required:
                - attr
            example:
              attr:
                app:
                  - Wiki
                  - Webmail (Roundcube)
                href:
                  - https://wiki.example.org
                  - https://mail.example.org/rc/
                user_href:
                  - https://wiki.example.org
                  - https://mail.example.org/rc/?_user=%u
                hide:
                  - "0"
                  - "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/custom_login:
    post:
      summary: Edit login page options
      description: >-
        Sets the options of the login pages. All four options are replaced: a
        missing option counts as 0. `items` is not used.


        Success: `custom_login_modified`. Error: `demo_mode_enabled`.
      operationId: editCustomLogin
      tags:
        - UI customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    hide_user_quicklink:
                      type: [integer, string, boolean]
                      description: 1 = hide the link to the user login page
                      default: 0
                    hide_domainadmin_quicklink:
                      type: [integer, string, boolean]
                      description: 1 = hide the link to the domain administrator login page
                      default: 0
                    hide_admin_quicklink:
                      type: [integer, string, boolean]
                      description: 1 = hide the link to the administrator login page
                      default: 0
                    force_sso:
                      type: [integer, string, boolean]
                      description: >-
                        1 = with an OIDC identity provider configured, show only
                        the Single Sign-On button instead of the mailcow login
                        form
                      default: 0
              required:
                - attr
            example:
              attr:
                hide_user_quicklink: 0
                hide_domainadmin_quicklink: 1
                hide_admin_quicklink: 1
                force_sso: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/ip_check:
    post:
      summary: Edit IP check
      description: >-
        Opt-in for the IP check of the dashboard, which asks the third party
        services ipv4.mailcow.email and ipv6.mailcow.email for the public
        addresses of the server. `items` is not used.


        Success: `ip_check_opt_in_modified`. Error: `demo_mode_enabled`.
      operationId: editIpCheck
      tags:
        - UI customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    ip_check_opt_in:
                      type: [integer, string, boolean]
                      description: 1/true = enabled; anything else or missing = disabled
                      default: 0
              required:
                - attr
            example:
              attr:
                ip_check_opt_in: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/ui_texts:
    post:
      summary: Edit UI texts
      description: >-
        Sets the texts of the mailcow UI. All values are replaced: a missing
        value is saved as empty, which means the default for the three names.
        `items` is not used.


        Success: `ui_texts`. Error: `demo_mode_enabled`.
      operationId: editUiTexts
      tags:
        - UI customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    title_name:
                      type: string
                      description: Title of the browser window (plain text); empty = "<hostname> - mail UI"
                    main_name:
                      type: string
                      description: Name shown on the start page (plain text); empty = "<hostname> - mail UI"
                    apps_name:
                      type: string
                      description: Name of the "Apps" menu (plain text); empty = "Apps"
                    help_text:
                      type: string
                      description: Help text below the login form (HTML)
                    ui_footer:
                      type: string
                      description: Footer of every page (HTML)
                    ui_announcement_text:
                      type: string
                      description: Announcement for all logged-in accounts and on the login page (HTML)
                    ui_announcement_type:
                      type: string
                      enum:
                        - info
                        - warning
                        - danger
                      description: Style of the announcement; other values are saved as empty
                    ui_announcement_active:
                      type: [integer, string, boolean]
                      description: Not empty and not 0 = show the announcement
                      default: 0
              required:
                - attr
            example:
              attr:
                title_name: Example Mail
                main_name: Example Mail
                apps_name: Apps
                help_text: "Questions? Write to <a href=\"mailto:support@example.org\">support@example.org</a>."
                ui_footer: "<a href=\"https://example.org/imprint\">Imprint</a>"
                ui_announcement_text: Maintenance on Saturday from 8 to 10 am.
                ui_announcement_type: warning
                ui_announcement_active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/ui_theme:
    post:
      summary: Edit UI theme
      description: >-
        Selects the theme of the mailcow UI. Themes are folders
        `data/web/css/themes/<name>/` with a `theme.css`. `items` is not used.


        Success: `ui_theme_modified`. Errors: `ui_theme_invalid` (no theme of
        this name), `demo_mode_enabled`.
      operationId: editUiTheme
      tags:
        - UI customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attr:
                  type: object
                  properties:
                    ui_theme:
                      description: >-
                        Folder name of the theme; empty or missing = the default
                        theme. A list counts with its first entry.
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
              required:
                - attr
            example:
              attr:
                ui_theme: servercow
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
tags:
  - name: Domains
    description: >-
      Domains, alias domains, domain templates, MTA-STS policies and
      domain-wide footers
  - name: Domain antispam policies
    description: Sender allow lists (whitelists) and deny lists (blacklists) of domains
  - name: Mailboxes
    description: Mailboxes, their templates, tags, ACLs and logins
  - name: Aliases
    description: You can manage aliases
  - name: Sync jobs
    description: Using Syncjobs you can sync your mails with other email servers
  - name: Logs
    description: Logs of the mailcow containers and the UI
  - name: Queue Manager
    description: Manage the postfix mail queue
  - name: Quarantine
    description: Check what emails went to quarantine
  - name: Fail2Ban
    description: Manage the Netfilter fail2ban options
  - name: DKIM
    description: Generate, import, copy and delete DKIM keys
  - name: Domain admin
    description: Domain administrators, their domains and ACLs
  - name: Single Sign-On
    description: Login tokens for domain administrators
  - name: Address Rewriting
    description: BCC maps and recipient maps
  - name: Outgoing TLS Policy Map Overrides
    description: TLS policies for outgoing connections to single destinations
  - name: oAuth Clients
    description: Clients that use mailcow as OAuth2 server
  - name: API Keys
    description: API keys; service keys from mailcow.conf are read-only
  - name: Groups
    description: Mailbox groups (distribution lists, send-as rights, templates)
  - name: Routing
    description: Sender-dependent transports (relay hosts) and transport maps for outgoing mail
  - name: Resources
    description: Bookable resources (rooms, equipment, groups) for SOGo
  - name: App Passwords
    description: Separate passwords of a mailbox for single clients and protocols
  - name: Status
    description: Containers, mail storage, host and version
  - name: Ratelimits
    description: Edit domain ratelimits
  - name: Cross-Origin Resource Sharing (CORS)
    description: Origins and methods that may call the API from a browser
  - name: Identity Provider
    description: >-
      External Identity Provider (Keycloak, OpenID Connect, LDAP): settings,
      identity sync and links of mailboxes
  - name: Mailbox user settings
    description: >-
      Settings a mailbox user changes on its own page (with the matching user
      ACL): time-limited aliases, spam score, TLS policy, tagged mail,
      Pushover. API keys can change them for any mailbox and must name the
      mailbox; a mailbox user only for its own.
  - name: Mailbox filters
    description: Sieve filters of mailboxes, managed by admins and domain admins
  - name: Mailbox antispam policies
    description: Sender allow and deny lists of mailboxes
  - name: Forwarding Hosts
    description: >-
      Hosts whose incoming mail is accepted unconditionally, e.g. servers that
      forward mail to mailcow
  - name: Rspamd
    description: Rspamd settings rules, global regex maps, presets and statistics
  - name: Global filters
    description: Global Sieve filters that run before and after the filters of the mailboxes, Sieve presets
  - name: Quota notifications
    description: Mails to users whose mailbox is nearly full
  - name: Administrators
    description: Administrator accounts
  - name: Password policy
    description: Password rules and the password reset e-mail
  - name: UI customization
    description: Texts, links, login page and theme of the mailcow UI
