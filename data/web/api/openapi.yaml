                - in_primary_domain: ""
                  id: 12
                  domain: example.org
                  public_comment: Sales team
                  private_comment: null
                  goto: anna@example.org,ben@example.org
                  address: sales@example.org
                  is_catch_all: 0
                  internal: 0
                  active: 1
                  active_int: 1
                  sogo_visible: 1
                  sogo_visible_int: 1
                  sender_allowed: 1
                  group_id: null
                  group_name: null
                  created: "2026-10-26 14:43:58"
                  modified: "2026-11-08 20:38:01"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/time_limited_aliases/{mailbox}:
    get:
      tags:
        - Mailbox user settings
      summary: Get the time-limited aliases of a mailbox
      operationId: getTimeLimitedAliases
      description: >-
        The valid or permanent time-limited aliases of the mailbox. `{}` if
        none or no access.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      responses:
        "200":
          description: List of aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeLimitedAlias"
              example:
                - address: kahd.osuwe@example.org
                  goto: john.doe@example.org
                  description: Online shop registration
                  validity: 1795699200
                  created: "2026-11-10 09:00:00"
                  modified: null
                  permanent: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Update time-limited aliases
      operationId: editTimeLimitedAlias
      description: >-
        Sets a new expiry (`validity` hours from now) or makes the aliases
        permanent. Needs the user ACL `spam_alias`. Without `validity` or a
        true `permanent` nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Alias address or list of addresses
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    validity:
                      type: [integer, string]
                      description: Hours from now until the alias expires (not range-checked); ends a permanent state
                    permanent:
                      type: [boolean, integer, string]
                      description: true makes the alias permanent (wins over `validity`)
            example:
              items:
                - kahd.osuwe@example.org
              attr:
                validity: 24
                permanent: 0
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Delete time-limited aliases
      operationId: deleteTimeLimitedAlias
      description: >-
        Deletes time-limited aliases. Needs the user ACL `spam_alias`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Alias addresses
              items:
                type: string
            example:
              - kahd.osuwe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/pushover-test:
    post:
      tags:
        - Mailbox user settings
      summary: Verify the Pushover credentials of mailboxes
      operationId: testPushover
      description: >-
        Checks the stored Pushover credentials of each mailbox with the
        Pushover API; `attr` is not used. Same access as `edit/pushover`.
        Answers "Pushover API OK (200): ..." or "Pushover API ERR (code): ...";
        a mailbox without settings stops the call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  description: Not used
            example:
              items:
                - john.doe@example.org
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/delimiter_action:
    post:
      tags:
        - Mailbox user settings
      summary: Set the handling of tagged mail
      operationId: editDelimiterAction
      description: >-
        Handling of mail to `user+tag@example.org`: move to the subfolder "tag"
        (`subfolder`), add "[tag]" to the subject (`subject`) or nothing
        (`none`, also for other values). Needs the user ACL `delimiter_action`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    tagged_mail_handler:
                      type: string
                      enum:
                        - subfolder
                        - subject
                        - none
            example:
              items:
                - john.doe@example.org
              attr:
                tagged_mail_handler: subfolder
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/tls_policy:
    post:
      tags:
        - Mailbox user settings
      summary: Set the TLS policy of mailboxes
      operationId: editTlsPolicy
      description: >-
        Enforces TLS for incoming and/or outgoing mail; fields not sent keep
        their value. Needs the user ACL `tls_policy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    tls_enforce_in:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 accepts incoming mail only over TLS
                    tls_enforce_out:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 sends outgoing mail only over TLS
            example:
              items:
                - john.doe@example.org
              attr:
                tls_enforce_in: 1
                tls_enforce_out: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/spam-score:
    get:
      tags:
        - Mailbox user settings
      summary: Get the default spam score
      operationId: getDefaultSpamScore
      description: >-
