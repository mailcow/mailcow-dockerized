      parameters:
        - name: qid
          in: path
          required: true
          description: Postfix queue ID
          schema:
            type: string
          example: B98C6260CA1
      responses:
        "200":
          description: The postcat output as plain text (despite the JSON content type)
          content:
            application/json:
              schema:
                type: string
              example: |
                *** ENVELOPE RECORDS deferred/B/B98C6260CA1 ***
                message_size:            1848             612               1               0            1848               0
                message_arrival_time: Mon Nov 10 09:47:14 2026
                create_time: Mon Nov 10 09:47:14 2026
                named_attribute: rewrite_context=local
                sender: sender@example.org
                *** MESSAGE CONTENTS deferred/B/B98C6260CA1 ***
                From: Sender <sender@example.org>
                To: rcpt@example.com
                Subject: Test

                Hello
                *** HEADER EXTRACTED deferred/B/B98C6260CA1 ***
                original_recipient: rcpt@example.com
                recipient: rcpt@example.com
                *** MESSAGE FILE END deferred/B/B98C6260CA1 ***
        "401":
          $ref: "#/components/responses/Unauthorized"
