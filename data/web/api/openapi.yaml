          schema:
            type: string
          example: alice@example.org
      responses:
        "200":
          description: The sync jobs of the mailbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjobs/{mailbox}/no_log:
    get:
      summary: Get sync jobs of a mailbox without logs
      description: >-
        Like `GET /api/v1/get/syncjobs/{mailbox}`, with an empty `log`. The
        last segment is a comma-separated option list, only `no_log` has a
        meaning.
      operationId: getMailboxSyncJobsWithoutLog
      tags:
        - Sync jobs
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Local mailbox (`user2` of the jobs)
          schema:
            type: string
          example: alice@example.org
      responses:
        "200":
          description: The sync jobs of the mailbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjob_source/all:
    get:
      summary: Get sync sources
      description: >-
        The sync sources the caller may see, ordered by name: admins (every API
        key) all; domain admins their own, `all` sources, sources for their
        domains or mailboxes and sources created by their mailboxes; users
        their own, `all` sources and sources for them or their domain. Secrets
        are never returned (`has_client_secret`, `has_access_token`), extra
        OAuth2 parameters only to callers who may edit the source (`can_edit`,
        false for read-only API keys). Answers `{}` when there is no source.
      operationId: getSyncJobSources
      tags:
        - Sync jobs
      responses:
        "200":
          description: The sync sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncJobSource"
              example:
                - id: 3
                  name: Old provider
                  description: Migration from the old provider
                  created_by: API
                  scope: domain
                  host1: imap.example.com
                  port1: 993
                  enc1: SSL
                  verify_cert: 1
                  auth_type: PLAIN
                  oauth_flow: client_credentials
                  oauth_token_endpoint: null
                  oauth_authorize_endpoint: null
                  oauth_userinfo_endpoint: null
                  oauth_client_id: null
                  oauth_scope: null
                  oauth_extra_params: null
                  oauth_token_expires: null
