name: Build mailcow Docker Images

on:
  push:
    branches: [ "master", "staging" ]
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  docker_image_builds:
    strategy:
      matrix:
        images:
          - "acme-mailcow"
          - "clamd-mailcow"
          - "dockerapi-mailcow"
          - "dovecot-mailcow"
          - "netfilter-mailcow"
          - "olefy-mailcow"
          - "php-fpm-mailcow"
          - "postfix-mailcow"
          - "rspamd-mailcow"
          - "sogo-mailcow"
          - "unbound-mailcow"
          - "watchdog-mailcow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Docker
        run: |
          curl -sSL https://get.docker.com/ | CHANNEL=stable sudo sh
          sudo service docker start
      - name: Prepair Image Builds
        run: |
          cp helper-scripts/docker-compose.override.yml.d/BUILD_FLAGS/docker-compose.override.yml docker-compose.override.yml
      - name: Build Docker Images
        run: |
          docker compose build "${image}"
        env:
          image: ${{ matrix.images }}
      - name: Check PHP-FPM image version
        if: matrix.images == 'php-fpm-mailcow'
        run: |
          image=$(docker compose config --format json | jq -r '.services["php-fpm-mailcow"].image')
          expected=${image##*:}
          expected=${expected%-*}
          docker run --rm --network none --entrypoint php "$image" -r '
            if (PHP_VERSION !== $argv[1]) {
              fwrite(STDERR, "Expected PHP " . $argv[1] . ", got " . PHP_VERSION . PHP_EOL);
              exit(1);
            }
          ' "$expected"
