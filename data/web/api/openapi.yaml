        destination:
          type: string
        nexthop:
          type: string
        username:
          type: string
          description: SMTP user name, empty without authentication
        password:
          type: string
          description: SMTP password in clear text
        active:
          type: integer
          description: 1 = active, 0 = inactive
        password_short:
          type: string
          description: First three characters of the password and `...`
    ForwardingHost:
      type: object
      properties:
