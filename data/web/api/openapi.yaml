            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  required:
                    - rl_frame
                  properties:
                    rl_value:
                      type: [integer, string]
                      description: Number of messages, 0 or empty removes the limit
                    rl_frame:
                      type: string
                      enum:
                        - s
                        - m
                        - h
                        - d
                      description: Per second, minute, hour or day
            example:
              items:
                - john.doe@example.org
              attr:
                rl_value: 100
                rl_frame: h
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/rlhash:
    post:
      tags:
        - Ratelimits
      summary: Reset a rate limit counter
      operationId: deleteRatelimitHash
      description: >-
        Deletes the counter of a rate-limited sender (the `rl_hash` of an entry
        of `get/logs/ratelimited`) and its log lines, so the sender can send
        again. Admins only. The body is a list with one hash (several are
        concatenated into one). Unlike other write routes the answer is not
        JSON: `1` when the hash was deleted, an empty body when it was not
        found, is invalid or the caller is no admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: The hash
              items:
                type: string
                pattern: "^RL[0-9A-Za-z=]+$"
            example:
              - RLkfx5cv4sq1i3ehpkz5bgdhcq9u9gkzj
      responses:
        "200":
          description: "`1` if deleted, else an empty body"
          content:
            application/json:
              schema:
                type: integer
                const: 1
              example: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/status/containers:
    get:
      summary: Get container status
      description: >-
        State, start time and image of every container of the mailcow
        installation, stopped containers included, keyed by service name.
      operationId: getContainerStatus
      tags:
        - Status
      responses:
        "200":
          description: The containers, `null` if dockerapi cannot be reached
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ContainerStatus"
              example:
                dovecot-mailcow:
                  type: info
                  container: dovecot-mailcow
                  state: running
                  started_at: "2026-11-10T11:00:51.541059812Z"
                  image: ghcr.io/mailcow/dovecot:2.3.21.1-4
                postfix-mailcow:
                  type: info
                  container: postfix-mailcow
                  state: running
                  started_at: "2026-11-10T11:00:51.292779901Z"
                  image: ghcr.io/mailcow/postfix:1.80
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/vmail:
    get:
      summary: Get mail storage status
      description: Disk usage of the file system that holds the mail storage (`/var/vmail`).
      operationId: getVmailStatus
      tags:
        - Status
      responses:
        "200":
          description: The disk usage (`df -H` values)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: info
                  disk:
                    type: string
                    description: Device
                  used:
                    type: string
                    description: Used space
                  total:
                    type: string
                    description: Size of the file system
                  used_percent:
                    type: string
                    description: Used space in percent
              example:
                type: info
                disk: /dev/sda1
                used: 65G
                total: 105G
                used_percent: 66%
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/version:
    get:
      summary: Get mailcow version
      description: >-
        The installed mailcow version: the release tag on the master branch,
        else the short commit ID.
      operationId: getVersion
      tags:
        - Status
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: [string, "null"]
                    description: Release tag or commit ID
              example:
                version: "2026-11"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/container/{id}:
    get:
      summary: Get container statistics
      description: >-
        Resource statistics of one container: the last (up to three) Docker
        stats snapshots, taken about five seconds apart while this route is
        called. The container is named by its full Docker container ID (64 hex
        digits, e.g. from `docker ps --no-trunc`), which the API does not
        list. For an unknown ID the call waits until the dockerapi timeout (60
        seconds) and answers with the curl error text as a JSON string.
      operationId: getContainerStats
      tags:
        - Status
      parameters:
        - name: id
          in: path
          required: true
          description: Full Docker container ID
          schema:
            type: string
          example: 5d0f3cbb2a6e4f6c8e0e1c3b9a7d2f41b6c5e8a9d0f1e2c3b4a5968778695a4b
      responses:
        "200":
          description: >-
            Docker stats objects (see the Docker Engine API, `ContainerStats`),
            oldest first; `false` without ID
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: One Docker stats snapshot
                  properties:
                    read:
                      type: string
                      description: Time of the snapshot
                    name:
                      type: string
                    id:
                      type: string
                    cpu_stats:
                      type: object
                    precpu_stats:
                      type: object
                    memory_stats:
                      type: object
                    blkio_stats:
                      type: object
                    networks:
                      type: object
                    pids_stats:
                      type: object
                  additionalProperties: true
              example:
                - read: "2026-11-10T19:20:01.123456789Z"
                  name: /mailcowdockerized-dovecot-mailcow-1
                  id: 5d0f3cbb2a6e4f6c8e0e1c3b9a7d2f41b6c5e8a9d0f1e2c3b4a5968778695a4b
                  pids_stats:
                    current: 38
                  memory_stats:
                    usage: 104857600
                    limit: 12541669376
                  blkio_stats:
                    io_service_bytes_recursive:
                      - major: 8
                        minor: 0
                        op: read
                        value: 1052672
                      - major: 8
                        minor: 0
                        op: write
                        value: 40960
                  networks:
                    eth0:
                      rx_bytes: 2621440
                      tx_bytes: 1048576
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/host:
    get:
      summary: Get host statistics
      description: CPU, memory, uptime and architecture of the Docker host.
      operationId: getHostStatus
      tags:
        - Status
      responses:
        "200":
          description: The host statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStats"
              example:
                cpu:
                  cores: 4
                  usage: 6
                memory:
                  total: 12541669376
                  usage: 62.5
                  swap:
                    - 1022357504
                    - 512716800
                    - 509640704
                    - 50.2
                    - 1392812032
                    - 3864260608
                uptime: 703800.5492310524
                system_time: "10.11.2026 19:13:07"
                architecture: x86_64
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/status/host/ip:
    get:
      summary: Get public IP addresses
      description: >-
        The public IPv4 and IPv6 address of the server, as seen by the third
        party services ipv4.mailcow.email and ipv6.mailcow.email (requested on
        every call, regardless of the IP check setting of `edit/ip_check`).
        Other path segments after `host` give an empty answer.
      operationId: getHostIps
      tags:
        - Status
      responses:
        "200":
          description: The addresses, `false` for an address that could not be determined
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipv4:
                    type: [string, boolean]
                    description: Public IPv4 address
                  ipv6:
                    type: [string, boolean]
                    description: Public IPv6 address
              example:
                ipv4: 198.51.100.25
                ipv6: 2001:db8::25
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/syncjobs/all/no_log:
    get:
      summary: Get all sync jobs without logs
      description: >-
        Like `GET /api/v1/get/syncjobs/all`, with an empty `log` (the job list
        of the UI). The last segment is a comma-separated option list, only
        `no_log` has a meaning; other values are ignored.
      operationId: getSyncJobsWithoutLog
      tags:
        - Sync jobs
      responses:
        "200":
          description: The sync jobs
          content:
            application/json:
