  /api/v1/edit/oauth2-client:
    post:
      summary: Edit OAuth2 clients
      description: >-
        Per client, `revoke_tokens` deletes its tokens, else `renew_secret`
        sets a new secret, else `redirect_uri` is changed. The first two act
        whenever present, even with value 0.


        Messages: `object_modified`; error `Redirect/Callback URL cannot be
        empty`.
      operationId: editOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID of the client, or a list of IDs
                  oneOf:
                    - type: [integer, string]
                    - type: array
                      items:
                        type: [integer, string]
                attr:
                  type: object
                  properties:
                    redirect_uri:
                      type: string
                      description: New redirect URL; empty or missing keeps the current one
                    revoke_tokens:
                      type: [integer, string, boolean]
                      description: Present = delete the access and refresh tokens of the client
                    renew_secret:
                      type: [integer, string, boolean]
                      description: Present = generate a new client secret
              required:
                - items
                - attr
            example:
              items:
                - 1
              attr:
                redirect_uri: https://app.example.org/oauth/callback2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
