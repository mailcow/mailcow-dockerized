        tfa_active_int:
          type: integer
          enum: [0, 1]
          description: Same as `tfa_active`
        active:
          type: integer
          enum: [0, 1]
          description: 1 = the account can log in
        active_int:
          type: integer
          enum: [0, 1]
          description: Same as `active`
        created:
          type: string
          description: Creation time (`YYYY-MM-DD hh:mm:ss`)
        attributes:
          type: object
          properties:
