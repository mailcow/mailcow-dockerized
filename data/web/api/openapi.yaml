        source:
          type: string
          description: What was added (host name, domain or the address itself)
        keep_spam:
          type: string
          enum:
            - "yes"
            - "no"
          description: "`yes` = the mail of the host is not scanned for spam"
    RspamdSettingAttributes:
      type: object
