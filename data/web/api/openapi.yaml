        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
