          description: Rspamd action
        symbols:
          type: string
          description: Rspamd symbols as JSON text
        fuzzy_hashes:
          type: string
          description: Fuzzy hashes as JSON text
        sender:
          type: string
        rcpt:
          type: string
          description: Mailbox the item belongs to
        msg:
          type: string
          description: The raw message
        domain:
          type: [string, "null"]
        notified:
          type: integer
          description: 1 when the recipient got a notification
        created:
          type: string
          description: Time of quarantining (`YYYY-MM-DD HH:MM:SS`)
        user:
          type: string
