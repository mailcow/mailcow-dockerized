            replaces the list.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        skip_ip_check:
          type: [integer, string, boolean]
          description: 1/true = allow the key from any address
          default: 0
        active:
          type: [integer, string, boolean]
          description: 1/true = active
          default: 1
