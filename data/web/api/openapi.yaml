                      domain: example.org
                      public_comment: Sales team
                      private_comment: null
                      goto: anna@example.org,ben@example.org
                      address: sales@example.org
                      is_catch_all: 0
                      internal: 0
                      active: 1
                      active_int: 1
                      sogo_visible: 1
                      sogo_visible_int: 1
                      sender_allowed: 1
                      group_id: null
                      group_name: null
