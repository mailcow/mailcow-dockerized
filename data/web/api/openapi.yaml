    UiLogs:
      description: The log entries, `{}` if there are none
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/UiLogEntry"
          example:
            - id: 1819
              task: 97D254
              type: success
              msg: "[\"domain_admin_modified\",\"domainadmin1\"]"
              call: "[\"domain_admin\",\"edit\",{\"username\":[\"domainadmin1\"],\"active\":\"1\"}]"
              user: API
              role: admin
              remote: 192.0.2.10
              time: 1794319670
    WatchdogLogs:
      description: The log entries, `{}` if there are none
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/WatchdogLogEntry"
          example:
            - time: "1794334334"
              service: Dovecot
              lvl: "100"
              hpnow: "12"
              hptotal: "12"
              hpdiff: "0"
  parameters:
    MailboxTagsQuery:
      name: tags
      in: query
      required: false
      description: >-
        Comma-separated tags: only mailboxes with a tag that contains one of
        them (substring match)
      schema:
        type: string
      example: sales,support
  examples:
    MailboxDetails:
      summary: A mailbox
      value:
        username: john.doe@example.org
        active: 1
        active_int: 1
        domain: example.org
        name: John Doe
        local_part: john.doe
        quota: 3221225472
        messages: 1207
        attributes:
          force_pw_update: "0"
