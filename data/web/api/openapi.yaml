                    - example.org
                  users: []
                  can_edit: true
                  host: imap.example.com
                  port: 993
                  enc: SSL
                  has_client_secret: false
                  has_access_token: false
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/tls-policy-map/{id}:
    get:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Get TLS policy maps
      operationId: getTlsPolicyMaps
      description: >-
        `all` lists the TLS policy maps, an ID returns that map. `{}` if there
        is none or the caller is no administrator. The answer for an ID
        carries an additional member `"0": null` (json_api.php appends an
        undefined variable).
      parameters:
        - name: id
          in: path
          required: true
          description: "`all` or the ID of a TLS policy map"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of TLS policy maps (`all`) or one TLS policy map
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/TlsPolicyMap"
                  - $ref: "#/components/schemas/TlsPolicyMap"
              examples:
                all:
                  summary: get/tls-policy-map/all
                  value:
                    - id: 2
                      dest: example.com
                      policy: encrypt
                      parameters: protocols=>=TLSv1.2
                      active: 1
                      created: "2026-11-06 12:00:31"
                      modified: null
                one:
                  summary: get/tls-policy-map/2
                  value:
                    id: 2
                    dest: example.com
                    policy: encrypt
                    parameters: protocols=>=TLSv1.2
                    active: 1
                    created: "2026-11-06 12:00:31"
                    modified: null
                    "0": null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/edit/tls-policy-map:
    post:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Update TLS policy maps
      operationId: editTlsPolicyMap
      description: >-
        Changes the TLS policy maps in `items`; attributes that are left out
        keep their value (`parameters: ""` clears the parameters).
        Administrators and API keys only. Per map: `tls_policy_map_entry_saved`
        or `access_denied` (unknown ID); `tls_policy_map_dest_invalid`,
        `tls_policy_map_parameter_invalid` and an existing destination (answered
        with `recipient_map_entry_exists`) stop the call.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs of the TLS policy maps, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    dest:
                      type: string
                      description: Destination, e.g. `example.org` or `[mail.example.org]:25`
                    policy:
                      type: string
                      enum:
                        - none
                        - may
                        - encrypt
                        - dane
                        - dane-only
                        - fingerprint
                        - verify
                        - secure
                    parameters:
                      type: string
                      description: Empty or space-separated `name=value` attributes
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 2
              attr:
                policy: dane
                parameters: ""
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/transport/{id}:
