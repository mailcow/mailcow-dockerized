        Which quarantined mail the notifications list: rejected mail
        (`reject`), mail sent to the junk folder (`add_header`) or both
        (`all`). Needs the user ACL `quarantine_category`. API keys may change
        any mailbox, a mailbox user only its own. `quarantine_category` must be
