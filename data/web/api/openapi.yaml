  /api/v1/get/quarantine/{id}:
    get:
      summary: Get a quarantined message
      description: >-
        Returns one quarantine item with the raw message and the Rspamd
        symbols. An API key (admin) may read every item; others only items of
        their mailboxes or domains. `[]` for an unknown or non-numeric ID or
        without access.
      operationId: getQuarantineItem
      tags:
