                  type: object
                  properties:
                    recipient_map_old:
                      type: string
                      description: Original recipient, an e-mail address or a domain
                    recipient_map_new:
                      type: string
                      description: New recipient, an e-mail address or a domain
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
              required:
                - items
                - attr
            example:
              items:
                - 1
              attr:
                recipient_map_new: jane.smith@example.org
                active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/relayhost/{id}:
    get:
      tags:
