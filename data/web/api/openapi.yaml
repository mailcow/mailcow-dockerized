    MailboxSearchRequest:
      type: object
      description: DataTables server-side request
      properties:
        draw:
          type: integer
          description: Counter, returned unchanged
        start:
          type: integer
          description: Offset of the first row; without it all rows are returned
        length:
          type: integer
          description: Rows per page, -1 = all
        search:
          type: object
          properties:
            value:
              type: string
              description: Searched in all searchable columns (substring)
        order:
          type: array
          items:
            type: object
            properties:
              column:
                type: integer
                description: Column number (index in `columns`)
              dir:
                type: string
                enum:
                  - asc
                  - desc
        columns:
          type: array
          description: Column n of the table is `columns[n]`
          items:
            type: object
            properties:
              data:
                type: [string, integer]
                description: >-
                  Name of the column in the UI; for a filter by
                  `search.value` of this column only a column number selects
                  the column, other values filter the address
              searchable:
                type: [boolean, string]
                description: true or "true" includes the column in the search
              orderable:
                type: [boolean, string]
                description: true or "true" allows sorting by the column
              search:
                type: object
                properties:
                  value:
                    type: string
                    description: Filter for this column only (substring)
