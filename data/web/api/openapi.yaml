security:
  - ApiKeyAuth: []

paths:
  /api/v1/add/alias:
    post:
      tags:
        - Aliases
      summary: Create aliases
      operationId: addAlias
      description: >-
        Creates an alias for every address in `address`, all with the same
        destinations; domain administrators for their domains. Flags not sent
        are 0: send `active`, `sogo_visible` and `sender_allowed` as 1 to get
        an alias like the UI creates it.


        Messages: `alias_added`; errors `is_alias_or_mailbox`, `goto_invalid`,
        `external_goto_denied`, `max_alias_exceeded`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: >-
                    Alias addresses of mailcow domains or alias domains,
                    separated by spaces, commas, semicolons or line breaks;
                    `@example.org` is a catch-all
                goto:
                  type: string
                  description: >-
                    Destination addresses, separated by spaces, commas,
                    semicolons or line breaks; required unless a `goto_*` flag
                    is 1
                goto_null:
                  type: [boolean, integer, string]
                  description: 1 = discard the mail silently; wins over `goto_spam` and `goto_ham`
                  default: 0
                goto_spam:
                  type: [boolean, integer, string]
                  description: 1 = learn the mail as spam; wins over `goto_ham`
                  default: 0
                goto_ham:
                  type: [boolean, integer, string]
                  description: 1 = learn the mail as ham
                  default: 0
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
                sogo_visible:
                  type: [boolean, integer, string]
                  description: 1 = selectable sender in SOGo (aliases with a local mailbox as destination)
                  default: 0
                internal:
                  type: [boolean, integer, string]
                  description: 1 = only reachable from its own domain and its alias domains
                  default: 0
                sender_allowed:
                  type: [boolean, integer, string]
                  description: 1 = the destination mailboxes may send as this alias
                  default: 0
                public_comment:
                  type: string
                  description: Comment shown to the users
                  maxLength: 160
                private_comment:
                  type: string
                  description: Comment for administrators
                  maxLength: 160
              required:
                - address
            example:
              address: sales@example.org
              goto: anna@example.org,ben@example.org
              active: "1"
              sogo_visible: "1"
              sender_allowed: "1"
              internal: "0"
              public_comment: Sales team
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/time_limited_alias:
    post:
      tags:
        - Mailbox user settings
      summary: Create a time-limited alias
      operationId: addTimeLimitedAlias
      description: >-
        Creates a random alias that delivers to the mailbox until it expires.
        Needs the user ACL `spam_alias`. `domain` must be the domain of the
        mailbox or one of its alias domains.


        Messages: `mailbox_modified`; errors `domain_invalid`,
        `validity_missing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                username:
                  type: string
                  description: Mailbox the alias delivers to (required for API keys)
                domain:
                  type: string
                  description: Domain of the alias
                description:
                  type: string
                  default: ""
                  description: Note for the alias
                validity:
                  type: [integer, string]
                  minimum: 1
                  maximum: 87600
                  default: 8760
                  description: Hours until the alias expires
                permanent:
                  type: [boolean, integer, string]
                  default: false
                  description: true keeps the alias after it expired
            example:
              username: john.doe@example.org
              domain: example.org
              description: Online shop registration
              validity: 720
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/api-key:
    post:
      summary: Create API key
      description: >-
        Creates an API key with a random value; read the value with
        `get/api-key/all`. Without `skip_ip_check`, `allow_from` is required.


        Messages: `api_key_added`; errors `api_key_access_invalid`,
        `api_key_network_invalid`, `ip_list_empty`.
      operationId: addApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiKeyAttributes"
                - required:
                    - access
            example:
              description: provisioning
              access: rw
              allow_from: "192.0.2.10, 2001:db8::/64"
              skip_ip_check: 0
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/app-passwd:
    post:
      tags:
        - App Passwords
      summary: Create an app password
      operationId: addAppPassword
      description: >-
        Adds an app password to a mailbox, valid only for the listed protocols.
        Needs the user ACL `app_passwds`.


        Messages: `app_passwd_added`; errors `password_complexity`,
        `password_mismatch`, `app_name_empty`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_name
                - app_passwd
                - app_passwd2
              properties:
                username:
                  type: string
                  description: Mailbox the app password belongs to (required for API keys)
                app_name:
                  type: string
                  description: Name of the app password
                app_passwd:
                  type: string
                  format: password
                  description: The password, checked against the password policy
                app_passwd2:
                  type: string
                  format: password
                  description: The password again
                protocols:
                  description: Protocols the password is valid for; not listed = not allowed
                  type: array
                  items:
                    type: string
                    enum:
                      - imap_access
                      - smtp_access
                      - pop3_access
                      - sieve_access
                      - dav_access
                      - eas_access
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: 1 active, 0 inactive
            example:
              username: john.doe@example.org
              app_name: Thunderbird
              app_passwd: eiQu4ahz8iePh
              app_passwd2: eiQu4ahz8iePh
              protocols:
                - imap_access
                - smtp_access
                - sieve_access
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/bcc:
    post:
      tags:
        - Address Rewriting
      summary: Create a BCC map
      operationId: addBccMap
      description: >-
        Sends a hidden copy of the mail of a domain or address to `bcc_dest`.
        Domain administrators need the BCC maps ACL. Undeliverable copies are
        not reported to the local destination.


        Messages: `bcc_saved`; errors `bcc_must_be_email`, `bcc_exists`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                local_dest:
                  type: string
                  description: A mailcow domain or the address of a mailbox or alias
                bcc_dest:
                  type: string
                  description: One e-mail address that gets the copies (use an alias for several)
                type:
                  type: string
                  enum:
                    - sender
                    - rcpt
                  description: >-
                    `sender`: copy the mail sent by `local_dest`; `rcpt`: copy
                    the mail sent to it
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - local_dest
                - bcc_dest
                - type
            example:
              local_dest: example.org
              bcc_dest: archive@example.com
              type: rcpt
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/dkim:
    post:
      summary: Generate DKIM keys
      description: >-
        Generates an RSA DKIM key for each domain or alias domain; existing
        keys are kept.


        Messages: `dkim_added`; error `dkim_domain_or_sel_invalid`.
      operationId: addDkimKey
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
                - key_size
              properties:
                domains:
                  type: string
                  description: >-
                    Domain names, separated by spaces, commas, semicolons or
                    line breaks
                dkim_selector:
                  type: string
                  default: dkim
                  description: Selector (letters, digits, `-`, `_`, `.`)
                key_size:
                  type: [integer, string]
                  description: RSA key size in bits
            example:
              domains: example.org, example.net
              dkim_selector: dkim
              key_size: 2048
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/dkim_duplicate:
    post:
      summary: Copy a DKIM key to other domains
      description: >-
        Copies the DKIM key and selector of `from_domain` to the `to_domain`
        domains, replacing their keys. Target names are not checked.


        Messages: `dkim_duplicated`; error `dkim_domain_or_sel_invalid`.
      operationId: duplicateDkimKey
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_domain
                - to_domain
              properties:
                from_domain:
                  type: string
                  description: Domain whose key is copied
                to_domain:
                  description: Domain name or list of domain names that get the key
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            example:
              from_domain: example.org
              to_domain:
                - example.net
                - example.com
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain:
    post:
      summary: Add a domain
      description: >-
        Adds a domain. Quotas are in MiB. Fields not sent come from the domain
        template in `template` (default: `Default`). Also sets the rate limit
        and creates a DKIM key. SOGo sees the new domain only after a restart
        (`restart_sogo`).


        Messages: `domain_added`, `dkim_added`, `rl_saved`; errors
        `domain_invalid`, `domain_exists`, `maxquota_empty`.
      operationId: addDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                  description: Domain name (stored lowercase, IDN as punycode)
                description:
                  type: string
                  description: Description, default the domain name
                template:
                  type: [integer, string]
                  description: ID of the domain template for fields not sent
                aliases:
                  type: [integer, string]
                  description: Max. number of aliases
                mailboxes:
                  type: [integer, string]
                  description: Max. number of mailboxes
                defquota:
                  type: [integer, string]
                  description: Default quota of new mailboxes in MiB, must not be 0
                maxquota:
                  type: [integer, string]
                  description: Max. quota per mailbox in MiB, must not be 0
                quota:
                  type: [integer, string]
                  description: Quota of the whole domain in MiB
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: Domain active
                gal:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: Global address list in SOGo
                backupmx:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: Relay this domain (backup MX)
                relay_all_recipients:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: >-
                    Relay all recipients, not only those with a mailbox; 1 sets
                    `backupmx`
                relay_unknown_only:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  description: >-
                    Relay only recipients without a local mailbox; 1 sets
                    `backupmx` and `relay_all_recipients`
                tags:
                  type: array
                  items:
                    type: string
                  description: >-
                    Tags of the domain, at most 25 (more are dropped with
                    `tag_limit_exceeded`)
                rl_value:
                  type: [integer, string]
                  description: Rate limit, messages per `rl_frame`; empty or 0 = none
                rl_frame:
                  type: string
                  enum: [s, m, h, d]
                  description: Rate limit time frame
                dkim_selector:
                  type: string
                  description: Selector of the DKIM key that is created
                key_size:
                  type: [integer, string]
                  description: RSA size of the new DKIM key in bits; empty or 0 = no key
                restart_sogo:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Restart SOGo afterwards
            example:
              domain: example.org
              description: Example Org
              aliases: 400
              mailboxes: 10
              defquota: 3072
              maxquota: 10240
              quota: 10240
              active: 1
              gal: 1
              backupmx: 0
              relay_all_recipients: 0
              relay_unknown_only: 0
              tags:
                - customer
              rl_value: 100
              rl_frame: h
              dkim_selector: dkim
              key_size: 2048
              restart_sogo: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain-admin:
    post:
      summary: Create domain administrator
      description: >-
        Creates a domain administrator for the given domains with the default
        ACLs. The username is stored in lowercase and must not be in use by a
        mailbox or administrator. Without `active: 1` the account is disabled.
        Unknown domains are skipped; if none exists, nothing is created, but
        `domain_admin_added` is reported anyway.


        Messages: `domain_admin_added`; errors `domain_invalid`,
        `object_exists`, `password_complexity`, `password_mismatch`.
      operationId: addDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username (letters, digits, `_`, `.`, `-`; stored in lowercase)
                password:
                  type: string
                  description: Password, must match the password policy
                password2:
                  type: string
                  description: The password again
                domains:
                  description: Domain or list of domains the account administers
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                active:
                  type: [integer, string, boolean]
                  description: 1 = the account can log in, 0 = disabled
                  default: 0
              required:
                - username
                - password
                - password2
                - domains
            example:
              username: domainadmin1
              password: "Rand0m-Passw0rd!"
              password2: "Rand0m-Passw0rd!"
              domains:
                - example.org
                - example.com
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/sso/domain-admin:
    post:
      summary: Issue domain administrator login token
      description: >-
        Issues a one-time login token for an active domain administrator, valid
        for 30 seconds. Opening `/domainadmin/mailbox?sso_token=<token>` on the
        mailcow host logs in without password or two-factor authentication.


        Messages: error `object_doesnt_exist`.
      operationId: issueDomainAdminSsoToken
      tags:
        - Single Sign-On
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username of the domain administrator
              required:
                - username
            example:
              username: domainadmin1
      responses:
        "200":
          description: The token, or the error messages
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Login token (five groups of six hex digits)
                    required:
                      - token
                  - $ref: "#/components/schemas/Messages"
              example:
                token: 591F6D-5C3DD2-7455CD-DAF1C1-AA4FCC
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/da-acl:
    post:
      summary: Edit domain administrator ACLs
      description: >-
        Grants the ACLs in `da_acl` and revokes all others; an empty or missing
        `da_acl` revokes all.


        Messages: `acl_saved`; error `Cannot determine current ACL`.
      operationId: editDomainAdminAcl
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Username of the domain administrator, or a list of usernames
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    da_acl:
                      description: The ACLs to grant (a single name or a list)
                      oneOf:
                        - $ref: "#/components/schemas/DomainAdminAcl"
                        - type: array
                          items:
                            $ref: "#/components/schemas/DomainAdminAcl"
              required:
                - items
                - attr
            example:
              items:
                - domainadmin1
              attr:
                da_acl:
                  - syncjobs
                  - quarantine
                  - login_as
                  - sogo_access
                  - app_passwds
                  - bcc_maps
                  - filters
                  - ratelimit
                  - spam_policy
                  - protocol_access
                  - smtp_ip_access
                  - mailbox_relayhost
                  - domain_relayhost
                  - alias_external_goto
                  - mailbox_groups
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain-admin:
    post:
      summary: Edit domain administrators
      description: >-
        Changes domain administrators. Fields not sent keep their value, but
        `force_tfa` and `force_pw_update` are reset to 0. `domains` replaces
        the domain list, empty keeps it; an empty `password` keeps the
        password. FIDO2 keys are not moved on rename. A password error ends
        the call after the domains were saved.


        Messages: `domain_admin_modified`; errors `domain_invalid`,
        `username_invalid`, `password_mismatch`, `password_complexity`.
      operationId: editDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Username of the domain administrator, or a list of usernames
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    active:
                      type: [integer, string, boolean]
                      description: 1 = active, 0 = disabled
                    username_new:
                      type: string
                      description: New username (letters, digits, `_`, `.`, `-`)
                    domains:
                      description: The domains the account administers from now on
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                    password:
                      type: string
                      description: New password; empty or missing keeps the password
                    password2:
                      type: string
                      description: The new password again
                    force_tfa:
                      type: [integer, string, boolean]
                      description: 1 = two-factor authentication must be set up at the next login
                      default: 0
                    force_pw_update:
                      type: [integer, string, boolean]
                      description: 1 = the password must be changed at the next login
                      default: 0
                    disable_tfa:
                      type: [integer, string, boolean]
                      description: Present (any value) = turn off two-factor authentication
              required:
                - items
                - attr
            example:
              items:
                - domainadmin1
              attr:
                active: 1
                domains:
                  - example.org
                password: "N3w-Passw0rd!"
                password2: "N3w-Passw0rd!"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/domain-policy:
    post:
      summary: Add a sender to a domain allow or deny list
      description: >-
        Adds a sender to the allow list (`wl`) or deny list (`bl`) of a domain;
        a sender can be on only one list. Needs the ACL `spam_policy`.


        Messages: `domain_modified`; errors `policy_list_from_invalid`,
        `policy_list_from_exists`.
      operationId: addDomainPolicy
      tags:
        - Domain antispam policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - object_list
                - object_from
              properties:
                domain:
                  type: string
                  description: Domain the entry belongs to
                object_list:
                  type: string
                  enum: [wl, bl]
                  description: "`wl` allow list (whitelist), `bl` deny list (blacklist)"
                object_from:
                  type: string
                  description: >-
                    Sender address or pattern with `*` as wildcard; letters,
                    digits and `@ _ . - *`
            example:
              domain: example.org
              object_list: wl
              object_from: "*@partner.example.com"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Add forwarding hosts
      operationId: addForwardingHost
      description: >-
        Adds hosts whose mail is accepted unconditionally: no DNSBL checks, no
        greylisting, no spam rejects. A name becomes one entry per address of
        its SPF record, else its MX hosts, else A/AAAA.


        Messages: `forwarding_host_added`; errors `invalid_host`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: >-
                    IPv4 or IPv6 address, network in CIDR notation, host name
                    or domain name
                filter_spam:
                  type: [boolean, integer, string]
                  description: 1 = scan the mail for spam (junk folder, never rejected); else not
                  default: 0
              required:
                - hostname
            example:
              hostname: relay.example.com
              filter_spam: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Update forwarding hosts
      operationId: editForwardingHost
      description: >-
        Turns the spam filter of forwarding hosts on or off; without
        `keep_spam` it is turned on.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: >-
                    Hosts as get/fwdhost lists them (`host`), a single value or
                    a list
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    keep_spam:
                      type: [boolean, integer, string]
                      description: 1 = do not scan the mail for spam; else scan it
              required:
                - items
                - attr
            example:
              items:
                - 192.0.2.25
                - "2001:db8::25"
              attr:
                keep_spam: "0"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Create a mailbox
      operationId: addMailbox
      description: >-
        Creates a mailbox, also for domain admins. Quotas are in MiB. Fields
        not sent come from the mailbox template in `template` (default:
        `Default`). Quota 0 (unlimited) needs the `unlimited_quota` ACL.


        Messages: `mailbox_added`; errors `object_exists`, `domain_not_found`,
        `password_complexity`, `max_mailbox_exceeded`,
        `mailbox_quota_exceeded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxAdd"
            example:
              local_part: john.doe
              domain: example.org
              name: John Doe
              password: Moo2Shoh5aiXu
              password2: Moo2Shoh5aiXu
              quota: 3072
              active: 1
              force_pw_update: 1
              tags:
                - sales
              acl:
                - spam_alias
                - spam_score
                - delimiter_action
                - app_passwds
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/mailbox-group:
    post:
      summary: Create mailbox group
      description: >-
        Creates a mailbox group. With an address it is also a distribution list
        to its members; the address counts against the alias limit of the
        domain. Domain admins need the `mailbox_groups` ACL. Follow-up steps
        that fail answer a warning and are retried later.


        Messages: `group_added`; warnings `group_template_failed`,
        `group_imap_grant_failed`; errors `object_exists`,
        `group_address_invalid`, `max_alias_exceeded`, `group_member_invalid`.
      operationId: addMailboxGroup
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - domain
                    - name
                  properties:
                    domain:
                      type: string
                      description: Domain of the group (no alias domain), case-insensitive
                - $ref: "#/components/schemas/MailboxGroupAttributes"
            example:
              domain: example.org
              name: Sales
              description: Sales team
              local_part: sales
              members:
                - alice@example.org
                - bob@example.org
              send_as:
                - orders@example.org
              sender_allowed: 1
              imap_grants:
                - owner: shared@example.org
                  rights: write
                  subscribe: 1
              template_id: 3
              priority: 10
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/oauth2-client:
    post:
      summary: Create OAuth2 client
      description: >-
        Creates an OAuth2 client with random ID and secret; read them with
        `get/oauth2-client/all`. The redirect URI is not validated.


        Messages: `Added client access`.
      operationId: addOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: Redirect (callback) URL of the client application
              required:
                - redirect_uri
            example:
              redirect_uri: https://app.example.org/oauth/callback
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/recipient_map:
    post:
      tags:
        - Address Rewriting
      summary: Create a recipient map
      operationId: addRecipientMap
      description: >-
        Rewrites the recipient before delivery: mail to `recipient_map_old`
        goes to `recipient_map_new`.


        Messages: `recipient_map_entry_saved`; errors
        `invalid_recipient_map_old`, `invalid_recipient_map_new`,
        `recipient_map_entry_exists`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_map_old:
                  type: string
                  description: Original recipient, an e-mail address or a domain (leading `@` optional)
                recipient_map_new:
                  type: string
                  description: New recipient, an e-mail address or a domain
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - recipient_map_old
                - recipient_map_new
            example:
              recipient_map_old: jane.doe@example.org
              recipient_map_new: jane.smith@example.org
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/relayhost:
    post:
      tags:
        - Routing
      summary: Create a sender-dependent transport
      operationId: addRelayhost
      description: >-
        Adds an active relay host, used by domains and mailboxes whose
        `relayhost` is set to its ID. Always `smtp:` (TLS when offered, no
        SMTPS). Colons in `username` and `password` are stored escaped, but
        not by edit/relayhost.


        Messages: `relayhost_added`; errors `invalid_host`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  description: "Next hop: `host`, `host:25`, `[host]:587` or `[192.0.2.1]:25`"
                username:
                  type: string
                  description: SMTP user name, empty for no authentication
                  default: ""
                password:
                  type: string
                  description: SMTP password
                  default: ""
              required:
                - hostname
            example:
              hostname: "[smtp.example.com]:587"
              username: relay-user@example.com
              password: Secret-Passphrase-42
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/resource:
    post:
      tags:
        - Resources
      summary: Create a resource
      operationId: addResource
      description: >-
        Creates a bookable SOGo resource, also for domain admins. Its address
        is made of the letters and digits of `description` (`Meeting Room 1` →
        `MeetingRoom1@example.org`).


        Messages: `resource_added`; errors `resource_invalid`,
        `description_invalid`, `object_exists`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
                - description
                - kind
              properties:
                domain:
                  type: string
                  description: Domain of the resource
                description:
                  type: string
                  description: Name of the resource, also the source of its address
                kind:
                  type: string
                  enum:
                    - location
                    - group
                    - thing
                  description: Type of resource
                multiple_bookings:
                  type: [integer, string]
                  default: 0
                  description: >-
                    0 always free, -1 unlimited but busy when booked, n ≥ 1 at
                    most n overlapping bookings; below -1 means -1
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: 1 active, 0 inactive
            example:
              domain: example.org
              description: Meeting Room 1
              kind: location
              multiple_bookings: 0
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/syncjob:
    post:
      summary: Create sync job
      description: >-
        Creates a sync job that copies the remote account `user1` into a local
        mailbox; server and authentication come from the sync source. Needs the
        `syncjobs` ACL; API keys must set `username`, users always sync into
        their own mailbox. An invalid `mins_interval` or `exclude` answers
        `access_denied`.


        Messages: `mailbox_modified`; errors `no_user_defined`,
        `imapsync_source_unavailable`, `imapsync_source_oauth_connect_required`,
        `object_exists`, `imapsync_custom_param_invalid`.
      operationId: addSyncJob
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - username
                    - source_id
                    - user1
                    - mins_interval
                  properties:
                    username:
                      type: string
                      description: >-
                        Local mailbox to sync into (`user2`), cannot be changed
                        later; users may leave it out
                - $ref: "#/components/schemas/SyncJobAttributes"
            example:
              username: alice@example.org
              source_id: 3
              user1: alice@old-provider.example.com
              password1: remote-password
              mins_interval: 20
              subfolder2: Imported
              exclude: "(?i)spam|(?i)junk"
              custom_params:
                - o: folder
                  v: INBOX
              delete2duplicates: 1
              automap: 1
              subscribeall: 1
              active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/syncjob_source:
    post:
      summary: Create sync source
      description: >-
        Creates a reusable IMAP server with its authentication that sync jobs
        use by `source_id`. Needs the `syncjobs` ACL. Unless an admin creates
        it, OAuth2 endpoints must resolve to public addresses. A
        client_credentials source fetches its token on save and is saved even
        when that fails.


        Messages: `imapsync_source_added`, `imapsync_source_token_refresh_failed`;
        errors `imapsync_source_host_invalid`, `imapsync_source_auth_invalid`,
        `imapsync_source_oauth_invalid`, `imapsync_source_oauth_endpoint_invalid`,
        `object_exists`.
      operationId: addSyncJobSource
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - name
                    - host
                    - port
                - $ref: "#/components/schemas/SyncJobSourceAttributes"
            examples:
              password:
                summary: Password source for a domain
                value:
                  name: Old provider
                  description: Migration from the old provider
                  host: imap.example.com
                  port: 993
                  enc: SSL
                  auth_type: PLAIN
                  scope: domain
                  domains:
                    - example.org
                  active: 1
              client_credentials:
                summary: XOAUTH2 source with an app token (Microsoft 365)
                value:
                  name: M365 tenant
                  host: outlook.office365.com
                  port: 993
                  enc: SSL
                  auth_type: XOAUTH2
                  oauth_flow: client_credentials
                  oauth_token_endpoint: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token
                  oauth_client_id: 11111111-2222-3333-4444-555555555555
                  oauth_client_secret: client-secret-value
                  oauth_scope: https://outlook.office365.com/.default
                  active: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/tls-policy-map:
    post:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Create a TLS policy map
      operationId: addTlsPolicyMap
      description: >-
        Sets the TLS policy for outgoing connections to a destination.


        Messages: `tls_policy_map_entry_saved`; errors
        `tls_policy_map_dest_invalid`, `tls_policy_map_parameter_invalid`,
        `tls_policy_map_entry_exists`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dest:
                  type: string
                  description: >-
                    Destination: a domain, `.example.org` for its subdomains or
                    a host like `[mail.example.org]:25`
                policy:
                  type: string
                  description: >-
                    Postfix TLS security level (see
                    [smtp_tls_policy_maps](https://www.postfix.org/TLS_README.html#client_tls_policy))
                  enum:
                    - none
                    - may
                    - encrypt
                    - dane
                    - dane-only
                    - fingerprint
                    - verify
                    - secure
                parameters:
                  type: string
                  description: Space-separated `name=value` attributes, may be empty
                  default: ""
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - dest
                - policy
            example:
              dest: example.com
              policy: encrypt
              parameters: protocols=>=TLSv1.2
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/add/transport:
    post:
      tags:
        - Routing
      summary: Create transport maps
      operationId: addTransport
      description: >-
        Routes mail for each destination over a next hop; overrules
        sender-dependent transports. Always `smtp:` (TLS when offered, no
        SMTPS); addresses ending in `localhost` stay local. `username` and
        `password` apply to all entries of the next hop.


        Messages: `relayhost_added`; errors `transport_dest_exists`,
        `invalid_destination`, `next_hop_interferes`,
        `invalid_nexthop_authenticated`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                  description: >-
                    Domains, `.example.org` for subdomains, `*` or addresses,
                    separated by spaces, commas, semicolons or line breaks;
                    with `is_mx_based` a regular expression for the MX name of
                    the recipient domain
                nexthop:
                  type: string
                  description: "`host`, `host:25`, `[host]:25` or an IP address (bracketed automatically)"
                username:
                  type: string
                  description: SMTP user name, empty for no authentication
                  default: ""
                password:
                  type: string
                  description: SMTP password
                  default: ""
                is_mx_based:
                  type: [boolean, integer, string]
                  description: 1 = `destination` is a regular expression for MX names
                  default: 0
                active:
                  type: [boolean, integer, string]
                  description: 1 = active, 0 = inactive
                  default: 0
              required:
                - destination
                - nexthop
            example:
              destination: example.com, .example.com
              nexthop: "[mx.example.com]:25"
              username: ""
              password: ""
              is_mx_based: "0"
              active: "1"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/alias:
    post:
      tags:
        - Aliases
      summary: Delete aliases
      operationId: deleteAlias
      description: >-
        Deletes the aliases and the send-as rights granted for their addresses.
        Distribution addresses of mailbox groups cannot be deleted here.


        Messages: `alias_removed`; errors `alias_group_managed`.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs or addresses of the aliases (a single value works too)
              items:
                type: [integer, string]
            example:
              - 12
              - info@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/api-key:
    post:
      summary: Delete API keys
      description: >-
        Deletes API keys. Service keys from mailcow.conf cannot be deleted.


        Messages: `api_key_deleted`; error `api_key_service_locked`.
      operationId: deleteApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: IDs of the API keys
              items:
                type: [integer, string]
            example:
              - 3
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/app-passwd:
    post:
      tags:
        - App Passwords
      summary: Delete app passwords
      operationId: deleteAppPassword
      description: >-
        Deletes app passwords by ID. Needs the user ACL `app_passwds`. The
        first unknown or foreign ID stops the call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: App password IDs
              items:
                type: integer
            example:
              - 23
              - 24
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/bcc:
    post:
      tags:
        - Address Rewriting
      summary: Delete BCC maps
      operationId: deleteBccMap
      description: >-
        Deletes BCC maps by ID. Same callers as add/bcc. A non-numeric ID stops
        the call.


        Messages: `bcc_deleted`.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the BCC maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 3
              - 4
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/dkim:
    post:
      summary: Delete DKIM keys
      description: >-
        Deletes the DKIM keys of domains. Answers `dkim_removed` also for
        domains without a key.
      operationId: deleteDkimKeys
      tags:
        - DKIM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Domain names
              items:
                type: string
            example:
              - example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain:
    post:
      summary: Delete domains
      description: >-
        Deletes domains without mailboxes or resources, with their aliases,
        alias domains and settings. Domain admins left without a domain are
        deleted too. The DKIM key is kept.


        Messages: `domain_removed`; error `domain_not_empty`.
      operationId: deleteDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Domain names
              items:
                type: string
            example:
              - example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain-admin:
    post:
      summary: Delete domain administrators
      description: >-
        Deletes domain administrators with their ACLs, two-factor
        authentication and FIDO2 keys.


        Messages: `domain_admin_removed`; error `username_invalid`.
      operationId: deleteDomainAdmin
      tags:
        - Domain admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Usernames of the domain administrators
              items:
                type: string
            example:
              - domainadmin1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain-policy:
    post:
      summary: Delete entries of domain allow and deny lists
      description: >-
        Deletes allow and deny list entries of domains by `prefid`. Needs the
        ACL `spam_policy`. Unknown IDs and entries of mailboxes answer
        `access_denied`.


        Messages: `item_deleted`.
      operationId: deleteDomainPolicy
      tags:
        - Domain antispam policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Entry IDs (`prefid`)
              items:
                type: [integer, string]
            example:
              - 12
              - 13
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/fwdhost:
    post:
      tags:
        - Forwarding Hosts
      summary: Delete forwarding hosts
      operationId: deleteForwardingHost
      description: >-
        Removes forwarding hosts, answering `forwarding_host_removed` also for
        hosts that do not exist.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Hosts as get/fwdhost lists them (`host`; a single value works too)
              items:
                type: string
            example:
              - 192.0.2.25
              - "2001:db8::25"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/fwdhost/{host}:
    get:
      tags:
        - Forwarding Hosts
      summary: Get forwarding hosts
      operationId: getForwardingHosts
      description: >-
        `all` lists the forwarding hosts; any logged-in role may read a single
        address. Networks cannot be read one by one (the slash ends the path).
        `{}` if there is none.
      parameters:
        - name: host
          in: path
          required: true
          description: "`all` or the address of a forwarding host"
          schema:
            type: string
          example: all
      responses:
        "200":
          description: The list of forwarding hosts (`all`) or one host
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ForwardingHost"
                  - $ref: "#/components/schemas/ForwardingHost"
              examples:
                all:
                  summary: get/fwdhost/all
                  value:
                    - host: 192.0.2.25
                      source: relay.example.com
                      keep_spam: "no"
                    - host: "2001:db8::25"
                      source: relay.example.com
                      keep_spam: "no"
                    - host: 198.51.100.0/24
                      source: 198.51.100.0/24
                      keep_spam: "yes"
                one:
                  summary: get/fwdhost/192.0.2.25
                  value:
                    host: 192.0.2.25
                    source: relay.example.com
                    keep_spam: "no"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/delete/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Delete mailboxes
      operationId: deleteMailbox
      description: >-
        Deletes mailboxes with all their data, including aliases that point
        only to them. Also for domain admins; a mailbox user can delete its own
        mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxItems"
            example:
              - john.doe@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailbox-group:
    post:
      summary: Delete mailbox groups
      description: >-
        Deletes groups with their address, send-as rights and grants. Members
        keep their mailbox settings; another group's template may become
        effective. Same permissions as edit.


        Messages: `group_removed`.
      operationId: deleteMailboxGroups
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Group ids
              items:
                type:
                  - integer
                  - string
            example:
              - 7
              - 8
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/identity-link:
    post:
      summary: Remove identity links
      description: >-
        Removes the links of mailboxes to their Identity Provider users, e.g.
        after an address moved to another user; the next sync run or login
        links them again by email. Answers success also for mailboxes without a
        link.


        Messages: `iam_link_removed`.
      operationId: deleteIdentityLinks
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Mailboxes
              items:
                type: string
            example:
              - alice@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailq:
    post:
      summary: Delete queued messages
      description: >-
        Deletes messages from the Postfix queue. To empty the whole queue use
        `super_delete` of `POST /api/v1/edit/mailq`.


        Messages: `queue_command_success`; errors `Error: command failed: ...`,
        `unknown`.
      operationId: deleteQueuedMessages
      tags:
        - Queue Manager
      requestBody:
        content:
          application/json:
            schema:
              description: Queue IDs (a single ID works too)
              oneOf:
                - type: array
                  items:
                    type: string
                - type: string
            example:
              - B98C6260CA1
              - 4C1E8260D02
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/oauth2-client:
    post:
      summary: Delete OAuth2 clients
      description: >-
        Deletes OAuth2 clients but not their tokens; revoke these first with
        `revoke_tokens` of `edit/oauth2-client`.


        Messages: `items_deleted`.
      operationId: deleteOAuth2Client
      tags:
        - oAuth Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: IDs of the clients
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/qitem:
    post:
      summary: Delete quarantined messages
      description: >-
        Deletes quarantine items without releasing or learning them. Domain
        admins and mailbox users may delete their own items if the quarantine
        module is allowed for them. Admins get `item_deleted` even for unknown
        IDs.
      operationId: deleteQuarantineItems
      tags:
        - Quarantine
      requestBody:
        content:
          application/json:
            schema:
              description: IDs of quarantine items (a single ID works too)
              oneOf:
                - type: array
                  items:
                    type: [integer, string]
                - type: [integer, string]
            example:
              - "33"
              - "34"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/qitem:
    post:
      summary: Release or learn quarantined messages
      description: >-
        By `attr.action`: `release` and `learnham` both deliver the message,
        delete the item and learn it as ham; `learnspam` deletes it and learns
        it as spam. Domain
        admins and mailbox users may act on their own items if the quarantine
        module is allowed for them. A failed delivery stops the remaining
        items.


        Messages: `item_released`, `learned_ham`, `qlearn_spam`; errors
        `release_send_failed`, `ham_learn_error`, `spam_learn_error`.
      operationId: editQuarantineItems
      tags:
        - Quarantine
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID or list of IDs of quarantine items
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - release
                        - learnham
                        - learnspam
                  required:
                    - action
              required:
                - items
                - attr
            example:
              items:
                - "33"
                - "34"
              attr:
                action: release
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/recipient_map:
    post:
      tags:
        - Address Rewriting
      summary: Delete recipient maps
      operationId: deleteRecipientMap
      description: >-
        Deletes recipient maps by ID. Answers `recipient_map_entry_deleted`
        also for IDs that do not exist; a non-numeric ID stops the call.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the recipient maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/relayhost:
    post:
      tags:
        - Routing
      summary: Delete sender-dependent transports
      operationId: deleteRelayhost
      description: >-
        Deletes sender-dependent transports by ID, answering
        `relayhost_removed` also for IDs that do not exist. Domains that used
        one fall back to the default route; the `relayhost` of mailboxes is not
        reset.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the sender-dependent transports (a single value works too)
              items:
                type: [integer, string]
            example:
              - 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/resource:
    post:
      tags:
        - Resources
      summary: Delete resources
      operationId: deleteResource
      description: >-
        Deletes resources and their SOGo data, also for domain admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Resource addresses
              items:
                type: string
            example:
              - MeetingRoom1@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/syncjob:
    post:
      summary: Delete sync jobs
      description: >-
        Deletes sync jobs. Needs the `syncjobs` ACL and access to the mailbox of
        each job. The OAuth2 token of the remote account is deleted when no
        other job uses it.


        Messages: `deleted_syncjob`.
      operationId: deleteSyncJobs
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Job ids
              items:
                type:
                  - integer
                  - string
            example:
              - 12
              - 13
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/syncjob_source:
    post:
      summary: Delete sync sources
      description: >-
        Deletes sync sources that no job uses. Needs the `syncjobs` ACL and edit
        rights on the source.


        Messages: `imapsync_source_deleted`; errors `imapsync_source_in_use`.
      operationId: deleteSyncJobSources
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Source ids
              items:
                type:
                  - integer
                  - string
            example:
              - 3
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/tls-policy-map:
    post:
      tags:
        - Outgoing TLS Policy Map Overrides
      summary: Delete TLS policy maps
      operationId: deleteTlsPolicyMap
      description: >-
        Deletes TLS policy maps by ID. Answers `tls_policy_map_entry_deleted`
        also for IDs that do not exist; a non-numeric ID stops the call.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the TLS policy maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 2
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/transport:
    post:
      tags:
        - Routing
      summary: Delete transport maps
      operationId: deleteTransport
      description: >-
        Deletes transport maps by ID, answering `relayhost_removed` also for
        IDs that do not exist.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: IDs of the transport maps (a single value works too)
              items:
                type: [integer, string]
            example:
              - 4
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/mailbox/tag/{mailbox}:
    post:
      tags:
        - Mailboxes
      summary: Remove tags from a mailbox
      operationId: deleteMailboxTags
      description: >-
        Removes tags from the mailbox, also for domain admins. Answers "Cannot
        delete item" when no tag was sent.
      parameters:
        - name: mailbox
          in: path
          required: true
          description: Mailbox address
          schema:
            type: string
          example: john.doe@example.org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Tag names
              items:
                type: string
            example:
              - sales
              - trainee
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/delete/domain/tag/{domain}:
    post:
      summary: Remove tags of a domain
      description: >-
        Removes tags from a domain. Answers `domain_modified` also for tags the
        domain did not have.
      operationId: deleteDomainTags
      tags:
        - Domains
      parameters:
        - name: domain
          in: path
          required: true
          description: Domain name
          schema:
            type: string
          example: example.org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Tag names
              items:
                type: string
            example:
              - customer
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/alias:
    post:
      tags:
        - Aliases
      summary: Update aliases
      operationId: editAlias
      description: >-
        Changes the aliases in `items`; fields not sent keep their value,
        except the `goto_*` flags, which are reset to 0. An alias that discards
        or learns its mail therefore needs its `goto_*` flag in every edit,
        else nothing is saved while the answer still says `alias_modified`.
        Invalid destinations are dropped; if none remains, nothing is saved.


        Messages: `alias_modified`; errors `alias_invalid`,
        `alias_group_managed`, `goto_invalid`, `is_not_primary_alias`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: IDs or addresses of the aliases, a single value or a list
                  oneOf:
                    - type: array
                      items:
                        type: [integer, string]
                    - type: [integer, string]
                attr:
                  type: object
                  properties:
                    address:
                      type: string
                      description: New alias address, `@example.org` for a catch-all
                    goto:
                      type: string
                      description: >-
                        New destination addresses, replacing the current ones;
                        ignored if a `goto_*` flag is 1
                    goto_null:
                      type: [boolean, integer, string]
                      description: 1 = discard the mail silently
                      default: 0
                    goto_spam:
                      type: [boolean, integer, string]
                      description: 1 = learn the mail as spam
                      default: 0
                    goto_ham:
                      type: [boolean, integer, string]
                      description: 1 = learn the mail as ham
                      default: 0
                    active:
                      type: [boolean, integer, string]
                      description: 1 = active, 0 = inactive
                    sogo_visible:
                      type: [boolean, integer, string]
                      description: 1 = selectable sender in SOGo
                    internal:
                      type: [boolean, integer, string]
                      description: 1 = only reachable from its own domain and its alias domains
                    sender_allowed:
                      type: [boolean, integer, string]
                      description: 1 = the destination mailboxes may send as this alias
                    public_comment:
                      type: string
                      description: Comment shown to the users
                    private_comment:
                      type: string
                      description: Comment for administrators
                    expand_alias:
                      type: [boolean, integer]
                      description: >-
                        1 = only create the missing copies of the alias in the
                        alias domains of its domain; other attributes are
                        ignored
              required:
                - items
                - attr
            example:
              items:
                - 12
              attr:
                goto: anna@example.org,ben@example.org,carla@example.org
                active: "1"
                public_comment: Sales team
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/api-key:
    post:
      summary: Edit API keys
      description: >-
        Changes API keys; fields not sent keep their value. `regen_key` sets a
        new random value, which locks out clients using the old one. Service
        keys from mailcow.conf cannot be changed.


        Messages: `api_key_modified`; errors `api_key_service_locked`,
        `api_key_network_invalid`, `ip_list_empty`.
      operationId: editApiKey
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: ID of the API key, or a list of IDs
                  oneOf:
                    - type: [integer, string]
                    - type: array
                      items:
                        type: [integer, string]
                attr:
                  allOf:
                    - $ref: "#/components/schemas/ApiKeyAttributes"
                    - type: object
                      properties:
                        regen_key:
                          type: [integer, string, boolean]
                          description: 1 = generate a new key value
                          default: 0
              required:
                - items
                - attr
            example:
              items:
                - 3
              attr:
                allow_from:
                  - 192.0.2.10
                  - 198.51.100.0/24
                regen_key: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain:
    post:
      summary: Edit domains
      description: >-
        Changes domains. Quotas are in MiB. Fields not sent keep their value,
        so do `aliases`, `maxquota` and `quota` sent as 0 or empty. `tags` are
        added; a tag the domain has already ends the call without an answer
        after saving the rest. Domain admins can change only `description`,
        `gal` and `tags`.


        Messages: `domain_modified`; errors `domain_invalid`,
        `max_quota_in_use`, `mailboxes_in_use`, `aliases_in_use`.
      operationId: editDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain name or list of domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Description
                    aliases:
                      type: [integer, string]
                      description: Max. number of aliases
                    mailboxes:
                      type: [integer, string]
                      description: Max. number of mailboxes
                    defquota:
                      type: [integer, string]
                      description: Default quota of new mailboxes in MiB
                    maxquota:
                      type: [integer, string]
                      description: Max. quota per mailbox in MiB
                    quota:
                      type: [integer, string]
                      description: Quota of the whole domain in MiB
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Domain active
                    gal:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Global address list in SOGo
                    backupmx:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Relay this domain (backup MX)
                    relay_all_recipients:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: Relay all recipients; 1 sets `backupmx`
                    relay_unknown_only:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: >-
                        Relay only recipients without a local mailbox; 1 sets
                        `backupmx` and `relay_all_recipients`
                    relayhost:
                      type: [integer, string]
                      description: >-
                        ID of the sender-dependent transport (get/relayhost/all)
                        the domain sends through, 0 = none
                    tags:
                      type: array
                      items:
                        type: string
                      description: Tags to add
            example:
              items:
                - example.org
              attr:
                description: Example Org
                aliases: 400
                mailboxes: 20
                defquota: 3072
                maxquota: 10240
                quota: 51200
                active: 1
                gal: 1
                backupmx: 0
                relay_all_recipients: 0
                relay_unknown_only: 0
                relayhost: 0
                tags:
                  - premium
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/domain/footer:
    post:
      summary: Set the domain-wide footer
      description: >-
        Sets the footer of all outgoing mail of the domains; fields not sent are
        emptied. Placeholders: `{= auth_user =}`, `{= from_user =}`,
        `{= from_name =}`, `{= from_addr =}`, `{= from_domain =}` and custom
        mailbox attributes.


        Messages: `domain_footer_modified`; error `domain_invalid`.
      operationId: editDomainFooter
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Domain name or list of domain names
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                attr:
                  type: object
                  properties:
                    html:
                      type: string
                      default: ""
                      description: HTML footer
                    plain:
                      type: string
                      default: ""
                      description: Plain text footer
                    skip_replies:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      default: 0
                      description: No footer in replies
                    exclude:
                      description: >-
                        Mailboxes, aliases and alias domains without footer;
                        unknown entries are skipped (`username_invalid`)
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
            example:
              items:
                - example.org
              attr:
                html: "<p>Example Org &middot; {= from_name =}</p>"
                plain: "Example Org - {= from_name =}"
                skip_replies: 1
                exclude:
                  - noreply@example.org
                  - example.com
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/fail2ban:
    post:
      summary: Edit Fail2Ban settings, bans and filters
      description: >-
        By `attr.action`: `unban`, `whitelist` and `blacklist` unban, allowlist
        or deny the networks in `items`; `unban-all` lifts all active bans;
        `edit-regex` replaces the regex filters with `attr.regex`,
        `reset-regex` restores the defaults. Without `action` the settings are
        saved: fields not sent keep their value, but `ban_time_increment` and
        `manage_external` become 0, and values out of range are clamped. The
        same happens for `unban`, `whitelist`, `blacklist` or `reset-regex`
        without `items`.


        Messages: `f2b_modified`, `object_modified`; errors
        `network_host_invalid`, `reset_f2b_regex`.
      operationId: editFail2Ban
      tags:
        - Fail2Ban
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Networks or IPs for `unban`, `whitelist`, `blacklist` (single value or list)
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - unban
                        - whitelist
                        - blacklist
                        - unban-all
                        - edit-regex
                        - reset-regex
                    regex:
                      type: array
                      items:
                        type: string
                      description: "`edit-regex`: the regex filters; the first group must match the IP"
                    ban_time:
                      type: [integer, string]
                      description: Ban time in seconds (min. 60)
                    ban_time_increment:
                      type: [boolean, integer, string]
                      description: 1 = the ban time grows with every ban of a network; not sent = 0
                    max_ban_time:
                      type: [integer, string]
                      description: Maximum ban time in seconds (min. 60)
                    max_attempts:
                      type: [integer, string]
                      description: Failed logins within `retry_window` that lead to a ban (min. 1)
                    retry_window:
                      type: [integer, string]
                      description: Window in seconds for `max_attempts` (min. 1)
                    netban_ipv4:
                      type: [integer, string]
                      description: IPv4 prefix length that is banned (8-32)
                    netban_ipv6:
                      type: [integer, string]
                      description: IPv6 prefix length that is banned (8-128)
                    whitelist:
                      type: string
                      description: Allowlist, networks or host names separated by space, comma, semicolon or newline; replaces the list
                    blacklist:
                      type: string
                      description: Denylist, networks separated by space, comma, semicolon or newline; replaces the list
                    manage_external:
                      type: [boolean, integer, string]
                      description: 1 = netfilter sets no rules, block externally with the banlist; not sent = 0
              required:
                - attr
            examples:
              settings:
                summary: Save the settings
                value:
                  items: []
                  attr:
                    ban_time: "1800"
                    ban_time_increment: "1"
                    max_ban_time: "86400"
                    max_attempts: "10"
                    retry_window: "600"
                    netban_ipv4: "32"
                    netban_ipv6: "128"
                    whitelist: |-
                      192.0.2.0/24
                      mail.example.org
                    blacklist: 198.51.100.66/32
                    manage_external: "0"
              unban:
                summary: Unban a network
                value:
                  items:
                    - 203.0.113.7/32
                  attr:
                    action: unban
              regex:
                summary: Replace the regex filters
                value:
                  items:
                    - self
                  attr:
                    action: edit-regex
                    regex:
                      - "^mailcow UI: Invalid password for .+ by ([0-9a-f\\.:]+)$"
                      - "^Rspamd UI: Invalid password by ([0-9a-f\\.:]+)$"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox:
    post:
      tags:
        - Mailboxes
      summary: Update mailboxes
      operationId: editMailbox
      description: >-
        Changes mailboxes; fields not sent keep their value. Also for domain
        admins; without the matching ACL their changes to `sogo_access`,
        protocols and `relayhost` are ignored silently and
        `extended_sender_acl` is refused. Quota 0 (unlimited) needs the
        `unlimited_quota` ACL.


        Messages: `mailbox_modified`; errors `mailbox_quota_exceeded`,
        `password_complexity`, `sender_acl_invalid`,
        `extended_sender_acl_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  $ref: "#/components/schemas/MailboxEdit"
            example:
              items:
                - john.doe@example.org
              attr:
                name: John Doe
                quota: 5120
                active: 1
                protocol_access:
                  - imap
                  - smtp
                  - sieve
                  - dav
                sender_acl:
                  - sales@example.org
                  - "@example.com"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox/custom-attribute:
    post:
      tags:
        - Mailboxes
      summary: Set custom attributes of mailboxes
      operationId: editMailboxCustomAttributes
      description: >-
        Replaces the custom attributes (free key/value pairs) of the mailboxes:
        `attribute[i]` gets `value[i]`, all others are removed. Also for domain
        admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    attribute:
                      description: Attribute names (a single string is one name)
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                    value:
                      description: Values, in the order of `attribute`
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
            example:
              items:
                - john.doe@example.org
              attr:
                attribute:
                  - department
                  - employee_id
                value:
                  - Sales
                  - "4711"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailbox-group:
    post:
      summary: Update mailbox groups
      description: >-
        Changes groups; fields not sent keep their value. The domain cannot be
        changed, and members from the identity sync cannot be removed here.
        Domain admins need the `mailbox_groups` ACL and cannot edit groups with
        send-as addresses or grants outside their domains.


        Messages: `group_modified`; errors `group_member_idp` and those of add.
      operationId: editMailboxGroups
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Group ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  allOf:
                    - $ref: "#/components/schemas/MailboxGroupAttributes"
                    - type: object
                      properties:
                        reapply_template:
                          type:
                            - boolean
                            - integer
                            - string
                          description: >-
                            Admins only: apply the effective templates to all
                            members again, also when nothing changed
                          default: 0
            example:
              items:
                - 7
              attr:
                add_members:
                  - carol@example.org
                remove_members:
                  - bob@example.org
                sogo_grants:
                  - owner: shared@example.org
                    type: Calendar
                    folder: personal
                    access: write
                    subscribe: 1
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/identity-provider-sync:
    post:
      summary: Request an identity sync run
      description: >-
        Queues an identity sync run (Keycloak and LDAP) that starts within a
        minute, see `GET /api/v1/get/identity-provider/sync-status`. An
        identical pending request is reused.


        Messages: `iam_sync_requested`; errors `iam_sync_mode_invalid`,
        `iam_sync_unavailable`.
      operationId: requestIdentitySync
      tags:
        - Identity Provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  properties:
                    mode:
                      type: string
                      description: >-
                        `preview` lists the changes without applying them,
                        `run` applies them, `force` applies them without the
                        change limit (`offboarding_limit`)
                      enum:
                        - preview
                        - run
                        - force
                      default: run
            example:
              attr:
                mode: preview
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/mailq:
    post:
      summary: Act on the mail queue
      description: >-
        Runs a Postfix queue command. `hold`, `unhold` and `deliver` act on the
        queue IDs in `items` and do nothing without them; `flush` retries the
        whole queue, `super_delete` deletes every queued message.


        Messages: `queue_command_success`; errors `Error: command failed: ...`,
        `unknown`.
      operationId: editMailQueue
      tags:
        - Queue Manager
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  description: Queue ID or list of queue IDs (for `hold`, `unhold`, `deliver`)
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                attr:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                        - hold
                        - unhold
                        - deliver
                        - flush
                        - super_delete
                  required:
                    - action
              required:
                - attr
            examples:
              hold:
                summary: Hold two messages
                value:
                  items:
                    - B98C6260CA1
                    - 4C1E8260D02
                  attr:
                    action: hold
              flush:
                summary: Flush the whole queue
                value:
                  items: []
                  attr:
                    action: flush
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/pushover:
    post:
      tags:
        - Mailbox user settings
      summary: Set the Pushover notifications of mailboxes
      operationId: editPushover
      description: >-
        Saves the Pushover settings (push notification on new mail) of the
        mailboxes; `delete: "true"` removes them. Needs the user ACL
        `pushover`; domain admins need their own ACL `pushover`. `key` and
        `token` are required the first time; later, empty fields keep their
        value.


        Messages: `pushover_settings_edited`; errors `pushover_key`,
        `pushover_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Pushover user key, 30 letters and digits
                    token:
                      type: string
                      description: Pushover application token, 30 letters and digits
                    active:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                    title:
                      type: string
                      description: Title of the notification (default "Mail")
                    text:
                      type: string
                      description: Text of the notification
                    senders:
                      type: string
                      description: Only notify for these senders (separated by comma, space or semicolon)
                    senders_regex:
                      type: string
                      description: Only notify for senders matching this regular expression
                    evaluate_x_prio:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 sends high-priority mail as high-priority notification (0 when not sent)
                    only_x_prio:
                      type: [integer, string]
                      enum: [0, 1, "0", "1"]
                      description: 1 notifies for high-priority mails only (0 when not sent)
                    sound:
                      type: string
                      description: Pushover sound name (empty when not sent)
                    delete:
                      type: string
                      enum:
                        - "true"
                      description: '"true" removes the Pushover settings, other fields are ignored'
            example:
              items:
                - john.doe@example.org
              attr:
                key: uQiRzpo4DXghDmr9QzzfQu27cmVRsG
                token: azGDORePK8gMaC0QOYAMyEEuzJnyUi
                active: 1
                title: New mail
                text: You've got mail
                senders: boss@example.org
                evaluate_x_prio: 1
                only_x_prio: 0
                sound: pushover
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/quarantine_notification:
    post:
      tags:
        - Quarantine
      summary: Set the quarantine notification interval of mailboxes
      operationId: editQuarantineNotification
      description: >-
        How often the mailbox user gets a summary of quarantined mail. Needs
        the user ACL `quarantine_notification`; a mailbox user may change only
        its own. An invalid value answers `access_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  required:
                    - quarantine_notification
                  properties:
                    quarantine_notification:
                      type: string
                      enum:
                        - never
                        - hourly
                        - daily
                        - weekly
            example:
              items:
                - john.doe@example.org
              attr:
                quarantine_notification: daily
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob:
    post:
      summary: Update sync jobs
      description: >-
        Changes sync jobs; fields not sent keep their value, an empty `user1` or
        `password1` keeps the stored one. The local mailbox cannot be changed.
        Needs the `syncjobs` ACL and access to the mailbox of each job.


        Messages: `mailbox_modified`; errors as for add.
      operationId: editSyncJobs
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Job ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  allOf:
                    - $ref: "#/components/schemas/SyncJobAttributes"
                    - type: object
                      properties:
                        last_run:
                          description: Any value except null resets the last run time (the job is due again)
                        success:
                          description: Any value except null resets the result of the last run
                        prio:
                          type:
                            - integer
                            - string
                          description: >-
                            Admins only: queue priority, higher runs first (see
                            `edit/syncjob/run_next`)
            example:
              items:
                - 12
                - 13
              attr:
                active: 0
                mins_interval: 60
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob/run_next:
    post:
      summary: Run sync jobs next
      description: >-
        Moves sync jobs to the front of the queue so the runner starts them
        next; their `last_run` and `success` are cleared.


        Messages: `imapsync_run_next_done`; errors `imapsync_job_running`.
      operationId: runSyncJobsNext
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  description: Job ids
                  type: array
                  items:
                    type:
                      - integer
                      - string
                attr:
                  description: Not used
                  type: object
            example:
              items:
                - 12
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob_source:
    post:
      summary: Update sync sources
      description: >-
        Changes sync sources; fields not sent keep their value, an empty
        `oauth_client_secret` keeps the stored one. Needs the `syncjobs` ACL and
        edit rights: own sources, for domain admins also those of their
        mailboxes. Changing the server or OAuth2 client drops stored tokens and,
        like turning off `verify_cert`, needs access to every mailbox whose jobs
        use the source.


        Messages: `imapsync_source_modified`,
        `imapsync_source_token_refresh_failed`; errors
        `imapsync_source_used_by_others` and those of add.
      operationId: editSyncJobSources
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: >-
                    Source ids, a list or a single id. An `id` inside `attr`
                    replaces `items`.
                  oneOf:
                    - type: array
                      items:
                        type:
                          - integer
                          - string
                    - type:
                        - integer
                        - string
                attr:
                  $ref: "#/components/schemas/SyncJobSourceAttributes"
            example:
              items:
                - 3
              attr:
                description: Migration finished in December
                scope: user
                users:
                  - alice@example.org
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/syncjob_source/refresh_token:
    post:
      summary: Refresh the token of a sync source
      description: >-
        Fetches a new OAuth2 token for a client_credentials source now; tokens
        are otherwise refreshed before they expire. Needs the `syncjobs` ACL and
        edit rights on the source.


        Messages: `imapsync_source_token_refreshed`; errors
        `imapsync_source_refresh_unsupported`,
        `imapsync_source_token_refresh_failed`.
      operationId: refreshSyncJobSourceToken
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  description: Source id (the first entry is used)
                  type: array
                  items:
                    type:
                      - integer
                      - string
                attr:
                  description: Not used
                  type: object
            example:
              items:
                - 5
              attr: {}
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/imapsync_settings:
    post:
      summary: Update global sync job settings
      description: >-
        Sets how many sync jobs run at the same time and the bandwidth limit of
        each sync job process; a lower `maxbytespersecond` of a job still
        applies.


        Messages: `max_parallel_saved`; errors `imapsync_max_parallel_invalid`,
        `imapsync_max_kb_per_second_invalid`.
      operationId: editSyncJobSettings
      tags:
        - Sync jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - attr
              properties:
                items:
                  description: Not used
                attr:
                  type: object
                  required:
                    - max_parallel
                  properties:
                    max_parallel:
                      type:
                        - integer
                        - string
                      description: Sync jobs running at the same time, 1-32
                      minimum: 1
                      maximum: 32
                    max_kb_per_second:
                      type:
                        - integer
                        - string
                      description: Bandwidth limit per sync job process in KB/s; 0, empty or not sent = unlimited
                      default: 0
                      minimum: 0
                      maximum: 10485760
            example:
              attr:
                max_parallel: 4
                max_kb_per_second: 2000
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/user-acl:
    post:
      tags:
        - Mailboxes
      summary: Set the ACL of mailboxes
      operationId: editUserAcl
      description: >-
        Sets the user ACL (what the mailbox user may change in the UI): listed
        ACLs on, all others off. Domain admins can change only ACLs they have
        themselves. Answers `acl_saved`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  $ref: "#/components/schemas/MailboxItems"
                attr:
                  type: object
                  properties:
                    user_acl:
                      description: ACLs to switch on (a single string is one ACL); an empty list switches all off
                      oneOf:
                        - $ref: "#/components/schemas/UserAclName"
                        - type: array
                          items:
                            $ref: "#/components/schemas/UserAclName"
            example:
              items:
                - john.doe@example.org
              attr:
                user_acl:
                  - spam_alias
                  - tls_policy
                  - spam_score
                  - spam_policy
                  - delimiter_action
                  - eas_reset
                  - pushover
                  - quarantine
                  - quarantine_notification
                  - app_passwds
                  - pw_reset
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/get/alias/{id}:
    get:
      tags:
        - Aliases
      summary: Get aliases
      operationId: getAliases
