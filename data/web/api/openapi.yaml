      type: object
      description: Attributes of an API key for add and edit
      properties:
        description:
          type: string
          description: Free text, at most 255 characters
          default: ""
        access:
          type: string
          enum:
            - ro
            - rw
          description: "`ro`: read-only (get routes only), `rw`: read/write. Required for a new key."
        allow_from:
          description: >-
            IP addresses and CIDR networks the key may be used from: a list or
            a string separated by spaces, commas, semicolons or newlines. An
            edit replaces the list.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        skip_ip_check:
          type: [integer, string, boolean]
          description: 1/true = allow the key from any address
          default: 0
        active:
          type: [integer, string, boolean]
          description: 1/true = active
          default: 1
    OAuth2Client:
