          type: string
    AcmeLogEntry:
      type: object
      properties:
        time:
          type: string
          description: Unix time
        message:
          type: string
    ApiLogEntry:
      type: object
      properties:
        time:
          type: integer
          description: Unix time
        uri:
          type: string
