  /api/v1/get/syncjob_source/{id}:
    get:
      summary: Get sync source
      description: >-
        One sync source by id, with the visibility rules of
        `GET /api/v1/get/syncjob_source/all`. Answers `{}` when the id is not a
        whole number, the source does not exist or the caller may not see it.
      operationId: getSyncJobSource
