                allow_from:
                  - 192.0.2.10
                  - 2001:db8::/64
                skip_ip_check: 0
                service: 0
                active: 1
                created: "2026-11-02 09:12:44"
                modified: "2026-11-05 16:40:02"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/api-key/all:
    get:
      summary: Get API keys
