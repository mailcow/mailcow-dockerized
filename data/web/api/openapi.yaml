  /api/v1/add/alias-domain:
    post:
      summary: Add alias domains
      description: >-
        Adds alias domains: mail goes to the same local part in the target
        domain, which must be accessible and no relay domain. Needs the ACL
        `alias_domains`. Can also set the rate limit and create a DKIM key. An
        invalid name ends the call without an answer.


        Messages: `aliasd_added`; errors `alias_domain_invalid`,
        `targetd_not_found`, `targetd_relay_domain`.
      operationId: addAliasDomain
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alias_domain
                - target_domain
              properties:
                alias_domain:
                  type: string
                  description: >-
                    Alias domain name; several are separated by spaces, commas,
                    semicolons or line breaks
                target_domain:
                  type: string
                  description: The domain the alias domain points to
                active:
                  type: [integer, string]
                  enum: [0, 1, "0", "1"]
                  default: 0
                  description: Alias domain active (inactive when not sent)
                rl_value:
                  type: [integer, string]
                  description: Rate limit, messages per `rl_frame`; empty or 0 = none
                rl_frame:
                  type: string
                  enum: [s, m, h, d]
                  description: Rate limit time frame
                dkim_selector:
                  type: string
                  description: Selector of the DKIM key that is created
                key_size:
                  type: [integer, string]
                  description: >-
                    RSA size of the new DKIM key in bits; a key needs
                    `key_size` and `dkim_selector`
            example:
              alias_domain: example.net
              target_domain: example.org
              active: 1
              rl_value: 100
              rl_frame: h
              dkim_selector: dkim
              key_size: 2048
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/edit/alias-domain:
    post:
