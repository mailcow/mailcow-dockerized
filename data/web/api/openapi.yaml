  /api/v1/edit/domain/template:
    post:
      summary: Edit domain templates
      description: >-
        Replaces the attributes of domain templates. Admins only. Send all
        attributes: one that is not sent is reset (numbers and quotas to 0,
        `tags` to none, `rl_frame` to `s`, `active` and `gal` to 1,
        `dkim_selector` to `dkim`, `key_size` to 2048). The `Default` template
        keeps its name. Edit one template per call: with several IDs the
        templates after the first get the name of the first one. Unknown IDs
        answer `template_id_invalid`; the call always ends with
        `template_modified`.
      operationId: editDomainTemplate
      tags:
        - Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - attr
              properties:
                items:
                  description: Template ID or list of template IDs
                  oneOf:
                    - type: [integer, string]
                    - type: array
                      items:
                        type: [integer, string]
                attr:
                  $ref: "#/components/schemas/DomainTemplateInput"
            example:
              items:
                - 2
              attr:
                template: Small business
                max_num_aliases_for_domain: 400
                max_num_mboxes_for_domain: 50
                def_quota_for_mbox: 2048
                max_quota_for_mbox: 5120
                max_quota_for_domain: 102400
                rl_value: 500
                rl_frame: h
                active: 1
                gal: 1
                backupmx: 0
