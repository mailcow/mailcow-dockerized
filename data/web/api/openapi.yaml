          $ref: "#/components/responses/Unauthorized"
  /api/v1/get/mailbox/reduced:
    get:
      tags:
        - Mailboxes
      summary: Get all mailboxes (reduced details)
      operationId: getMailboxesReduced
      description: >-
        Like `get/mailbox/all`, but each mailbox without the costly fields
        `max_new_quota`, `spam_aliases`, `pushover_active`, `rl`, `rl_scope`,
