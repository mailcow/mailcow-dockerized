                    tls_enforce_out: 0
                    imap_access: 1
                    pop3_access: 1
                    smtp_access: 1
                    sieve_access: 1
                    eas_access: 1
                    dav_access: 1
                    acl_spam_alias: 1
                    acl_tls_policy: 1
                    acl_spam_score: 1
                    acl_spam_policy: 1
                    acl_delimiter_action: 1
                    acl_syncjobs: 0
                    acl_eas_reset: 1
