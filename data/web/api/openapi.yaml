          description: Seconds
        read_only:
          type: boolean
        scanned:
          type: integer
        learned:
          type: integer
        actions:
          type: object
          description: Number of messages per action
          additionalProperties:
            type: integer
        scan_times:
          type: array
          items:
            type: [number, "null"]
        spam_count:
          type: integer
        ham_count:
          type: integer
        connections:
          type: integer
        control_connections:
          type: integer
        total_learns:
          type: integer
        statfiles:
          type: array
          description: Bayes statistics
          items:
            type: object
        fuzzy_hashes:
          type: object
          additionalProperties:
            type: integer
      additionalProperties: true
    SaslLogEntry:
      type: object
      properties:
        service:
          type: string
          description: "`imap`, `pop3`, `smtp`, `sieve`, `SSO` (SOGo), ..."
        app_password:
          type: integer
          description: ID of the app password used, 0 = the mailbox password
        username:
          type: string
        real_rip:
          type: string
          description: Client address
        datetime:
          type: string
          description: Time of the last login (`YYYY-MM-DD hh:mm:ss`)
    UiLogEntry:
      type: object
      properties:
        id:
          type: integer
        task:
          type: string
          description: ID of the request
        type:
          type: string
          description: "`success`, `danger`, `warning` or `info`"
        msg:
