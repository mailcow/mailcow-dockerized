openapi: 3.1.0
info:
  description: >-
    mailcow is complete e-mailing solution with advanced antispam, antivirus,
    nice UI and API.


    In order to use this API you have to create a API key and add your IP
    address to the whitelist of allowed IPs this can be done by logging into the
    Mailcow UI using your admin account, then go to Configuration > Access >
    Edit administrator details > API. There you will find a collapsed API menu.


    There are two types of API keys
      - The read only key can only be used for all get endpoints
      - The read write key can be used for all endpoints

    You can create as many keys of both types as you need. Service keys
    defined in mailcow.conf (API_KEY, API_KEY_READ_ONLY, API_ALLOW_FROM) are
    shown in the UI, but can only be changed in mailcow.conf.


    **Requests**

      - `get` routes use `GET`, all other routes use `POST` (else `405`).
      - `add` routes take the new object as the JSON body.
      - `edit` routes take `{"items": [...], "attr": {...}}`: `items` names the
        objects to change, `attr` holds the values to set.
      - `delete` routes take the JSON array of the objects to delete.
      - Send `Content-Type: application/json`. A body that is no valid JSON
        is answered with `400`.

    **Answers**

      - Write routes answer with the list of messages of the call (`type`
        `success`, `danger`, `warning` or `info`; `msg` is a key of the mailcow
        language files, alone or with its values). A call without messages
        answers `{"type": "success", "msg": "Task completed"}` or
        `{"type": "error", "msg": "Cannot add item"}`. The HTTP status is 200
        in both cases: check `type`.
      - Read routes answer with the object or list, `{}` or `[]` when there is
        nothing.
      - Unknown routes answer `404` with `{"type": "error", "msg": "route not found"}`.

  title: mailcow API
  version: "1.0.0"

servers:
  - url: /

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Message:
      type: object
      description: >-
        One message of a write call, as the mailcow UI shows it. `msg` is a key
        of the mailcow language files, alone or as a list with the values of its
        placeholders.
      properties:
        type:
          type: string
          enum:
            - success
            - danger
            - warning
            - info
        log:
          type: array
          description: >-
            The call that produced the message (function, action, object,
            data), secrets replaced by `*`
          items: {}
        msg:
          oneOf:
            - type: string
            - type: array
              items: {}
      required:
        - type
        - msg
    Messages:
      type: array
      items:
        $ref: "#/components/schemas/Message"
    TaskResult:
      type: object
      description: Answer of a write call that produced no message
      properties:
        type:
          type: string
          enum:
            - success
            - error
        msg:
          type: string
          examples:
            - Task completed
            - Cannot add item
      required:
        - type
        - msg
    Error:
      type: object
      properties:
        type:
          type: string
          const: error
        msg:
          type: string
      required:
        - type
        - msg
    Domain:
      type: object
      description: >-
        A domain. Quotas and sizes are in bytes; the `*_int` fields repeat the
        value before them.
      properties:
        domain_name:
          type: string
          description: Domain name (IDN as punycode)
        domain_h_name:
          type: string
          description: Domain name in Unicode
        description:
          type: string
          description: Description
        max_new_mailbox_quota:
          type: integer
          description: >-
            Largest quota a new mailbox can get: the free domain quota, at most
            the max. mailbox quota
        def_new_mailbox_quota:
          type: integer
          description: Quota a new mailbox gets by default
        quota_used_in_domain:
          type: [string, integer]
          description: Sum of the quotas of the mailboxes
        bytes_total:
          type: [string, integer]
          description: Storage used by the mailboxes
        msgs_total:
          type: [string, integer]
          description: Number of messages in the mailboxes
        mboxes_in_domain:
          type: integer
          description: Number of mailboxes
        mboxes_left:
          type: integer
          description: Mailboxes that can still be added
        max_num_aliases_for_domain:
          type: integer
          description: Max. number of aliases
        max_num_mboxes_for_domain:
          type: integer
          description: Max. number of mailboxes
        def_quota_for_mbox:
          type: integer
          description: Default quota of new mailboxes
        max_quota_for_mbox:
          type: integer
          description: Max. quota per mailbox
        max_quota_for_domain:
          type: integer
          description: Quota of the whole domain
        relayhost:
          type: [string, integer]
          description: ID of the sender-dependent transport, "0" = none
        backupmx:
          type: integer
          enum: [0, 1]
          description: Relay domain (backup MX)
        backupmx_int:
          type: integer
          enum: [0, 1]
        gal:
          type: integer
          enum: [0, 1]
          description: Global address list in SOGo
        gal_int:
          type: integer
          enum: [0, 1]
        rl:
          description: Rate limit, `false` if none
          oneOf:
            - $ref: "#/components/schemas/DomainRatelimit"
            - type: boolean
              const: false
        active:
          type: integer
          enum: [0, 1]
          description: Domain active
        active_int:
          type: integer
          enum: [0, 1]
        relay_all_recipients:
          type: integer
          enum: [0, 1]
          description: Relay all recipients
        relay_all_recipients_int:
          type: integer
          enum: [0, 1]
        relay_unknown_only:
          type: integer
          enum: [0, 1]
          description: Relay non-existing mailboxes only
        relay_unknown_only_int:
          type: integer
          enum: [0, 1]
        created:
          type: string
          description: Creation time (`YYYY-MM-DD hh:mm:ss`)
        modified:
          type: [string, "null"]
          description: Time of the last change
        aliases_in_domain:
          type: [integer, string]
          description: Number of aliases, including those of its alias domains
        aliases_left:
          type: integer
          description: Aliases that can still be added
        domain_admins:
          type: string
          description: >-
            Comma-separated domain admins, `-` if none; only for admins (and
            API keys)
        tags:
          type: array
          items:
            type: string
          description: Tags; missing when the domain has none
    DomainRatelimit:
      type: object
      description: Rate limit of a domain or alias domain
      properties:
        value:
          type: string
          description: Messages per time frame
        frame:
          type: string
          enum: [s, m, h, d]
          description: Time frame (second, minute, hour, day)
    DomainTemplate:
      type: object
      properties:
        id:
          type: integer
          description: Template ID
        template:
          type: string
          description: Template name
        type:
          type: string
          const: domain
        attributes:
          $ref: "#/components/schemas/DomainTemplateAttributes"
        created:
          type: string
          description: Creation time
        modified:
          type: [string, "null"]
          description: Time of the last change
    DomainTemplateAttributes:
      type: object
      description: Values of a domain template as stored; quotas in bytes
      properties:
        tags:
          type: array
          items:
            type: string
        max_num_aliases_for_domain:
          type: integer
        max_num_mboxes_for_domain:
          type: integer
        def_quota_for_mbox:
          type: integer
        max_quota_for_mbox:
          type: integer
        max_quota_for_domain:
          type: integer
        rl_frame:
          type: string
          enum: [s, m, h, d]
        rl_value:
          type: [string, integer]
          description: Rate limit, "" = none
        active:
          type: integer
          enum: [0, 1]
        gal:
          type: integer
          enum: [0, 1]
        backupmx:
          type: integer
          enum: [0, 1]
        relay_all_recipients:
          type: integer
          enum: [0, 1]
        relay_unknown_only:
          type: integer
          enum: [0, 1]
        dkim_selector:
          type: string
        key_size:
          type: integer
    DomainTemplateInput:
      type: object
      description: >-
        Values of a domain template, quotas in MiB. The defaults apply when a
        template is added; for edit/domain/template see there.
      properties:
        template:
          type: string
          description: Template name, unique
        tags:
          type: array
          items:
            type: string
          default: []
          description: Tags of new domains
        max_num_aliases_for_domain:
          type: [integer, string]
          default: 400
          description: Max. number of aliases
        max_num_mboxes_for_domain:
          type: [integer, string]
          default: 10
          description: Max. number of mailboxes
        def_quota_for_mbox:
          type: [integer, string]
          default: 3072
          description: Default quota of new mailboxes in MiB
        max_quota_for_mbox:
          type: [integer, string]
          default: 10240
          description: Max. quota per mailbox in MiB
        max_quota_for_domain:
          type: [integer, string]
          default: 10240
          description: Quota of the whole domain in MiB
        rl_value:
          type: [integer, string]
          default: ""
          description: Rate limit, messages per `rl_frame`; empty = none
        rl_frame:
          type: string
          enum: [s, m, h, d]
          default: s
          description: Rate limit time frame
        active:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 1
        gal:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 1
          description: Global address list in SOGo
        backupmx:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
          description: Relay domain (backup MX)
        relay_all_recipients:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
        relay_unknown_only:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
        dkim_selector:
          type: string
          default: dkim
          description: Selector of the DKIM key of new domains
        key_size:
          type: [integer, string]
          default: 2048
          description: DKIM key size in bits of new domains
    AliasDomain:
      type: object
      properties:
        alias_domain:
          type: string
          description: Alias domain name
        target_domain:
          type: string
          description: Domain the alias domain points to
        parent_is_backupmx:
          type: integer
          enum: [0, 1]
          description: The target domain is a relay domain
        active:
          type: integer
          enum: [0, 1]
          description: Alias domain active
        active_int:
          type: integer
          enum: [0, 1]
        rl:
          description: Rate limit, `false` if none
          oneOf:
            - $ref: "#/components/schemas/DomainRatelimit"
            - type: boolean
              const: false
        created:
          type: string
          description: Creation time
        modified:
          type: [string, "null"]
          description: Time of the last change
    DomainPolicyEntry:
      type: object
      properties:
        object:
          type: string
          description: The domain or mailbox the entry belongs to
        value:
          type: string
          description: Sender address or pattern
        prefid:
          type: integer
          description: Entry ID (for delete/domain-policy)
    DkimKey:
      type: object
      properties:
        pubkey:
          type: string
          description: Public key (base64, without PEM lines)
        length:
          type: string
          enum: ["1024", "2048", "3072", "4096", ">= 8192"]
          description: Key size in bits, estimated from the public key
        dkim_txt:
          type: string
          description: >-
            Content of the DNS TXT record; split into quoted strings of 255
            characters when `SPLIT_DKIM_255` is enabled
        dkim_selector:
          type: string
          description: Selector
        privkey:
          type: string
          description: >-
            Private key in PEM format, base64-encoded, when
            `SHOW_DKIM_PRIV_KEYS` is enabled, else empty
    DomainSearchRequest:
      type: object
      description: >-
        Server-side processing parameters of DataTables
        (https://datatables.net/manual/server-side). Without `start` and
        `length` all matching domains are answered.
      properties:
        draw:
          type: integer
          description: Request counter, answered as it is
        start:
          type: integer
          description: Offset of the first domain
        length:
          type: integer
          description: Number of domains, -1 = all
        search:
          type: object
          properties:
            value:
              type: string
              description: Searched in all columns with `searchable` true
        order:
          type: array
          items:
            type: object
            properties:
              column:
                type: integer
                description: Position in `columns` (see the description of the route)
              dir:
                type: string
                enum: [asc, desc]
        columns:
          type: array
          description: >-
            The columns of the table; the position gives the database column
            (see the description of the route)
          items:
            type: object
            properties:
              data:
                type: [string, integer]
                description: >-
                  Column name of the UI; a column position makes
                  `search.value` of this entry filter that column
              searchable:
                type: [boolean, string]
                description: Column takes part in the global search
              orderable:
                type: [boolean, string]
                description: Column may be sorted by
              search:
                type: object
                properties:
                  value:
                    type: string
                    description: Filter of this column
    DomainSearchResult:
      type: object
      properties:
        draw:
          type: integer
          description: "`draw` of the request"
        recordsTotal:
          type: integer
          description: Number of domains the caller can see
        recordsFiltered:
          type: integer
          description: Number of domains that match the search
        data:
          type: array
          description: The domains of the page
          items:
            $ref: "#/components/schemas/Domain"
    MailboxItems:
      description: One mailbox address or a list of them
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    UserAclName:
      type: string
      description: >-
        A user ACL: what the mailbox user may do in the UI (time-limited
        aliases, TLS policy, spam score, allow/deny lists, tagged mail, sync
        jobs, ActiveSync and SOGo reset, Pushover, quarantine actions,
        attachments, notification interval and category, app passwords,
        password reset)
      enum:
        - spam_alias
        - tls_policy
        - spam_score
        - spam_policy
        - delimiter_action
        - syncjobs
        - eas_reset
        - sogo_profile_reset
        - pushover
        - quarantine
        - quarantine_attachments
        - quarantine_notification
        - quarantine_category
        - app_passwds
        - pw_reset
    ProtocolAccessName:
      type: string
      enum:
        - imap
        - pop3
        - smtp
        - sieve
        - eas
        - dav
    MailboxAttributes:
      type: object
      description: Settings of a mailbox; flags are "0" or "1"
      properties:
        force_pw_update:
          type: [string, integer]
          description: The user must change the password at the next login
        force_tfa:
          type: [string, integer]
          description: The user must set up two-factor authentication at the next login
        tls_enforce_in:
          type: [string, integer]
        tls_enforce_out:
          type: [string, integer]
        sogo_access:
          type: [string, integer]
          description: Login to SOGo from the UI
        imap_access:
          type: [string, integer]
        pop3_access:
          type: [string, integer]
        smtp_access:
          type: [string, integer]
        sieve_access:
          type: [string, integer]
        eas_access:
          type: [string, integer]
        dav_access:
          type: [string, integer]
        relayhost:
          type: [string, integer]
          description: ID of the sender-dependent transport, "0" for none
        shared:
          type: [string, integer]
          description: Shared mailbox without a login of its own
        passwd_update:
          type: [string, integer]
          description: Time of the last password change
        mailbox_format:
          type: string
        quarantine_notification:
          type: string
          enum:
            - never
            - hourly
            - daily
            - weekly
        quarantine_category:
          type: string
          enum:
            - reject
            - add_header
            - all
        attribute_hash:
          type: string
          description: Hash of the template the settings came from, cleared by manual changes
        recovery_email:
          type: string
          description: Address for password reset mails (present after it was set)
        template:
          type: string
          description: Name of the template the mailbox was created from (if any)
    Mailbox:
      type: object
      description: >-
        Details of a mailbox. `max_new_quota`, `spam_aliases`,
        `pushover_active`, `rl`, `rl_scope`, `is_relayed` and `sender_acl` are
        missing in the reduced form; `tags` is missing when the mailbox has no
        tags.
      properties:
        username:
          type: string
          description: Address of the mailbox
        active:
          type: integer
          description: 1 active, 0 inactive, 2 login disabled (mail is still accepted)
        active_int:
          type: integer
          description: Same as `active`
        domain:
          type: string
        name:
          type: string
          description: Full name
        local_part:
          type: string
        quota:
          type: integer
          description: Quota in bytes, 0 = unlimited
        messages:
          type: integer
          description: Number of messages
        attributes:
          $ref: "#/components/schemas/MailboxAttributes"
        custom_attributes:
          type: [object, array]
          description: Custom attributes (an empty list when there are none)
          additionalProperties:
            type: string
        quota_used:
          type: integer
          description: Used bytes
        percent_in_use:
          type: [integer, string]
          description: Used part of the quota in percent, "- " for unlimited quota
        created:
          type: string
        modified:
          type: [string, "null"]
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
        percent_class:
          type: string
          enum:
            - info
            - success
            - warning
            - danger
          description: info (unlimited), success, warning (≥ 75 %), danger (≥ 90 %)
        last_imap_login:
          type: integer
          description: Unix time of the last IMAP login, 0 = none
        last_smtp_login:
          type: integer
        last_pop3_login:
          type: integer
        last_sso_login:
          type: integer
        last_sogo_login:
          type: integer
        max_new_quota:
          type: integer
          description: Largest quota in bytes the mailbox may get (domain limits)
        spam_aliases:
          type: integer
          description: Number of valid time-limited aliases
        pushover_active:
          type: integer
          enum: [0, 1]
        rl:
          description: Effective rate limit, `false` if there is none
          oneOf:
            - $ref: "#/components/schemas/MailboxRatelimit"
            - type: boolean
              const: false
        rl_scope:
          type: string
          enum:
            - mailbox
            - domain
          description: Whether `rl` is the mailbox's own limit or the domain limit
        is_relayed:
          type: integer
          description: 1 if the domain is relayed (backup MX)
        sender_acl:
          type: array
          description: Addresses and @domains the mailbox may send as (internal, set by `sender_acl`)
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    MailboxAdd:
      type: object
      required:
        - local_part
        - domain
      properties:
        local_part:
          type: string
          description: Part before the @
        domain:
          type: string
          description: Domain of the mailbox
        name:
          type: string
          description: Full name (`<` and `>` at the ends are removed)
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
          default: mailcow
          description: >-
            Where the user logs in; an external source is accepted only if it is
            the configured identity provider, else mailcow is used
        password:
          type: string
          format: password
          description: >-
            Password (authsource mailcow), checked against the password policy;
            may be left empty together with `password2` for a shared mailbox
        password2:
          type: string
          format: password
          description: The password again
        template:
          type: [integer, string]
          description: ID of the mailbox template that provides the defaults (default the first template)
        quota:
          type: [integer, string]
          description: Quota in MiB, 0 = unlimited
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
          description: 1 active, 0 inactive, 2 login disabled (mail is accepted)
        tags:
          type: array
          items:
            type: string
          description: Tags (the first 26 are saved)
        protocol_access:
          type: array
          description: Allowed protocols; when sent it replaces the single `*_access` fields
          items:
            $ref: "#/components/schemas/ProtocolAccessName"
        imap_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        pop3_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        smtp_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sieve_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        eas_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        dav_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Login to SOGo from the UI
        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Password change at the first login (always 0 for external sources)
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          description: Two-factor setup at the first login (always 0 for generic-oidc)
        tls_enforce_in:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        tls_enforce_out:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        relayhost:
          type: [integer, string]
          default: 0
          description: ID of a sender-dependent transport, 0 = none
        shared:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
          default: 0
          description: Shared mailbox without a login of its own; members of groups open it
        quarantine_notification:
          type: string
          enum:
            - never
            - hourly
            - daily
            - weekly
        quarantine_category:
          type: string
          enum:
            - reject
            - add_header
            - all
        tagged_mail_handler:
          type: string
          enum:
            - subfolder
            - subject
            - none
          description: Handling of mail to address+tag, see `edit/delimiter_action`
        acl:
          type: array
          description: User ACLs to grant; when sent, all others are off
          items:
            $ref: "#/components/schemas/UserAclName"
        rl_value:
          type: [integer, string]
          description: Rate limit, messages per `rl_frame` (0 or empty = none)
        rl_frame:
          type: string
          enum:
            - s
            - m
            - h
            - d
        attribute_hash:
          type: string
          description: Internal, the hash of the template the values come from
    MailboxEdit:
      type: object
      properties:
        active:
          type: [integer, string]
          enum: [0, 1, 2, "0", "1", "2"]
          description: 1 active, 0 inactive, 2 login disabled (mail is accepted)
        name:
          type: string
          description: Full name; empty keeps the current name
        quota:
          type: [integer, string]
          description: Quota in MiB, 0 = unlimited; empty keeps the current quota
        password:
          type: string
          format: password
          description: New password (authsource mailcow only), checked against the password policy
        password2:
          type: string
          format: password
        authsource:
          type: string
          enum:
            - mailcow
            - keycloak
            - generic-oidc
            - ldap
          description: An external source is accepted only if it is the configured identity provider
        pw_recovery_email:
          type: string
          description: Address for password reset mails (authsource mailcow only)
        force_pw_update:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        force_tfa:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sogo_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        protocol_access:
          type: array
          description: Allowed protocols; when sent it replaces the single `*_access` fields
          items:
            $ref: "#/components/schemas/ProtocolAccessName"
        imap_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        pop3_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        smtp_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        sieve_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        eas_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        dav_access:
          type: [integer, string]
          enum: [0, 1, "0", "1"]
        relayhost:
          type: [integer, string]
