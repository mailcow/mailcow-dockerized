          description: "`no action`, `greylist`, `add header`, `rewrite subject`, `soft reject` or `reject`"
        thresholds:
          type: object
          additionalProperties:
            type: number
        ip:
          type: string
        user:
          type: string
          description: Authenticated user, `unknown` for incoming mail
        sender_smtp:
          type: string
        sender_mime:
          type: string
        rcpt_smtp:
          type: array
          items:
            type: string
        rcpt_mime:
          type: array
          items:
            type: string
        subject:
          type: string
        message-id:
          type: string
        size:
          type: integer
        is_skipped:
